/* ===================== Unit 5 lessons (cybersecurity, firewall, antivirus, encryption) ===================== */
const LESSONS_U5 = [
/* ---------- 5.1 + 5.5: cybersecurity basics & role in the modern ecosystem ---------- */
{ id:'cyber', unit:'u5', level:'Basics', title:'Cybersecurity basics & its role today', desc:'Threats, impact, protecting yourself, and why every sector needs security',
html:`
${simple('Your phone, bank, hospital and power grid all run on computers. <b>Cybersecurity</b> is the locks, alarms and good habits that stop people from stealing, breaking or snooping on them.')}
<div class="card"><b>Definition (learn word for word):</b> <b>Cyber security</b> is the practice of protecting digital systems, networks and data from <b>theft, damage or unauthorized access</b>.</div>
<p><b>Why it matters:</b> our lives and businesses are heavily reliant on digital technology. Everything from personal communication to <b>critical infrastructure</b> — power grids and healthcare systems — depends on secure digital systems.</p>
<h2>4 core concepts: threat, vulnerability, exploit &amp; risk</h2>
${simple('Think of your house. A <b>burglar</b> in the area is the threat. An <b>unlocked window</b> is the vulnerability. <b>Climbing in through that window</b> is the exploit. The <b>chance you get robbed, and how much you would lose</b>, is the risk.')}
${table(['Concept','Definition','Example'],[
 ['<b>Threat</b>','Any potential danger — a person, event or circumstance — that <b>could cause harm</b> to a system, network or data by stealing, damaging or disrupting it.','A hacker, a malware campaign, an insider, even a flood or fire'],
 ['<b>Vulnerability</b>','A <b>weakness or flaw</b> in hardware, software, a process or people that a threat can take advantage of.','Unpatched software, weak password, open port, untrained staff'],
 ['<b>Exploit</b>','A piece of <b>code, tool or technique</b> that takes advantage of a vulnerability to make the system behave in an unintended way, such as giving unauthorized access.','EternalBlue exploit used by WannaCry on an unpatched Windows flaw; SQL injection'],
 ['<b>Risk</b>','The <b>likelihood</b> that a threat will exploit a vulnerability, combined with the <b>impact</b> (damage or loss) if it happens.','High risk: old unpatched server holding customer data, open to the Internet']])}
<div class="card"><b>How they connect:</b> a <b>threat</b> uses an <b>exploit</b> on a <b>vulnerability</b>; the <b>risk</b> is how likely that is and how bad it would be.<div class="u-formula mono">Risk = Threat × Vulnerability × Impact &nbsp;(often written Likelihood × Impact)</div><span class="muted">If any one factor is zero, the risk is zero: patch the vulnerability and the threat has nothing to exploit. Security teams usually can’t remove threats, so they reduce risk by fixing vulnerabilities.</span></div>
${tryBox('Threat, vulnerability, exploit or risk?', `<div id="tverChooser"></div>`)}
<h2>Types of cyber threats</h2>
${table(['Threat','What it is'],[
 ['<b>Malware</b>','Malicious software such as <b>viruses, worms, ransomware and spyware</b>. Each works differently, but all aim to compromise or damage computer systems and data.'],
 ['<b>Phishing</b>','Deceptive emails or websites that trick people into revealing personal, financial or sensitive information. Fake sites <b>mimic trusted organizations</b>.'],
 ['<b>Social engineering</b>','The art of manipulating people into giving away confidential data. Tactics: <b>pretexting</b> (invented scenario), <b>baiting</b> (enticing with malware-infected files), <b>tailgating</b> (following someone in to gain physical access).'],
 ['<b>Denial of Service (DoS / DDoS)</b>','Overwhelming systems or networks with traffic so the real service is disrupted. DDoS = from many machines at once.'],
 ['<b>Data breach</b>','Sensitive data is exposed or stolen.'],
 ['<b>Insider threat</b>','An attack or leak by someone already inside the organization.']])}
<h2>Malware vs virus</h2>
${simple('<b>Malware</b> is the umbrella word for <i>any</i> harmful software. A <b>virus</b> is just one kind of malware. Every virus is malware, but not all malware is a virus — like every car is a vehicle, but a truck or a bike is a vehicle too.')}
<div class="card"><b>Virus (definition):</b> a type of malware that <b>attaches itself to a host file or program</b> and <b>copies itself</b> into other files. It only runs and spreads when a <b>user opens or runs</b> the infected file.</div>
${table(['Point','Malware','Virus'],[
 ['Meaning','General term for any malicious software','One specific type of malware'],
 ['Scope','Viruses, worms, Trojans, ransomware, spyware, adware','Only self-replicating code attached to a host file'],
 ['Needs a host file?','Depends on the type (worms don’t)','Yes, always'],
 ['Needs a user action?','Not always (worms spread by themselves)','Yes, someone must run the infected file'],
 ['How it spreads','Many ways: network, email, downloads, fake apps','Copies itself into other files when the host runs'],
 ['Examples','WannaCry (ransomware), Zeus (Trojan), keyloggers (spyware)','ILOVEYOU, Melissa macro virus, CIH']])}
${table(['Type of malware','How it works'],[
 ['<b>Virus</b>','Attaches to a host file; spreads when the file is run'],
 ['<b>Worm</b>','Standalone; spreads over the network by itself, no user action needed'],
 ['<b>Trojan</b>','Pretends to be useful software but secretly does harm (e.g. opens a backdoor); does not self-replicate'],
 ['<b>Ransomware</b>','Encrypts/locks files and demands payment'],
 ['<b>Rootkit</b>','Hides deep in the system to give an attacker secret, ongoing control while staying undetected'],
 ['<b>Spyware</b>','Secretly watches the user and sends data (keyloggers)']])}
${tryBox('Which type of malware is it?', sorter('mwSort',[
 ['Hides inside a Word macro and spreads when the document is opened','Virus'],
 ['Infects .exe files and copies itself into others when they run','Virus'],
 ['Spreads across the office network on its own, no one clicks anything','Worm'],
 ['A free game download that secretly opens a backdoor for an attacker','Trojan'],
 ['Locks all your files and demands Bitcoin to unlock them','Ransomware'],
 ['Quietly records everything you type and sends it to a stranger','Spyware'],
 ['Hides itself and gives an attacker secret admin-level control of the machine','Rootkit']],
 ['Virus','Worm','Trojan','Ransomware','Spyware','Rootkit']))}
<h3>Ransomware &amp; rootkit — word for word</h3>
<div class="card"><b>Ransomware (definition):</b> a type of malware that <b>encrypts or locks</b> the victim’s files or whole system and then <b>demands a payment (a ransom)</b> — often in cryptocurrency — in exchange for restoring access. Even if the ransom is paid, there is <b>no guarantee</b> the files are recovered.<ul style="margin:6px 0 0"><li><b>How it spreads:</b> phishing email attachments, malicious links, or by exploiting unpatched software (WannaCry spread as a worm).</li><li><b>Example:</b> <b>WannaCry</b> (2017) locked files on hundreds of thousands of machines worldwide.</li><li><b>Defence:</b> regular <b>offline backups</b>, software updates, and caution with attachments.</li></ul></div>
<div class="card"><b>Rootkit (definition):</b> a type of malware designed to gain <b>privileged (root/administrator) access</b> to a system and then <b>hide its own presence</b> — and often the presence of other malware — from the user and from antivirus software, giving an attacker secret, long-term control.<ul style="margin:6px 0 0"><li><b>Why it’s dangerous:</b> because it hides at a deep level, it is <b>very hard to detect and remove</b>.</li><li><b>How it spreads:</b> usually bundled with a Trojan or installed after another exploit grants access.</li><li><b>Defence:</b> keep systems patched, use reputable security tools, and in severe cases rebuild the system from a clean install.</li></ul></div>
<h2>Virus vs worm</h2>
${simple('A <b>virus</b> needs a host file and a person to run it. A <b>worm</b> is a standalone program that spreads across networks <b>by itself</b>. Trick: a virus is a <b>passenger</b> (needs a ride and a driver); a worm is a <b>walker</b> (moves on its own).')}
${table(['Point','Virus','Worm'],[
 ['Host file','Needs a host: attaches to an .exe, document or macro','Standalone; needs no host file'],
 ['User action','Needs a user to open or run the infected file','Needs no user action'],
 ['How it spreads','Through infected files shared by USB, email attachments or downloads','Through networks, by exploiting vulnerabilities (unpatched software, open ports)'],
 ['Speed','Slower, because it depends on people sharing files','Very fast; can infect thousands of machines in hours'],
 ['Main damage','Corrupts, modifies or deletes files on the infected computer','Uses up bandwidth and system resources; often carries other malware (a payload)'],
 ['Examples','ILOVEYOU, Melissa macro virus, CIH','WannaCry (ransomware spread as a worm), Morris worm (1988), Code Red, Conficker']])}
<div class="card"><b>Links to other topics:</b><ul style="margin:6px 0 0"><li>A worm is a clear case of a <b>threat</b> using an <b>exploit</b> on a <b>vulnerability</b> — WannaCry used the EternalBlue exploit on unpatched Windows machines.</li><li>That is why <b>software updates</b> are a best practice: patching removes the vulnerability the worm needs.</li><li>A <b>firewall</b> can block a worm’s network traffic, but can’t stop a virus inside a file — that is the <b>antivirus</b>’s job.</li></ul></div>
${tryBox('Virus or worm?', sorter('vwSort',[
 ['Spreads only when someone opens an infected email attachment','Virus'],
 ['Jumps from PC to PC across the college LAN overnight, no one clicks anything','Worm'],
 ['Copies itself into other .exe files on a pen drive','Virus'],
 ['Scans the Internet for unpatched servers and infects them automatically','Worm'],
 ['Melissa — hidden in a Word document macro','Virus'],
 ['Morris (1988) — slowed down much of the early Internet','Worm']],
 ['Virus','Worm']))}
<h2>Trojan horse</h2>
${simple('In the old Greek story, soldiers hid inside a giant wooden horse given as a “gift”. The people of Troy pulled it inside their own walls. A <b>Trojan</b> works the same way: it <b>looks like useful software</b>, you install it yourself, and once inside it secretly does harm.')}
<div class="card"><b>Trojan (definition):</b> a type of malware that <b>disguises itself as legitimate, useful software</b> to trick the user into installing it. Once running, it performs hidden harmful actions. Unlike a virus or worm, a Trojan <b>does not replicate itself</b>.</div>
<h3>Key features</h3>
<ul><li><b>Deception:</b> spreads by tricking the user (fake game, cracked software, fake update, email attachment), not by copying itself.</li><li><b>No self-replication:</b> it doesn’t infect other files or spread over the network on its own.</li><li><b>Needs user action:</b> the user must download and run it.</li><li><b>Hidden payload:</b> often runs quietly in the background so the user doesn’t notice.</li></ul>
${table(['Type of Trojan','What it does'],[
 ['<b>Backdoor Trojan</b>','Opens a secret entry so the attacker can control the computer remotely'],
 ['<b>RAT</b> (Remote Access Trojan)','Gives the attacker full remote control: files, webcam, keystrokes'],
 ['<b>Banking Trojan</b>','Steals online banking logins and card details (e.g. Zeus)'],
 ['<b>Downloader Trojan</b>','Downloads and installs other malware such as ransomware'],
 ['<b>Fake antivirus (scareware)</b>','Shows fake “virus found” alerts to make you pay or install more malware']])}
<h3>Virus vs worm vs Trojan</h3>
${table(['Point','Virus','Worm','Trojan'],[
 ['Host file','Needs one','Standalone','Standalone (posing as a useful program)'],
 ['Self-replicates?','Yes','Yes','<b>No</b>'],
 ['User action','Must run the infected file','None needed','Must install/run it, tricked by its disguise'],
 ['Spreads by','Infected files being shared','Networks, exploiting vulnerabilities','Deception: fake downloads, attachments, cracked software'],
 ['Main goal','Damage or modify files','Spread fast, use resources, carry payloads','Steal data, spy, or give the attacker a backdoor'],
 ['Examples','ILOVEYOU, Melissa','WannaCry, Morris','Zeus, Emotet']])}
<div class="card"><b>Memory trick:</b> virus = <b>passenger</b> (needs a ride), worm = <b>walker</b> (moves on its own), Trojan = <b>disguised guest</b> (you invite it in yourself).<br><b>Protection:</b> download only from official sources, avoid cracked software, don’t open unknown attachments, keep antivirus updated.</div>
${tryBox('Virus, worm or Trojan?', sorter('vwtSort',[
 ['A free “photo editor” that secretly sends your passwords to an attacker','Trojan'],
 ['A cracked copy of a paid game that installs a backdoor','Trojan'],
 ['An email offering a “bank security update” that steals your net-banking login','Trojan'],
 ['Copies itself into other programs when an infected file is run','Virus'],
 ['Spreads through unpatched servers on the network with no clicks','Worm'],
 ['Pop-up: “51 viruses found! Buy our antivirus now”','Trojan']],
 ['Virus','Worm','Trojan']))}
<h2>Network attacks</h2>
${simple('Malware attacks a <b>computer</b>. A network attack targets the <b>roads between computers</b>: listening in on the traffic, pretending to be someone else, or jamming the road so nobody can use it.')}
<div class="card"><b>Network attack (definition):</b> any attempt to gain unauthorized access to a network, or to <b>intercept, alter, steal or disrupt</b> the data travelling across it or the services running on it.</div>
${table(['Point','Passive attack','Active attack'],[
 ['What the attacker does','Only <b>watches / listens</b> to traffic','<b>Changes, injects or blocks</b> traffic'],
 ['Data modified?','No','Yes'],
 ['Easy to detect?','Hard, because nothing changes','Easier, because systems behave differently'],
 ['Security goal harmed','Confidentiality','Integrity and availability'],
 ['Best defence','<b>Encryption</b> (prevent)','<b>Detection</b> and response (firewall, IDS/IPS)'],
 ['Examples','Eavesdropping/sniffing, traffic analysis','DoS/DDoS, MITM, spoofing, session hijacking, replay']])}
<h3>Common types of network attack</h3>
${table(['Attack','How it works','Defence'],[
 ['<b>DoS / DDoS</b>','Floods a server or network with fake traffic so real users can’t get through. DDoS uses many machines (a <b>botnet</b>).','Firewall rules, traffic filtering, DDoS protection services'],
 ['<b>Man-in-the-middle (MITM)</b>','Attacker secretly sits between two parties, reading or changing messages as they pass.','Encryption (HTTPS, VPN), certificates'],
 ['<b>Eavesdropping / sniffing</b>','Captures packets on the network (often public Wi-Fi) to read passwords and data. Passive.','Encryption; avoid open Wi-Fi or use a VPN'],
 ['<b>IP spoofing</b>','Forges the <b>source IP address</b> in packets so they look like they come from a trusted machine — used to bypass filters or hide the attacker.','Ingress/egress packet filtering, authentication, don’t trust IP alone'],
 ['<b>ARP spoofing / poisoning</b>','On a LAN, sends <b>fake ARP replies</b> so the victim ties the attacker’s MAC address to another device’s IP; traffic is redirected to the attacker (often to set up MITM).','Static ARP entries, dynamic ARP inspection, encryption'],
 ['<b>DNS spoofing / poisoning</b>','Corrupts DNS records (poisons the resolver cache) so a correct web address resolves to a <b>fake IP</b>, sending users to a malicious look-alike site.','DNSSEC, trusted resolvers, secure/flush the cache'],
 ['<b>Session hijacking</b>','Steals a logged-in user’s session cookie/token and takes over their session.','HTTPS, short sessions, log out'],
 ['<b>Port scanning</b>','Probes a network to find open ports and weak services — usually the first step of an attack.','Close unused ports, firewall, IDS'],
 ['<b>Brute-force / password attack</b>','Tries many passwords until one works.','Strong passwords, account lockout, 2FA'],
 ['<b>Replay attack</b>','Captures valid data (e.g. a login message) and sends it again later.','Timestamps, one-time tokens'],
 ['<b>Insider threat</b>','An attack, leak or sabotage by someone who already has <b>legitimate access</b> — an employee, contractor or partner — whether malicious or simply careless.','Least-privilege access, logging &amp; monitoring, revoke access on exit, training']])}
<h3>Eight key attacks — word for word</h3>
<div class="grid">
<div class="card" style="margin:0"><b>DoS / DDoS</b><br><b>Denial of Service</b> floods a server or network with so much fake traffic that <b>real users can’t get through</b>. A <b>DDoS</b> (Distributed DoS) does this from <b>many machines at once</b> — a botnet of infected devices. Harms <b>availability</b>. <span class="muted">Defence: traffic filtering, rate limiting, DDoS-protection services.</span></div>
<div class="card" style="margin:0"><b>IP spoofing</b><br>The attacker <b>forges the source IP address</b> in packets so they appear to come from a trusted machine, to bypass IP-based filters or hide their identity. <span class="muted">Defence: ingress/egress filtering, authentication that doesn’t rely on IP alone.</span></div>
<div class="card" style="margin:0"><b>ARP spoofing (ARP poisoning)</b><br>On a local network the attacker sends <b>fake ARP replies</b> so the victim’s device maps the attacker’s MAC address to a legitimate IP. Traffic is then <b>redirected through the attacker</b>, enabling eavesdropping or a man-in-the-middle attack. <span class="muted">Defence: static ARP entries, dynamic ARP inspection, encryption.</span></div>
<div class="card" style="margin:0"><b>DNS poisoning (DNS spoofing)</b><br>The attacker <b>corrupts DNS records</b> or the resolver’s cache so a correct web address resolves to a <b>fake IP address</b>, silently sending users to a malicious look-alike site. <span class="muted">Defence: DNSSEC, trusted resolvers, securing the DNS cache.</span></div>
<div class="card" style="margin:0"><b>Brute-force attack</b><br>The attacker <b>tries many passwords or keys</b> — systematically or from a wordlist (dictionary attack) — until one works. <span class="muted">Defence: long unique passwords, account lockout / rate limiting, 2FA.</span></div>
<div class="card" style="margin:0"><b>Port scanning</b><br><b>Reconnaissance:</b> the attacker probes a target to find <b>which ports are open</b> and which services run on them, revealing possible ways in. Usually the <b>first step</b> before an attack. <span class="muted">Defence: close unused ports, firewall, intrusion detection.</span></div>
<div class="card" style="margin:0"><b>Session hijacking</b><br>After a user logs in, the attacker <b>steals their session cookie/token</b> and uses it to <b>take over the active session</b> — getting in <b>without the password</b>. <span class="muted">Defence: HTTPS everywhere, short-lived sessions, logging out.</span></div>
<div class="card" style="margin:0"><b>Insider threat</b><br>A security risk from <b>someone who already has legitimate access</b> — an employee, contractor or partner. It can be <b>malicious</b> (deliberate theft or sabotage) or <b>accidental</b> (careless mistakes, lost devices). <span class="muted">Defence: least-privilege access, monitoring, revoke access when people leave, training.</span></div>
</div>
<div class="card"><b>Defences against network attacks:</b> firewall · encryption (HTTPS, VPN, IPSec) · IDS/IPS (intrusion detection/prevention) · strong authentication + 2FA · regular patching · network monitoring · avoiding public Wi-Fi.<br><b>Memory trick:</b> passive = a <b>spy listening</b>; active = a <b>thief changing</b> things.</div>
${tryBox('Name the network attack', `<div id="netAtkChooser"></div>`)}
<div class="card"><b>Memory trick:</b> <i><b>M</b>y <b>P</b>hone <b>S</b>ends <b>D</b>ata</i> = Malware, Phishing, Social engineering, DoS (the four on the slide).</div>
<h2>Impact of cyber attacks</h2>
<p>Attacks lead to <b>data breaches, financial losses</b>, and even <b>physical harm</b> when critical infrastructure is hit. Example: the <b>2017 WannaCry ransomware</b> attack affected over <b>300,000 computers in 150 countries</b>, causing extensive financial damage.</p>
${tryBox('Name that threat', `<div id="threatChooser"></div>`)}
<h2>Protecting personal information (5 steps)</h2>
<ol><li>Use <b>strong, unique passwords</b>.</li><li>Avoid <b>oversharing</b> on social media.</li><li>Turn on <b>Two-Factor Authentication (2FA)</b>.</li><li>Use <b>secure Wi-Fi</b> networks.</li><li>Be cautious with <b>email attachments and links</b>.</li></ol>
${tryBox('Password strength checker', `<p class="muted" style="margin-top:0">Type a made-up password (it never leaves this page). Each tick is one thing attackers find harder.</p>
<input id="pwIn" type="text" autocomplete="off" placeholder="e.g. coffee123" style="width:100%;max-width:340px">
<div class="u-pwbar"><i id="pwBar"></i></div><ul id="pwList" class="u-checks"></ul>`)}
<h2>Best practices for organizations (4 guidelines)</h2>
<div class="grid">
${reveal('1. Data backups','If ransomware locks files, you restore from a clean backup instead of paying.')}
${reveal('2. Regular software updates','Updates patch the vulnerabilities attackers use.')}
${reveal('3. Employee training & awareness','Most attacks start with a human clicking something; trained people spot phishing.')}
${reveal('4. Regular security audits','Check systems on a schedule to find weaknesses before attackers do.')}
</div>
<p><b>Reporting &amp; staying informed:</b> cyber security <b>communities and forums</b> (e.g. the Global Cyber Security Forum) help people and organizations stay informed, share knowledge and collaborate.</p>
<h2>Role of cybersecurity in the modern ecosystem</h2>
<p>The digital ecosystem keeps growing: <b>cloud computing and IoT</b> expand, online services and digital transactions increase, and everything depends on <b>interconnected systems</b>. More connections = more doors for attackers.</p>
<h3>5 components of the cybersecurity ecosystem</h3>
${table(['Component','Protects'],[['Network security','Traffic and devices on the network (firewalls, IDS)'],['Application security','Software and apps from bugs attackers exploit'],['Cloud security','Data and services hosted in the cloud'],['Endpoint protection','Individual devices — laptops, phones (antivirus)'],['Data privacy &amp; compliance','Personal data, and following the laws about it']])}
<div class="grid">
<div class="card" style="margin:0"><h3>In business</h3><ul><li>Protects sensitive data &amp; intellectual property</li><li>Maintains customer trust</li><li>Ensures business continuity</li><li>Avoids legal penalties</li></ul></div>
<div class="card" style="margin:0"><h3>In government &amp; public infrastructure</h3><ul><li>Safeguards critical infrastructure (energy, transport, healthcare)</li><li>National security and defence</li><li>Protects from cyber espionage and sabotage</li></ul></div>
<div class="card" style="margin:0"><h3>Emerging technologies</h3><ul><li>AI &amp; machine learning for threat detection</li><li>Blockchain for secure transactions</li><li>Cloud security challenges</li><li>Quantum computing: risks and opportunities</li></ul></div>
<div class="card" style="margin:0"><h3>Human factor</h3><ul><li>Cybersecurity awareness</li><li>Social engineering prevention</li><li>Training and ethical behaviour</li></ul></div>
</div>
<p><b>Global policies &amp; collaboration:</b> standards <b>ISO 27001, GDPR, NIST</b>; cross-border cooperation against cybercrime; <b>CERTs</b> (Computer Emergency Response Teams) and <b>Interpol</b>.</p>
<p><b>Conclusion:</b> cybersecurity is a <b>shared responsibility</b>; we need <b>proactive and adaptive</b> defence to build a secure, resilient digital future.</p>
${counts('four core concepts (threat, vulnerability, exploit, risk) · malware vs virus (5 malware types: virus, worm, Trojan, ransomware, spyware) · virus vs worm (6 points) · Trojan: 4 features, 5 types · network attacks: 2 kinds (passive/active), 11 types (DoS/DDoS, MITM, eavesdropping, IP/ARP/DNS spoofing, session hijacking, port scanning, brute-force, replay, insider threat) · four threat types on the slide (+ data breach, insider threat in the ecosystem deck) · five steps to protect personal info · four best practices · five ecosystem components · four business reasons · three government roles · three standards (ISO 27001, GDPR, NIST).')}
${model('What is cyber security? Explain common cyber threats and how to protect against them (5 marks)','Definition sentence → why it matters (critical infrastructure) → table of Malware, Phishing, Social engineering (pretexting, baiting, tailgating), DoS → impact with the WannaCry example (300,000 computers, 150 countries) → 5 personal protection steps + 4 organizational best practices → conclusion: shared responsibility.')}
${model('Explain the role of cybersecurity in the modern ecosystem (5 marks)','Growing ecosystem (cloud, IoT, online transactions) → 5 components → role in business (4 points) and government (3 points) → emerging tech (AI, blockchain, quantum) → human factor → global standards ISO 27001 / GDPR / NIST, CERTs, Interpol → conclusion.')}
${traps(['Calling phishing “malware” — phishing is a trick to get information; malware is software.','Forgetting the three social-engineering tactics: pretexting, baiting, tailgating.','WannaCry was <b>ransomware</b> (2017) that spread like a worm, not a virus or DoS.','Using “malware” and “virus” as the same word. Virus is only <b>one type</b> of malware.','Saying a worm needs a host file or a user click. That is a <b>virus</b>; a worm spreads by itself.','Saying a Trojan copies itself. It <b>doesn’t replicate</b>; it spreads by deception.','Calling eavesdropping an active attack — it is <b>passive</b> (only listens). DoS, MITM and spoofing are active.','Mixing DoS (one source) and DDoS (distributed, many sources).'])}`,
init(){
 initSorter('mwSort');
 initSorter('vwSort');
 initSorter('vwtSort');
 initChooser('netAtkChooser',[
  ['On café Wi-Fi, someone captures packets and reads the passwords you send.','Eavesdropping','Passive sniffing; prevented by encryption.'],
  ['An attacker sits between you and your bank, silently reading and changing the money transfer.','Man-in-the-middle','Intercepts and alters traffic between two parties.'],
  ['Thousands of infected IoT cameras flood a gaming server until it crashes.','DDoS','Many machines (a botnet) overwhelm one target.'],
  ['You type the correct bank URL but are sent to a fake look-alike site because the address lookup was poisoned.','Spoofing','DNS spoofing — a faked identity/address.'],

 initChooser('tverChooser',[

  const n=checks.filter(c=>c[1]).length;

 inp.oninput=upd;upd();

keys:['Cyber security = protecting digital systems, networks and data from theft, damage or unauthorized access.','Malware = umbrella term for any malicious software; virus = one type of malware that attaches to a host file and spreads when a user runs it. Every virus is malware, not all malware is a virus.','Virus vs worm: virus needs a host file + user action, spreads via shared files, slower; worm is standalone, spreads over networks by itself by exploiting vulnerabilities, very fast (WannaCry, Morris).','Trojan = malware disguised as useful software; the user installs it; it does NOT self-replicate. Types: backdoor, RAT, banking (Zeus), downloader, fake antivirus.','Network attack = attempt to gain unauthorized access to a network or intercept, alter, steal or disrupt its data/services. Passive (eavesdropping, traffic analysis; defend with encryption) vs active (DoS/DDoS, MITM, spoofing, session hijacking, replay; detect with firewall/IDS). Also port scanning and brute force.','4 core concepts: Threat = potential danger that could cause harm; Vulnerability = weakness a threat can use; Exploit = code/technique that takes advantage of a vulnerability; Risk = likelihood × impact of a threat exploiting a vulnerability.','Threats: Malware (virus, worm, ransomware, spyware), Phishing, Social engineering (pretexting, baiting, tailgating), DoS/DDoS, data breach, insider threat.','WannaCry 2017 ransomware: 300,000+ computers, 150 countries.','Protect personal info: strong unique passwords, don’t overshare, 2FA, secure Wi-Fi, careful with attachments/links.','Best practices: backups, updates, training, audits. Standards: ISO 27001, GDPR, NIST; CERTs and Interpol.'],

{q:'Which statement is correct?',o:['Every malware is a virus','Every virus is malware','Malware and virus mean exactly the same','A worm is a type of virus'],a:1,e:'Virus is one type of malware; worms, Trojans, ransomware and spyware are other types.'},
{q:'Unlike a worm, a virus…',o:['Spreads across the network by itself','Needs a host file and a user to run it','Cannot copy itself','Only encrypts files'],a:1,e:'A virus attaches to a host file; a worm is standalone and self-spreading.'},
{q:'Which malware spreads across a network by itself without any user action?',o:['Virus','Worm','Trojan','Adware'],a:1,e:'A worm is standalone and self-spreading; a virus needs a host file and a user.'},
{q:'The Melissa macro hidden in a Word document is an example of a…',o:['Worm','Virus','DoS attack','Firewall'],a:1,e:'It needed a host document and a user to open it.'},
{q:'Which malware does NOT replicate itself?',o:['Virus','Worm','Trojan','All of them replicate'],a:2,e:'A Trojan spreads by tricking users, not by copying itself.'},
{q:'A free app that looks useful but secretly gives an attacker remote control is a…',o:['Worm','Trojan','Firewall','DoS attack'],a:1,e:'Disguised as legitimate software = Trojan (this one is a RAT/backdoor).'},
{q:'Which is a PASSIVE network attack?',o:['DDoS','Eavesdropping / sniffing','Man-in-the-middle that changes messages','Replay attack'],a:1,e:'Passive attacks only listen; nothing is changed.'},
{q:'An attacker secretly intercepting and altering messages between two parties is a…',o:['Port scan','Man-in-the-middle attack','Brute-force attack','Trojan'],a:1,e:'MITM; defend with encryption such as HTTPS or a VPN.'},
{q:'Faking the source IP address of packets is called…',o:['IP spoofing','Session hijacking','Sniffing','Replay'],a:0,e:'Spoofing = faking an identity (IP, DNS, ARP).'},
{q:'A weakness in a system that an attacker can take advantage of is a…',o:['Threat','Vulnerability','Exploit','Risk'],a:1,e:'Vulnerability = weakness or flaw (e.g. unpatched software, weak password).'},
{q:'The code or technique used to take advantage of a weakness is called…',o:['An exploit','A risk','A threat','A firewall'],a:0,e:'An exploit uses a vulnerability to cause unintended behaviour.'},
{q:'Risk is best described as…',o:['Any hacker on the Internet','A bug in software','The likelihood a threat exploits a vulnerability, and the impact if it does','A piece of malware'],a:2,e:'Risk = Threat × Vulnerability × Impact (likelihood × impact).'},
{q:'Cyber security protects digital systems, networks and data from…',o:['Power cuts only','Theft, damage or unauthorized access','Slow internet','Software licensing'],a:1,e:'That is the slide definition.'},
{q:'A fake website that copies your bank’s login page is…',o:['DoS','Phishing','Tailgating','A worm'],a:1,e:'Phishing mimics trusted organizations to steal information.'},
{q:'Following an employee through a secure door is called…',o:['Baiting','Pretexting','Tailgating','Spoofing'],a:2,e:'Tailgating = gaining unauthorized physical access.'},
{q:'The 2017 WannaCry attack was a…',o:['Phishing campaign','Ransomware attack','DDoS attack','Insider threat'],a:1,e:'Ransomware; 300,000+ computers in 150 countries.'},
{q:'Which is NOT one of the 5 steps for protecting personal information?',o:['Use 2FA','Avoid oversharing','Disable all updates','Use secure Wi-Fi'],a:2,e:'Updates are a best practice — never disable them.'},
{q:'Which of these is a cybersecurity standard/regulation named in the slides?',o:['HTTP','ISO 27001','IPv4','SDLC'],a:1,e:'ISO 27001, GDPR and NIST.'},
{q:'“Endpoint protection” secures…',o:['Individual devices like laptops and phones','Only the cloud','Only the network cables','Only web apps'],a:0,e:'Endpoints are the devices at the edge of the network.'},

/* ---------- 5.2: firewall ---------- */
{ id:'firewall', unit:'u5', level:'Core', title:'Firewalls', desc:'Definition, capabilities, limitations, features, packet filter vs circuit vs application gateway',
html:`
${simple('A firewall is the <b>security guard at the gate</b> between your private network and the Internet. Every packet is checked against a rule list; it is let in or turned away.')}
<div class="card"><b>Definition (learn word for word):</b> A <b>firewall</b> is a dedicated <b>hardware, or software, or a combination of both</b>, which inspects network traffic passing through it, and <b>denies or permits</b> passage based on a <b>set of rules</b>.</div>
<ul><li>As the name implies, it provides <b>secured access between two networks</b>.</li><li>An effective means of protecting a local system or network from network-based threats while still allowing access to the outside world via WANs or the Internet.</li></ul>
<div class="svgbox"><svg viewBox="0 0 600 170" role="img" aria-label="Firewall between the Internet and a private network">
<rect x="250" y="20" width="330" height="130" rx="14" fill="none" stroke="var(--muted)" stroke-dasharray="6 5"/><text x="415" y="40" text-anchor="middle" font-size="12" fill="var(--muted)">Security perimeter</text>
<ellipse cx="95" cy="88" rx="78" ry="42" fill="var(--c2)"/><text x="95" y="93" text-anchor="middle" font-weight="700" style="fill:#fff">Internet</text>
<path d="M173 88H262M318 88H420" stroke="var(--muted)" stroke-width="3"/>
<rect x="262" y="60" width="56" height="56" rx="6" fill="var(--c5)"/><path d="M262 78h56M262 98h56M282 60v18M300 78v20M282 98v18" stroke="#fff" stroke-width="2"/>
<text x="290" y="134" text-anchor="middle" font-size="12.5" font-weight="700">Firewall</text>
<rect x="420" y="58" width="140" height="60" rx="30" fill="var(--c1)"/><text x="490" y="93" text-anchor="middle" font-weight="700" style="fill:#fff">Private network</text>
<text x="215" y="78" text-anchor="middle" font-size="18">✓</text><text x="215" y="112" text-anchor="middle" font-size="18" fill="var(--bad)">✗</text>
</svg></div>
<h2>Capabilities (4)</h2>
<ul><li>Defines a <b>single choke point</b> that keeps unauthorized users out of the protected network.</li><li>Provides a location for <b>monitoring security-related events</b> — audits and alarms can be implemented on it.</li><li>A convenient platform for several <b>Internet functions that are not security related</b> (e.g. NAT, usage logging).</li><li>Can serve as the platform for <b>IPSec</b>; using tunnel mode it can implement a <b>VPN</b> (virtual private network).</li></ul>
<h2>Limitations (3)</h2>
<div class="card trap" style="margin-top:0"><ul><li>Cannot protect against attacks that <b>bypass</b> the firewall (e.g. a dial-up/mobile connection that doesn’t go through it).</li><li>Does not protect against <b>internal threats</b>.</li><li>Cannot protect against the transfer of <b>virus-infected programs or files</b>.</li></ul></div>
<p><b>Trick:</b> <i>“Bypass, Inside, Infected”</i> — what a firewall can’t stop.</p>
<h2>Features of a firewall (10)</h2>
<p>Port control · Network Address Translation (NAT) · Application monitoring (program control) · Packet filtering · Data encryption · Hiding presence · E-mail virus protection · Pop-up ad blocking · Cookie digestion · Spyware protection.</p>
<h2>Classification of firewalls</h2>
<p>Characterized by the <b>protocol level</b> it controls: <b>packet filtering</b>, <b>circuit gateways</b>, <b>application gateways</b>.</p>
${table(['','Packet filtering','Circuit-level gateway','Application gateway (proxy)'],[
 ['How it works','Applies a set of rules to <b>each incoming IP packet</b>, then forwards or discards it. Filters both directions. Rules match fields in the <b>IP or TCP header</b>.','Does <b>not</b> examine individual packets; monitors <b>TCP or UDP sessions</b>. Once a session is set up, the port stays open for all its packets; closed when the session ends.','Also called <b>proxy server</b>; relays application-level traffic (Telnet, FTP, SMTP, HTTP). Breaks the client/server model: <b>two connections</b> — source→proxy and proxy→destination.'],
 ['Advantages','Simplicity · transparency to users · high speed','Checks once per session, so it is fast after setup','Higher security than packet filters · only a few allowable applications to scrutinize · easy to log and audit all incoming traffic'],
 ['Disadvantages','Difficult to set up packet filter rules · lack of authentication','Doesn’t look inside packets once the session is open','Additional processing overhead on each connection (gateway acts as a splice point)']])}
${tryBox('Be the packet filter', `<p class="muted" style="margin-top:0">Rules are checked <b>top to bottom; the first match wins</b>. Decide what happens to each packet, then see which rule decided it.</p>
<ol class="u-rules" id="fwRules"></ol><div class="stepbody" id="fwPkt"></div>
<div class="row"><button class="btn" data-d="ALLOW">✓ Allow</button><button class="btn ghost" data-d="DROP">✗ Drop</button><button class="btn ghost" id="fwNext">Next packet ▶</button></div>
<p id="fwMsg"></p><p class="muted">Score: <b id="fwScore">0 / 0</b></p>`)}
${counts('3 parts of the definition (hardware/software/both) · 4 capabilities · 3 limitations · 10 features · 3 classifications.')}
${model('What is a firewall? Explain its types with advantages and disadvantages (5 marks)','Definition → firewall diagram between Internet and private network → capabilities (choke point, monitoring, non-security functions, IPSec/VPN) → limitations → the 3-column comparison table with each type’s working, advantages and disadvantages → conclusion: application gateway gives most security, packet filter most speed.')}
${traps(['A firewall does <b>not</b> stop viruses inside files — that is antivirus.','A firewall does <b>not</b> protect against insiders.','Circuit gateway checks <b>sessions</b>, not individual packets.','Application gateway = <b>proxy server</b>, uses <b>two</b> connections.'])}`,
init(){
 const RULES=[
  ['Any packet from blacklisted IP 203.0.113.66','DROP',p=>p.src==='203.0.113.66'],
  ['Incoming TCP to port 80 or 443 (web server)','ALLOW',p=>p.dir==='in'&&p.proto==='TCP'&&(p.port===80||p.port===443)],
  ['Incoming TCP to port 25 (mail server)','ALLOW',p=>p.dir==='in'&&p.proto==='TCP'&&p.port===25],
  ['Any TCP to port 23 (Telnet)','DROP',p=>p.proto==='TCP'&&p.port===23],
  ['Any outgoing packet from inside','ALLOW',p=>p.dir==='out'],
  ['Default: everything else','DROP',()=>true]];
 const PK=shuffle([
  {dir:'in',src:'198.51.100.7',proto:'TCP',port:443,d:'A visitor opens your website over HTTPS'},
  {dir:'in',src:'203.0.113.66',proto:'TCP',port:80,d:'A web request from a blacklisted address'},
  {dir:'in',src:'192.0.2.40',proto:'TCP',port:23,d:'Someone outside tries a Telnet login'},
  {dir:'out',src:'10.0.0.12',proto:'TCP',port:443,d:'A student inside opens Google'},
  {dir:'in',src:'192.0.2.99',proto:'UDP',port:3389,d:'An unknown outsider probes port 3389'},
  {dir:'in',src:'198.51.100.21',proto:'TCP',port:25,d:'Email arrives for your mail server'},
  {dir:'out',src:'10.0.0.5',proto:'TCP',port:23,d:'An inside PC tries Telnet to an outside host'}]);
 $('#fwRules').innerHTML=RULES.map(r=>`<li><b class="${r[1]==='ALLOW'?'ok':'bad'}">${r[1]}</b> — ${r[0]}</li>`).join('');
 let k=0,score=0,tried=0,answered=false;
 const show=()=>{const p=PK[k%PK.length];answered=false;$$('#fwRules li').forEach(li=>li.classList.remove('hit'));
  $('#fwPkt').innerHTML=`<b>${p.d}</b><br><code>${p.dir==='in'?'IN ⬅':'OUT ➡'} · src ${p.src} · ${p.proto} · port ${p.port}</code>`;$('#fwMsg').textContent=''};
 $$('[data-d]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const p=PK[k%PK.length],i=RULES.findIndex(r=>r[2](p)),r=RULES[i],ok=b.dataset.d===r[1];
  tried++;if(ok)score++;$$('#fwRules li')[i].classList.add('hit');$('#fwScore').textContent=score+' / '+tried;
  $('#fwMsg').innerHTML=(ok?'<b class="ok">Correct! </b>':'<b class="bad">Not quite. </b>')+`Rule ${i+1} matched first → <b>${r[1]}</b>.`+(i===5?' Nothing allowed it, so the default rule dropped it.':'');
  window.studyBuddy&&studyBuddy.sfx(ok?'right':'wrong')});
 $('#fwNext').onclick=()=>{k++;show()};show();
},
keys:['Firewall = hardware, software or both that inspects traffic and denies or permits it based on a set of rules; secured access between two networks.','Capabilities: single choke point, monitoring/audits/alarms, non-security functions, IPSec/VPN platform.','Limitations: can’t stop attacks that bypass it, internal threats, or virus-infected files.','Types: packet filtering (IP/TCP header rules; simple, fast), circuit gateway (TCP/UDP sessions), application gateway / proxy (two connections; most secure, more overhead).'],
quiz:[
{q:'A firewall can be…',o:['Only hardware','Only software','Hardware, software, or both','Only a cable'],a:2,e:'Dedicated hardware, software or a combination.'},
{q:'Which is a LIMITATION of a firewall?',o:['It is a single choke point','It cannot protect against internal threats','It can host a VPN','It can log events'],a:1,e:'Also can’t stop bypass attacks or infected files.'},
{q:'A packet-filtering firewall decides using fields in the…',o:['Email body','IP or TCP header','File name','User’s password'],a:1,e:'Rules match IP/TCP header fields.'},
{q:'Which firewall monitors TCP/UDP sessions instead of individual packets?',o:['Packet filter','Circuit-level gateway','Application gateway','Antivirus'],a:1,e:'The port stays open for the session and closes when it ends.'},
{q:'An application gateway is also called a…',o:['Router','Proxy server','Hub','Modem'],a:1,e:'It relays application-level traffic with two connections.'},
{q:'Main advantage of packet filtering is…',o:['Strong authentication','High speed and simplicity','Logs all application data','Stops insiders'],a:1,e:'Simplicity, transparency to users, high speed.'},
{q:'Main disadvantage of an application gateway is…',o:['Low security','Additional processing overhead','No logging','Can’t filter HTTP'],a:1,e:'Each connection is spliced at the gateway.'},
{q:'Using tunnel mode, a firewall can implement a…',o:['VPN','DNS','LAN','Virus dictionary'],a:0,e:'IPSec tunnel mode → virtual private network.'}
]},

/* ---------- 5.3: antivirus ---------- */
{ id:'antivirus', unit:'u5', level:'Core', title:'Antivirus & anti-spyware', desc:'What antivirus does, dictionary vs suspicious-behaviour approach, updates, what to do when a virus is found',
html:`
${simple('Antivirus is the <b>doctor</b> for your computer: it checks every file, recognises known diseases from its book, watches for strange behaviour, and treats or isolates anything infected.')}
<div class="card"><b>Definition (learn word for word):</b> An <b>antivirus software</b> is a computer program that <b>identifies and removes</b> computer viruses and other malicious software like <b>worms and Trojans</b> from an infected computer. It also <b>protects</b> the computer from further virus attacks.</div>
<p>We should <b>regularly run</b> an antivirus scan to find and remove possible infections.</p>
<div class="card"><b>Anti-spyware:</b> provides <b>real-time protection</b> against the installation of spyware. It works the same way as antivirus protection — it <b>scans and blocks all incoming network threats</b> as it comes across them.</div>
<h2>How antivirus works — two approaches</h2>
${table(['','Dictionary approach','Suspicious behaviour approach'],[
 ['How','Examines <b>every file</b> and compares its content with the <b>virus definitions</b> stored in its <b>virus dictionary</b>.','<b>Constantly monitors</b> the activity of all programs. If a program tries to <b>write data to an executable file</b>, it is flagged as suspicious / marked as a virus.'],
 ['Virus dictionary','An inbuilt file containing code identified as a virus by the antivirus authors.','Not needed — judges by what the program does.'],
 ['Advantage','Accurate for known viruses','Can catch <b>unknown (new) viruses</b> too'],
 ['Disadvantage','Misses new viruses until the dictionary is updated','May create <b>several false alerts</b>']])}
<h2>Virus updates</h2>
<ul><li>Regular updates for the <b>virus dictionary</b>; an antivirus should provide free updates periodically.</li><li>With the current outburst of <b>macro and script-based</b> viruses, updates for the latest threats are essential.</li><li>Most commercial antivirus software provides updates <b>daily</b>.</li></ul>
${tryBox('Run the scanner', `<p class="muted" style="margin-top:0">Scan the same folder with each approach. Watch what each one catches, misses or wrongly flags.</p>
<div class="row"><button class="btn" data-av="dict">📖 Dictionary scan</button><button class="btn" data-av="beh">👀 Behaviour scan</button><button class="btn ghost" id="avUpd">⬇️ Update virus dictionary</button></div>
<div id="avOut" class="u-av"></div><p id="avMsg"></p>`)}
<h2>Virus found! — the 5 choices</h2>
<p>When a virus is found the antivirus usually asks what to do:</p>
${tryBox('What should be done with the file?', `<div class="row" id="vfBtns">${['Repair','Quarantine','Delete','Rename','Ignore'].map(x=>`<button class="btn ghost" data-v="${x}">${x}</button>`).join('')}</div><div class="stepbody" id="vfBody">Pick an option.</div>`)}
<p>A security centre (like Windows Security Center) shows the three essentials that should all be <b>ON</b>: <b>Firewall</b>, <b>Automatic Updates</b> and <b>Virus Protection</b>.</p>
<div class="card trap" style="margin-top:0"><b>⚠️ Fake antivirus (scareware)</b><br>Pop-ups like “Antivirus 2009 — MALWARE THREAT, 51 errors found!” that ask you to buy or install something are themselves malware. Only trust the antivirus you installed.</div>
${counts('two scanning approaches · five actions when a virus is found (Repair, Quarantine, Delete, Rename, Ignore) · three security essentials (Firewall, Automatic Updates, Virus Protection).')}
${model('What is antivirus software? Explain how it works (5 marks)','Definition (identify + remove viruses, worms, Trojans; protect from further attacks) → anti-spyware (real-time) → dictionary approach with virus dictionary → suspicious behaviour approach (write to executable → flagged) with advantage (unknown viruses) and disadvantage (false alerts) → need for virus updates (macro/script viruses, daily) → actions when a virus is found.')}
${traps(['Dictionary approach cannot catch a brand-new virus until updated; behaviour approach can.','Behaviour approach’s weakness is <b>false alerts</b>, not slowness.','Quarantine ≠ delete — quarantine isolates the file so it can’t run but can be restored.','Antivirus is <b>utility software</b>.'])}`,
init(){
 const FILES=[
  {n:'holiday.jpg',sig:null,beh:false,real:false},
  {n:'game_crack.exe',sig:'Trojan.Zlob',beh:true,real:true},
  {n:'invoice.pdf.exe',sig:'Worm.Mytob.Mailer',beh:false,real:true},
  {n:'cool_new_tool.exe',sig:'NEW',beh:true,real:true},
  {n:'setup_updater.exe',sig:null,beh:true,real:false},
  {n:'notes.txt',sig:null,beh:false,real:false}];
 let updated=false;
 const scan=mode=>{let caught=0,missed=0,falseA=0;
  $('#avOut').innerHTML=FILES.map(f=>{const flag=mode==='dict'?(f.sig&&(f.sig!=='NEW'||updated)):f.beh;
   let cls,txt;
   if(flag&&f.real){caught++;cls='bad';txt='🛑 virus'+(mode==='dict'?' — matches “'+(f.sig==='NEW'?'NewThreat.X':f.sig)+'”':' — tried to write to an .exe')}
   else if(flag){falseA++;cls='warn';txt='⚠️ flagged — but it is a real installer (false alert)'}
   else if(f.real){missed++;cls='muted';txt='😶 clean?? — actually infected, missed!'}
   else{cls='ok';txt='✓ clean'}
   return `<div><code>${f.n}</code><span class="${cls}">${txt}</span></div>`}).join('');
  $('#avMsg').innerHTML=`<b>${mode==='dict'?'Dictionary':'Behaviour'} scan:</b> caught ${caught} of 3 viruses, missed ${missed}, false alerts ${falseA}. `+(mode==='dict'?(updated?'With the update it now knows the new virus too.':'The brand-new virus isn’t in the dictionary yet — try updating!'):'It caught the unknown virus, but wrongly flagged a safe installer — and missed the mailer worm that never touches an .exe.');
  window.studyBuddy&&studyBuddy.sfx('tick')};
 $$('[data-av]').forEach(b=>b.onclick=()=>scan(b.dataset.av));
 $('#avUpd').onclick=()=>{updated=true;$('#avUpd').disabled=true;$('#avUpd').textContent='✓ Dictionary up to date';$('#avMsg').innerHTML='Downloaded new virus definitions. Run the dictionary scan again.';window.studyBuddy&&studyBuddy.sfx('right')};
 const VF={Repair:'Removes the virus code and keeps the cleaned file. Best when the file is important and can be fixed.',Quarantine:'Moves the file into an isolated, locked area so it can’t run or spread. It can be restored later if it was a false alert. Safest default.',Delete:'Removes the infected file completely. Use when the file is useless or can’t be repaired.',Rename:'Changes the file name/extension so it won’t run by accident. Rarely used.',Ignore:'Does nothing — the virus stays. Only for a known false alert.'};
 $$('#vfBtns button').forEach(b=>b.onclick=()=>{$$('#vfBtns button').forEach(x=>x.classList.toggle('sel',x===b));$('#vfBody').innerHTML=`<b>${b.dataset.v}:</b> ${VF[b.dataset.v]}`});
},
keys:['Antivirus = program that identifies and removes viruses, worms and Trojans, and protects from further attacks.','Anti-spyware: real-time protection against spyware installation; scans and blocks incoming threats.','Dictionary approach: compare files with virus definitions in the virus dictionary.','Suspicious behaviour approach: monitor programs; writing to an executable = suspicious. Catches unknown viruses, but false alerts.','Virus updates are essential (macro/script viruses); commercial AV updates daily. Actions: Repair, Quarantine, Delete, Rename, Ignore.'],
quiz:[
{q:'Antivirus software…',o:['Only blocks network ports','Identifies and removes viruses, worms and Trojans','Encrypts files','Speeds up the CPU'],a:1,e:'And protects from further attacks.'},
{q:'The file containing known virus code is the…',o:['Registry','Virus dictionary','Quarantine','Cookie'],a:1,e:'Dictionary approach compares files against it.'},
{q:'Which approach can catch unknown (new) viruses?',o:['Dictionary','Suspicious behaviour','Neither','Only firewalls can'],a:1,e:'It judges by behaviour, not a known signature.'},
{q:'The disadvantage of the suspicious behaviour approach is…',o:['It can’t catch new viruses','Several false alerts','It needs no updates','It is illegal'],a:1,e:'Safe programs that write to executables get flagged.'},
{q:'In the behaviour approach, a program is flagged if it tries to…',o:['Open a picture','Write data to an executable file','Print a page','Connect to Wi-Fi'],a:1,e:'Writing to an executable is suspicious.'},
{q:'Which action isolates a file so it can’t run but can be restored?',o:['Delete','Ignore','Quarantine','Rename'],a:2,e:'Quarantine.'},
{q:'Anti-spyware provides…',o:['Real-time protection against spyware installation','Encryption of emails','Faster boot','A VPN'],a:0,e:'Works like antivirus, scanning and blocking incoming threats.'}
]},

/* ---------- 5.4: encryption ---------- */
{ id:'crypto', unit:'u5', level:'Applied', title:'Encryption & cryptography', desc:'History, security goals, symmetric vs asymmetric, classical vs modern ciphers, DES vs AES',
html:`
${simple('Encryption scrambles a message with a <b>key</b> so only the person with the right key can unscramble it. Like writing in a secret code that only your friend knows how to read.')}
<div class="card"><b>Definition (learn word for word):</b> <b>Cryptography</b> is a method of storing and transmitting data in a particular form so that <b>only those for whom it is intended</b> can read and process it. The name comes from the Greek word <b>“Kryptos”</b>, meaning <b>“hidden secrets”</b>.</div>
<h2>History</h2>
<ul><li>The earliest forms were found in the cradle of civilization — <b>Greece and Rome</b>.</li><li><b>Greece:</b> wrap a tape around a stick (a <i>scytale</i>) and write the message on the wound tape. Unwound, the letters look jumbled.</li><li><b>Rome:</b> the <b>Caesar shift cipher</b> — shift every letter by an agreed number (3 was common).</li></ul>
<h2>Security goals</h2>
<div class="grid">
${reveal('Confidentiality','Only the intended receiver can read the data.')}
${reveal('Integrity','The data is not changed on the way.')}
${reveal('Authentication','You can be sure who sent it.')}
${reveal('Non-repudiation','The sender can’t later deny sending it.')}
</div>
<p class="muted">Conclusion slide adds: <b>access control</b> and <b>availability</b> — cryptography maintains confidentiality, authentication, integrity, access control and availability.</p>
<h2>Encryption and decryption</h2>
<div class="svgbox"><svg viewBox="0 0 640 130" role="img" aria-label="Plaintext encrypted with a key into ciphertext, then decrypted">
${[['Plaintext',20,'var(--c1)'],['Ciphertext',255,'var(--c5)'],['Plaintext',490,'var(--c1)']].map(([t,x,c])=>`<rect x="${x}" y="40" width="130" height="44" rx="10" fill="${c}"/><text x="${x+65}" y="67" text-anchor="middle" font-weight="700" style="fill:#fff">${t}</text>`).join('')}
<path d="M150 62H250" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#crA)"/><path d="M385 62H485" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#crA)"/>
<text x="200" y="30" text-anchor="middle" font-size="12.5" font-weight="700">Encryption</text><text x="200" y="104" text-anchor="middle" font-size="11.5" fill="var(--muted)">algorithm + encryption key</text>
<text x="435" y="30" text-anchor="middle" font-size="12.5" font-weight="700">Decryption</text><text x="435" y="104" text-anchor="middle" font-size="11.5" fill="var(--muted)">algorithm + decryption key</text>
<defs><marker id="crA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs></svg></div>
<h2>Types of cryptosystem</h2>
<div class="svgbox"><svg viewBox="0 0 640 210" role="img" aria-label="Cryptography tree">
<g font-size="12.5" font-weight="700" text-anchor="middle">
<rect x="250" y="8" width="140" height="32" rx="8" fill="var(--accent)"/><text x="320" y="29" style="fill:var(--on-accent)">Cryptography</text>
<path d="M320 40V55H160V70M320 55H480V70M160 102V117H80V132M160 117H240V132M80 164V179H35V188M80 179H125V188M240 164V188" stroke="var(--muted)" stroke-width="2" fill="none"/>
<rect x="80" y="70" width="160" height="32" rx="8" fill="var(--c1)"/><text x="160" y="91" style="fill:#fff">Symmetric key</text>
<rect x="390" y="70" width="180" height="32" rx="8" fill="var(--c3)"/><text x="480" y="91" style="fill:#fff">Asymmetric (public key)</text>
<rect x="20" y="132" width="120" height="32" rx="8" fill="var(--c2)"/><text x="80" y="153" style="fill:#fff">Classical</text>
<rect x="180" y="132" width="120" height="32" rx="8" fill="var(--c4)"/><text x="240" y="153" style="fill:#fff">Modern</text>
<text x="35" y="203" font-size="11" font-weight="600">Transposition</text><text x="128" y="203" font-size="11" font-weight="600">Substitution</text>
<text x="240" y="203" font-size="11" font-weight="600">Stream · Block</text>
</g></svg></div>
${table(['','Symmetric key','Asymmetric key (public key)'],[
 ['Keys','<b>One common key</b> shared by sender and receiver','<b>Different keys</b> (a pair per user) but <b>mathematically related</b>; computationally not feasible for an attacker to work one out from the other'],
 ['How','Key must be shared by <b>prior exchange</b>; needs to be changed regularly; strength depends on key length and computing power','Public key is put in a <b>public repository</b>; the <b>private key is guarded</b>. Encrypt with the receiver’s public key, only their private key decrypts'],
 ['Challenges','1. <b>Key establishment</b> — sharing the key securely. 2. <b>Trust issue</b> — receiver may lose the key to an attacker and not tell you','Is the public key really that person’s? Solved by <b>PKI (Public Key Infrastructure)</b>: a trusted third party manages and attests to the authenticity of public keys'],
 ['Examples','DES, AES','RSA (public-key system)']])}
<p><b>Why asymmetric came into the picture:</b> people need to exchange information with <b>unfamiliar and untrusted</b> parties; regularly changing keys is complex and cumbersome; and secret keys would have to be <b>pre-shared</b>.</p>
<h2>Classical cryptography</h2>
<h3>1. Transposition — letters change position</h3>
<p>Slide example: plaintext <b>MEET ME AFTER PARTY</b>, key <b>421635</b> → ciphertext <b>TEMEEMEFAPTRYRAT</b>. Write the text in rows of 6, then rearrange the columns in key order.</p>
${tryBox('Transposition cipher', `<div class="row"><label>Plaintext <input id="tpText" value="MEET ME AFTER PARTY"></label><label>Key <input id="tpKey" value="421635" size="8"></label></div><div id="tpOut" class="u-grid"></div>`)}
<h3>2. Substitution — Caesar / shift cipher</h3>
<p>Every letter is shifted by a fixed number. <b>Key = the shift number.</b> <b>Problem:</b> only 26 keys, so an attacker can simply try them all (brute force).</p>
${tryBox('Caesar cipher machine', `<div class="row"><label>Message <input id="csText" value="ATTACK AT DAWN" style="min-width:220px"></label><label>Shift <input id="csShift" type="range" min="1" max="25" value="3"> <b id="csN">3</b></label></div>
<p>Ciphertext: <code id="csOut"></code></p><div class="row"><button class="btn ghost" id="csBrute">🔓 Brute-force it (try all 25 keys)</button></div><div id="csList" class="u-brute"></div>`)}
<h2>Modern cryptography</h2>
<div class="grid">
<div class="card" style="margin:0"><h3>1. Block cipher</h3>Encrypts <b>one block of text at a time</b>. Slide example: “four and five” → blocks <i>four / and / five</i>, each with the key → <i>wvfa / ast / wvfa</i>. Notice the same block + same key gives the same output.</div>
<div class="card" style="margin:0"><h3>2. Stream cipher</h3>Plaintext is processed <b>one bit at a time</b>, usually by <b>XOR</b> with a key stream. Slide example: 010111101 XOR 100101011 = <b>110010110</b>.</div>
</div>
${tryBox('XOR stream cipher', `<p class="muted" style="margin-top:0">XOR rule: same bits → 0, different bits → 1. XOR the ciphertext with the <b>same key</b> again and you get the plaintext back.</p>
<div class="row"><label>Plaintext bits <input id="xP" value="010111101" size="14"></label><label>Key bits <input id="xK" value="100101011" size="14"></label></div><div id="xOut" class="u-xor"></div>`)}
<h2>DES vs AES</h2>
${table(['DES','AES'],[
 ['Uses only a <b>56-bit</b> key → 2<sup>56</sup> combinations','Can use <b>128, 192 or 256-bit</b> keys → 2<sup>128</sup>, 2<sup>192</sup>, 2<sup>256</sup> combinations'],
 ['Block size of only <b>64 bits</b>','Block size of <b>128 bits</b> (double DES)'],
 ['About <b>32 GB</b> of data can be transferred with a single key','Around 256 billion GB with one key — safe for any application'],
 ['Breakable by <b>brute force</b>','Not breakable in practice (only theoretical discussions)'],
 ['Old technique','Relatively new'],
 ['Checking all keys at 50 billion keys/s: <b>400 days</b> (56-bit)','For a 128-bit key: <b>5×10<sup>21</sup> years</b>']])}
<h2>Applications</h2>
<p>Defence services · secure data manipulation · e-commerce · business transactions · internet payment systems · user identification systems · access control · data security.</p>
${counts('4 security goals on the diagram (+ access control & availability in the conclusion) · 2 key types · 2 classical (transposition, substitution) · 2 modern (block, stream) · Caesar has 26 keys · DES key 56 bits / block 64 · AES keys 128/192/256 / block 128 · 8 applications.')}
${model('What is cryptography? Differentiate symmetric and asymmetric key cryptography (5 marks)','Definition + “Kryptos = hidden secrets” → encryption/decryption diagram (plaintext, key, algorithm, ciphertext) → security goals → comparison table (one common key vs key pair; prior key exchange vs public repository + private key; challenges: key establishment & trust vs PKI) → examples DES/AES vs RSA → conclusion.')}
${model('Explain classical and modern cryptography with examples (5 marks)','Tree diagram → transposition with MEET ME AFTER PARTY / key 421635 → TEMEEMEFAPTRYRAT → Caesar shift (key = shift, only 26 keys) → block cipher (one block at a time) → stream cipher (one bit at a time, XOR example) → DES vs AES table.')}
${traps(['Symmetric = <b>one</b> shared key; asymmetric = <b>two</b> mathematically related keys.','Encrypt with the receiver’s <b>public</b> key; decrypt with their <b>private</b> key.','Transposition changes <b>positions</b>; substitution changes the <b>letters</b>.','Block = a block at a time; stream = one <b>bit</b> at a time.','DES key is 56 bits (not 64 — 64 is the block size).'])}`,
init(){
 const tp=()=>{const t=$('#tpText').value.toUpperCase().replace(/[^A-Z]/g,''),key=$('#tpKey').value.replace(/\D/g,''),n=key.length,o=$('#tpOut');
  const digits=key.split('').map(Number);
  if(!n||n>9||digits.slice().sort().join('')!==Array.from({length:n},(_,i)=>i+1).join('')){o.innerHTML='<p class="bad">Key must use each digit 1…n once, e.g. 421635.</p>';return}
  const rows=[];for(let i=0;i<t.length;i+=n)rows.push(t.slice(i,i+n).split(''));
  const cell=c=>`<td>${c||''}</td>`;
  const before=`<table><tr>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}</tr>${rows.map(r=>`<tr>${Array.from({length:n},(_,i)=>cell(r[i])).join('')}</tr>`).join('')}</table>`;
  const after=`<table><tr>${digits.map(d=>`<th>${d}</th>`).join('')}</tr>${rows.map(r=>`<tr>${digits.map(d=>cell(r[d-1])).join('')}</tr>`).join('')}</table>`;
  const ct=rows.map(r=>digits.map(d=>r[d-1]||'').join('')).join('');
  o.innerHTML=`<div class="row" style="align-items:flex-start;gap:18px"><div><small class="muted">Written in rows</small>${before}</div><div><small class="muted">Columns in key order</small>${after}</div></div><p>Ciphertext (read row by row): <code>${ct}</code></p>`};
 $('#tpText').oninput=tp;$('#tpKey').oninput=tp;tp();

/* ---------- AI-powered software & generative AI tools ---------- */
{ id:'aiapps', unit:'ai', level:'Basics', title:'AI-powered software & generative AI tools', desc:'What makes software “AI-powered”, everyday examples, generative vs other AI, tool categories, benefits and risks',
html:`
${simple('Normal software follows rules a programmer typed in. <b>AI-powered software</b> learns patterns from lots of examples, so it can do things nobody wrote exact rules for — recognise your face, suggest your next video, or write a paragraph. <b>Generative AI</b> is the kind that <b>creates something new</b>: text, pictures, music, video or code.')}
<div class="card"><b>Definition:</b> <b>Artificial intelligence (AI)</b> is the ability of a computer system to perform tasks that normally need human intelligence — learning, reasoning, understanding language, recognising images and making decisions.<br><b>AI-powered software application:</b> a program that uses AI/machine-learning models inside it to learn from data, make predictions or decisions, and improve over time, instead of relying only on fixed hand-written rules.</div>
<h2>Traditional vs AI-powered software</h2>
${table(['Point','Traditional software','AI-powered software'],[
 ['How it works','Follows rules written by the programmer','Learns patterns from training data'],
 ['Same input twice','Always the same output','May give slightly different outputs (probabilistic)'],
 ['Improves itself?','No — must be re-programmed','Yes — gets better with more data and retraining'],
 ['Handles new situations','Only those the rules cover','Can generalise to cases it hasn’t seen'],
 ['Example','Calculator, payroll program','Spam filter, voice assistant, ChatGPT']])}
<h2>AI-powered applications around you</h2>
${table(['Area','Application','What the AI does'],[
 ['Personal assistants','Siri, Alexa, Google Assistant','Understands speech and answers or acts'],
 ['Entertainment &amp; shopping','Netflix, YouTube, Amazon recommendations','Predicts what you will like from your history'],
 ['Communication','Gmail spam filter &amp; Smart Compose, Google Translate','Classifies mail, suggests words, translates languages'],
 ['Navigation','Google Maps, Uber','Predicts traffic and travel time'],
 ['Security','Face unlock, bank fraud detection','Recognises faces; flags unusual transactions'],
 ['Healthcare','Medical image analysis','Spots signs of disease in X-rays and scans'],
 ['Transport','Driver-assist and self-driving cars','Sees lanes, cars and people from cameras and sensors'],
 ['Customer service','Chatbots on websites and apps','Answers common questions 24×7']])}
<h2>What is generative AI?</h2>
<div class="card"><b>Definition:</b> <b>Generative AI</b> is a type of AI that <b>creates new content</b> — text, images, audio, video or code — that resembles the data it was trained on. You give it a <b>prompt</b> (an instruction) and it generates an output.</div>
<div class="grid">
<div class="card" style="margin:0"><h3>Discriminative (predictive) AI</h3><p style="margin:0"><b>Classifies or predicts</b> from data. Answers “which one?” or “how much?”<br><span class="muted">Spam or not spam? Is this a cat? What will traffic be?</span></p></div>
<div class="card" style="margin:0"><h3>Generative AI</h3><p style="margin:0"><b>Creates new data</b> that looks like its training data. Answers “make me one.”<br><span class="muted">Write an email, draw a poster, compose a tune, write code.</span></p></div>
</div>
<p><b>How a generative AI tool works (4 steps):</b> 1) the model is <b>trained</b> on huge amounts of data (text, images…) → 2) the user types a <b>prompt</b> → 3) the model <b>generates</b> new content piece by piece using the patterns it learned → 4) the user <b>reviews and refines</b> the prompt to improve the result.</p>
${tryBox('Generative AI or another kind of AI?', `<p class="muted" style="margin-top:0">Ask yourself: is it <b>creating something new</b>, or <b>sorting / predicting</b>?</p>${sorter('genSorter',[
 ['ChatGPT writing a leave application','Generative AI'],['Gmail moving a mail to Spam','Other AI'],['Netflix suggesting a series','Other AI'],['Midjourney drawing a fest poster','Generative AI'],
 ['Phone face unlock','Other AI'],['GitHub Copilot suggesting the next lines of code','Generative AI'],['Google Maps predicting arrival time','Other AI'],['Suno composing a song from a text prompt','Generative AI']],['Generative AI','Other AI'])}`)}
<h2>Types of generative AI tools</h2>
${table(['Tool type','What it creates','Popular tools'],[
 ['<b>Text / chatbots</b>','Answers, essays, emails, summaries, translations','ChatGPT (OpenAI), Claude (Anthropic), Gemini (Google), Microsoft Copilot'],
 ['<b>Image</b>','Pictures, art, posters, edits from a text prompt','DALL·E, Midjourney, Stable Diffusion, Adobe Firefly'],
 ['<b>Code</b>','Code suggestions, whole functions, bug fixes','GitHub Copilot, Claude Code, Cursor'],
 ['<b>Audio &amp; music</b>','Realistic voices, songs, sound effects','ElevenLabs (voice), Suno (music)'],
 ['<b>Video</b>','Short video clips from text or images','Sora (OpenAI), Veo (Google), Runway'],
 ['<b>Design &amp; slides</b>','Presentations, layouts, graphics','Canva Magic Studio, Gamma']])}
${tryBox('Pick the right tool type', `<div id="toolChooser"></div>`)}
<h2>Benefits and risks</h2>
${table(['Benefits','Risks / limitations'],[
 ['Saves time on writing, coding and design','<b>Hallucination</b> — confident but wrong or made-up answers'],
 ['Available 24×7; helps learners and small businesses','<b>Bias</b> — repeats unfair patterns in its training data'],
 ['Boosts creativity: quick drafts and many ideas','<b>Deepfakes &amp; misinformation</b> — fake photos, voices, videos'],
 ['Personalised help (tutoring, accessibility)','<b>Privacy</b> — sensitive data typed into prompts can leak'],
 ['Automates repetitive tasks','<b>Copyright</b> questions; job changes; high energy use']])}
<div class="card"><b>Using it responsibly:</b> check facts against reliable sources · don’t paste passwords or private data · say when work is AI-assisted · don’t create deepfakes of real people · keep a human in charge of important decisions.</div>
${counts('five rows in the traditional vs AI table · eight application areas · four steps of how a tool works · six tool types · five benefits and five risks.')}

{q:'Generative AI is best described as AI that…',o:['Only sorts data into groups','Creates new content such as text, images or code','Speeds up the CPU','Encrypts files'],a:1,e:'It generates new content similar to its training data.'},

/* ---------- types of generative AI models ---------- */
{ id:'genmodels', unit:'ai', level:'Core', title:'Types of generative AI models: GANs & transformers', desc:'Generative adversarial networks, transformer-based models, plus VAEs and diffusion models — how each one works',
html:`
${simple('A <b>GAN</b> is two AIs playing a game: a forger who paints fake pictures and a detective who tries to catch them. Both keep improving until the fakes look real. A <b>transformer</b> reads a whole sentence at once, works out which words matter to each other, and then predicts the next word — again and again — to write text.')}
<div class="card"><b>Generative AI model:</b> the trained “engine” inside a generative AI tool. It learns the patterns of its training data and uses them to produce new samples. Main types: <b>GANs</b>, <b>transformer-based models</b>, <b>variational autoencoders (VAEs)</b> and <b>diffusion models</b>.</div>
<h2>1. Generative adversarial network (GAN)</h2>
<div class="card"><b>Definition:</b> a <b>GAN</b> is a generative model made of <b>two neural networks</b> — a <b>generator</b> and a <b>discriminator</b> — that are trained together by competing against each other (“adversarial”). Introduced by <b>Ian Goodfellow</b> and colleagues in <b>2014</b>.</div>
${table(['Part','Job','Analogy'],[
 ['<b>Generator (G)</b>','Takes random noise and turns it into a fake sample (e.g. an image)','The forger'],
 ['<b>Discriminator (D)</b>','Looks at a sample and decides: real (from training data) or fake (from G)?','The detective']])}
<div class="svgbox"><svg viewBox="0 0 600 220" role="img" aria-label="GAN architecture: random noise goes into the generator, which makes a fake image; the discriminator compares fake and real images and its feedback trains both networks">
<defs><marker id="gaArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" style="fill:var(--muted)"/></marker></defs>
<g style="stroke:var(--muted)" stroke-width="2" fill="none" marker-end="url(#gaArr)">
<line x1="130" y1="82" x2="163" y2="82"/><line x1="285" y1="82" x2="323" y2="82"/><line x1="435" y1="88" x2="468" y2="118"/><line x1="435" y1="176" x2="468" y2="144"/>
<path d="M527 110V30H225V58" stroke-dasharray="6 5"/></g>
<rect x="20" y="60" width="110" height="44" rx="8" fill="var(--c7)"/><text x="75" y="87" text-anchor="middle" font-size="13" font-weight="600" style="fill:#fff">Random noise</text>
<rect x="165" y="60" width="120" height="44" rx="8" fill="var(--c4)"/><text x="225" y="87" text-anchor="middle" font-size="13" font-weight="600" style="fill:#fff">Generator</text>
<rect x="325" y="60" width="110" height="44" rx="8" fill="var(--c3)"/><text x="380" y="87" text-anchor="middle" font-size="13" font-weight="600" style="fill:#fff">Fake image</text>
<rect x="325" y="154" width="110" height="44" rx="8" fill="var(--c2)"/><text x="380" y="181" text-anchor="middle" font-size="13" font-weight="600" style="fill:#fff">Real images</text>
<rect x="470" y="108" width="115" height="44" rx="8" fill="var(--c5)"/><text x="527" y="135" text-anchor="middle" font-size="13" font-weight="600" style="fill:#fff">Discriminator</text>
<text x="527" y="174" text-anchor="middle" font-size="12">Real or fake?</text><text x="527" y="191" text-anchor="middle" font-size="11" style="fill:var(--muted)">(score 0 to 1)</text>
<text x="376" y="22" text-anchor="middle" font-size="11" style="fill:var(--muted)">Feedback (loss) trains both networks</text>
</svg></div>
<h3>How a GAN is trained (5 steps)</h3>
<ol><li>The generator turns <b>random noise</b> into a fake sample.</li><li>The discriminator is shown a mix of <b>real</b> samples and <b>fake</b> ones.</li><li>It outputs a score: close to 1 = “real”, close to 0 = “fake”.</li><li>The discriminator is updated to <b>catch fakes better</b>; the generator is updated to <b>fool the discriminator better</b>.</li><li>Repeat thousands of times. Training ends when the discriminator can only guess — about <b>50 %</b> — because the fakes look real.</li></ol>
${tryBox('Watch a GAN learn', `<div class="steps" id="ganSteps"></div><div class="svgbox"><svg id="ganSvg" viewBox="0 0 600 200" role="img" aria-label="A real face, the generator’s current fake, and the discriminator’s score"></svg></div><div class="stepbody" id="ganInfo"></div><div class="row" style="margin-top:8px"><button class="btn" id="ganNext">Train one round</button><button class="btn ghost" id="ganReset">${ic('reset')} Start over</button></div>`)}
${table(['Popular GAN variants','What they do'],[
 ['DCGAN','Uses convolutional layers — better images'],
 ['Conditional GAN (cGAN)','You choose what to make, e.g. “digit 7”'],
 ['CycleGAN','Translates image styles without paired examples (horse ↔ zebra, photo ↔ painting)'],
 ['StyleGAN (NVIDIA)','Very realistic human faces of people who don’t exist'],
 ['SRGAN','Super-resolution: sharpens low-quality images']])}
<div class="grid">
<div class="card" style="margin:0"><h3>Uses of GANs</h3><ul><li>Realistic faces and artwork</li><li>Image-to-image translation &amp; style transfer</li><li>Super-resolution / photo restoration</li><li>Extra training data (data augmentation)</li><li>Deepfakes — a major misuse</li></ul></div>
<div class="card" style="margin:0"><h3>Problems with GANs</h3><ul><li><b>Mode collapse</b> — generator makes the same few outputs</li><li><b>Unstable training</b> — the two networks must stay balanced</li><li>Vanishing gradients if D becomes too strong</li><li>Hard to measure quality</li><li>Weak at long text</li></ul></div>
</div>
<h2>2. Transformer-based models</h2>
<div class="card"><b>Definition:</b> a <b>transformer</b> is a neural-network architecture that processes a whole sequence (such as a sentence) <b>in parallel</b> and uses <b>self-attention</b> to decide how much each word should focus on every other word. Introduced by Google researchers (Vaswani et al.) in the <b>2017</b> paper <b>“Attention Is All You Need”</b>. It powers today’s large language models (LLMs) such as GPT, Claude, Gemini and Llama.</div>
<h3>Large language model (LLM)</h3>
<div class="card"><b>Definition:</b> A <b>large language model (LLM)</b> is an <b>advanced AI model</b> built on <b>deep learning neural networks</b>, usually the <b>transformer</b> architecture. It is trained on <b>huge amounts of text</b> (books, websites, articles and code) so that it can <b>understand, generate and respond to human language</b>. It works by predicting the next token, one token at a time.<br><b>Why “large”?</b> It has <b>billions of parameters</b> (the adjustable weights inside the neural network) and is trained on enormous datasets using powerful GPUs.</div>
${table(['Feature','Meaning'],[
 ['<b>Deep learning</b>','A neural network with many layers that learns patterns on its own from data'],
 ['<b>Transformer-based</b>','Uses self-attention to understand how the words in the context relate to each other'],
 ['<b>Parameters</b>','Billions of weights adjusted during training; they store what the model has learned'],
 ['<b>Pre-training</b>','The model learns general language by predicting the next token across massive amounts of text'],
 ['<b>Fine-tuning</b>','Further training on chosen examples and human feedback (RLHF) to make it helpful and safe'],
 ['<b>What it can do</b>','Chat, answer questions, summarise, translate, write essays and code, and explain concepts'],
 ['<b>Examples</b>','GPT series (OpenAI, used in ChatGPT), Claude (Anthropic), Gemini (Google), Llama (Meta)'],
 ['<b>Limitations</b>','Hallucination, bias, a knowledge cut-off date, and high computing and energy cost']])}
<p class="muted">Flow: <b>huge text data → tokens → deep transformer neural network (billions of parameters) → pre-training → fine-tuning → chatbot / AI tool</b>.</p>
<h3>Working of an LLM</h3>
<p>An LLM works in <b>two phases</b>: first it is <b>trained</b> once (weeks or months on thousands of GPUs), then it is <b>used</b> (called <b>inference</b>) every time someone types a prompt.</p>
<h3>Phase A: training the LLM (4 steps)</h3>
<ol>
<li><b>Data collection:</b> billions of words of text are gathered from books, websites, articles and code, then cleaned to remove duplicates and harmful or low-quality content.</li>
<li><b>Tokenization:</b> the text is broken into <b>tokens</b> (words or word pieces), and each token gets an ID number. For example, “unbelievable” → “un” + “believ” + “able”.</li>
<li><b>Pre-training (self-supervised):</b> the model reads text and tries to <b>predict the next token</b>. It compares its guess with the real next token, calculates the error (<b>loss</b>), and uses <b>backpropagation</b> to adjust its billions of <b>parameters</b> a little. This is repeated trillions of times, and the model slowly learns grammar, facts and reasoning patterns. No human labels are needed, because the text itself provides the answers.</li>
<li><b>Fine-tuning:</b> the model is trained further on question-and-answer examples (<b>instruction tuning</b>) and on <b>RLHF</b> (reinforcement learning from human feedback), where humans rank answers so the model learns to be helpful, honest and safe. This turns a text-predictor into a chat assistant.</li>
</ol>
<h3>Phase B: answering a prompt (inference)</h3>
${tryBox('Follow a prompt through an LLM', `<div class="steps" id="llmSteps"></div><div class="stepbody" id="llmBody"></div><div class="row" style="margin-top:8px"><button class="btn ghost" id="llmPrev">${ic('arrowL')} Back</button><button class="btn" id="llmNext">Next step ${ic('arrowR')}</button></div>`)}

 ['Cost','Huge: months, thousands of GPUs, massive data','Small per prompt (fractions of a second per token)'],
 ['Output','A trained model (its parameters)','Generated text, one token at a time']])}
<div class="card"><b>Key terms:</b> <b>Context window</b> = the maximum number of tokens the model can read at once (prompt + conversation + answer). <b>Temperature</b> = how random the token choice is (low = focused, high = creative). <b>Knowledge cut-off</b> = the date the training data ends; the model doesn’t know later events unless it is given a search tool.</div>
