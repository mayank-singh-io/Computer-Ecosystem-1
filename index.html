<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Ecosystem Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f2ea; --panel:#fffaf4; --panel2:#f1e6d9; --text:#2b1d14; --muted:#7a6352;
  --line:#e4d4c2; --accent:#6f4e37; --accent-soft:#f0e2d2; --on-accent:#fff8f0; --ok:#3f7d3a; --ok-soft:#e5f1df;
  --bad:#b23a2e; --bad-soft:#f8e1dc; --warn:#a0601a; --warn-soft:#fbecd6;
  --c1:#6f4e37; --c2:#4f7a52; --c3:#c07a2c; --c4:#8a4f7d; --c5:#b23a2e; --c6:#2f7a80; --c7:#8c6a3e;
  --shadow:0 1px 3px rgba(60,35,20,.08),0 4px 16px rgba(60,35,20,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16100c; --panel:#211813; --panel2:#2d221a; --text:#f2e8dc; --muted:#b9a490;
    --line:#403023; --accent:#d4a373; --accent-soft:#3b2b1f; --on-accent:#1e140e; --ok:#7fc178; --ok-soft:#1e3320;
    --bad:#f08a7c; --bad-soft:#3e1f1a; --warn:#e9b25f; --warn-soft:#3b2b14;
    --c1:#8b5e3c; --c2:#4f7a52; --c3:#b0702a; --c4:#8a4f7d; --c5:#a8443a; --c6:#2f7a80; --c7:#7d6038;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16100c; --panel:#211813; --panel2:#2d221a; --text:#f2e8dc; --muted:#b9a490;
  --line:#403023; --accent:#d4a373; --accent-soft:#3b2b1f; --on-accent:#1e140e; --ok:#7fc178; --ok-soft:#1e3320;
  --bad:#f08a7c; --bad-soft:#3e1f1a; --warn:#e9b25f; --warn-soft:#3b2b14;
  --c1:#8b5e3c; --c2:#4f7a52; --c3:#b0702a; --c4:#8a4f7d; --c5:#a8443a; --c6:#2f7a80; --c7:#7d6038;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* sidebar */
nav.side{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px}
.brand{font-weight:700;font-size:18px;margin:0 6px 4px}
.sub{color:var(--muted);font-size:13px;margin:0 6px 14px}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:0 6px 4px}
.prog>div{height:100%;background:var(--ok);width:0;transition:width .4s}
.progtxt{font-size:12px;color:var(--muted);margin:0 6px 12px}
.navlist{list-style:none;margin:0;padding:0}
.navlist button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px}
.navlist button:hover{background:var(--panel2)}
.navlist button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlist .num{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--panel2);color:var(--muted);font-weight:600}
.navlist .done .num{background:var(--ok);color:#fff}
.navsep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
.tools{display:flex;gap:6px;margin:14px 6px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.topbar{display:none}
.swlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 6px 6px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:0 6px}
.sw{display:inline-block;width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden;background:none}
.sw span{position:absolute;inset:0;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.swname{font-size:12px;color:var(--muted);margin:6px 6px 0}
.dynrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 6px 0}
.dynrow .chip{font-size:12px;padding:3px 10px}
.dynbar{height:6px;border-radius:99px;margin:8px 6px 0;background:linear-gradient(90deg,hsl(210 70% 55%),hsl(170 60% 45%),hsl(120 50% 45%),hsl(45 85% 50%))}
.palgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr))}
.palgrid button{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.palgrid button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,56px) 80px;max-width:980px}
h1{font-size:28px;line-height:1.25;margin:0 0 6px}
h2{font-size:21px;margin:30px 0 10px}
h3{font-size:17px;margin:20px 0 6px}
.lead{color:var(--muted);margin:0 0 18px}
.simple{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.simple b:first-child{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.card h3:first-child{margin-top:0}
.try{border:2px dashed var(--accent);background:var(--panel)}
.try>.tag{display:inline-block;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-bottom:8px;letter-spacing:.04em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr))}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblwrap{overflow-x:auto;margin:10px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2);font-weight:600}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--panel2);color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.mono{font-family:ui-monospace,Consolas,monospace}
.muted{color:var(--muted)}
.ok{color:var(--ok)} .bad{color:var(--bad)}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:13px}
/* reveal cards */
.rcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.rcard .q{font-weight:700}
.rcard .a{display:none;margin-top:6px;font-size:14px}
.rcard.open .a{display:block}
.rcard .hint{font-size:12px;color:var(--muted)}
.rcard.open .hint{display:none}
/* key points */
.keys{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:14px 18px;margin:26px 0}
.keys h3{margin:0 0 6px;color:var(--warn)}
.keys ul{margin:0;padding-left:20px}
body.revise .lesson-body{display:none}
/* quiz */
.quiz .qitem{margin:14px 0 18px}
.quiz .qtext{font-weight:600;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:5px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.explain{font-size:14px;margin-top:4px;color:var(--muted);display:none}
.answered .explain{display:block}
.score{font-weight:700;padding:10px 14px;border-radius:8px;margin-top:10px}
.score.pass{background:var(--ok-soft);color:var(--ok)}
.score.fail{background:var(--warn-soft);color:var(--warn)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* svg */
svg text{fill:var(--text);font-family:inherit}
.svgbox{background:var(--panel2);border-radius:10px;padding:8px;margin:8px 0}
.svgbox svg{display:block;width:100%;height:auto;max-height:340px}
/* OSI */
.layer{display:block;width:100%;text-align:left;border:0;border-radius:8px;margin:4px 0;padding:10px 14px;cursor:pointer;color:#fff;font-weight:600}
.layer .ld{display:none;font-weight:400;font-size:14px;margin-top:6px}
.layer.open .ld{display:block}
.order li{list-style:none;display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0}
.order{padding:0;margin:8px 0}
.order li span{flex:1}
.order li button{border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;width:32px;height:28px}
.order li.good{border-color:var(--ok);background:var(--ok-soft)}
.order li.badpos{border-color:var(--bad);background:var(--bad-soft)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.map .col div{border-radius:8px;padding:8px 10px;margin:4px 0;background:var(--panel2);border:2px solid transparent;font-size:14px;transition:.2s}
.map .col div.hl{border-color:var(--accent);background:var(--accent-soft)}
.map .tcp div{cursor:pointer}
/* ip calc */
.bits{font-family:ui-monospace,Consolas,monospace;font-size:15px;word-break:break-all}
.bits .n{color:var(--accent);font-weight:700}
.bits .h{color:var(--warn);font-weight:700}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:700}
/* url */
.urlparts{font-family:ui-monospace,Consolas,monospace;font-size:17px;word-break:break-all;padding:10px;background:var(--panel2);border-radius:8px}
.urlparts span{padding:2px 2px;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.steps button{flex:1 1 120px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px;cursor:pointer;font-size:14px;font-weight:600}
.steps button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.steps button.past{background:var(--accent-soft);border-color:var(--accent)}
.stepbody{background:var(--panel2);border-radius:10px;padding:12px 16px;min-height:70px}
/* sorter */
.sortitem{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
.sortitem .res{font-size:13px;min-width:60px}
/* flip */
.flip{perspective:900px;cursor:pointer;min-height:150px;border:0;background:none;padding:0;width:100%}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line)}
.flip .f{background:var(--panel2);font-weight:700}
.flip .b{background:var(--accent-soft);transform:rotateY(180deg);font-size:14px}
/* flashcards */
.fc{max-width:560px;margin:0 auto}
.fc .flip,.fc .flip .in{min-height:230px}
.fc .f{font-size:22px}
.fc .b{font-size:16px}
/* home */
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--panel) 45%,var(--accent-soft) 90%);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}
.lessongrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}
.lessongrid button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.lessongrid button:hover{border-color:var(--accent)}
.lessongrid .t{font-weight:700}
.lessongrid .d{font-size:13px;color:var(--muted)}
.lessongrid .st{font-size:12px;margin-top:4px}
.level{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
@keyframes pulse{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
@keyframes dash{to{stroke-dashoffset:-40}}
.ray{stroke-dasharray:14 6;animation:dash 1s linear infinite}
.wave{animation:pulse 1.4s ease-in-out infinite}
@media (max-width:820px){
  .app{display:block}
  nav.side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .25s;width:min(300px,86vw);height:100vh}
  nav.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{padding:20px 16px 70px}
  h1{font-size:23px}
  .map{grid-template-columns:1fr}
}


/* ===================== packet journey ===================== */
.pj svg{display:block;width:100%;height:auto}
.pj .svgbox svg{max-height:none}
.pj .row{margin-top:8px}
.pj-pkt{transition:transform .7s cubic-bezier(.3,.8,.3,1),opacity .4s}
.pj-bits{transition:transform 1.8s linear,opacity .3s}
.pj-row rect{transition:opacity .35s,stroke-width .2s}
.seg-new{animation:segIn .6s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box}
.seg-strip{animation:segOut 1s ease forwards;transform-box:fill-box}
@keyframes segIn{from{opacity:0;transform:translateY(-16px) scale(.6)}to{opacity:1;transform:none}}
@keyframes segOut{0%{opacity:1;transform:none}100%{opacity:.12;transform:translateY(-16px)}}
.pj-info{background:var(--panel2);border-radius:10px;padding:12px 16px;margin-top:10px;min-height:110px}
.pj-info .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.pj-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:8px;color:var(--muted)}
.pj-legend b{display:inline-block;min-width:30px;text-align:center;border-radius:4px;color:#fff;padding:0 4px;margin-right:4px}
.pj-prog{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.pj-prog div{height:100%;background:var(--accent);transition:width .5s}

/* ===================== animation ===================== */
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes heroShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes checkPop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px var(--accent-soft)}}
body,nav.side,.topbar,.card,.btn,.chip,.opt,.rcard,.tabs button,.steps button,.stepbody,.simple,.keys,.lessongrid button,.palgrid button,.sw,.tbl th,.svgbox,.urlparts,.navlist button,.navlist .num,input,select{
  transition:background-color .35s ease,color .35s ease,border-color .35s ease,transform .2s ease}
main.anim{animation:pageIn .45s cubic-bezier(.2,.7,.2,1) both}
.rv{opacity:0;transform:translateY(18px)}
.rv.in{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.btn:hover:not(:disabled),.chip:hover{transform:translateY(-2px)}
.btn:active:not(:disabled),.chip:active,.opt:active:not(:disabled){transform:scale(.97)}
.btn:hover:not(:disabled){box-shadow:0 6px 16px -6px var(--accent)}
.lessongrid button:hover,.palgrid button:hover,.rcard:hover,.card.try:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px var(--accent)}
.navlist button:hover{transform:translateX(3px)}
.opt:hover:not(:disabled){transform:translateX(4px)}
.opt.right{animation:popIn .45s ease}
.opt.wrong{animation:shake .45s ease}
.score{animation:fadeUp .5s ease both}
.rcard.open .a,.layer.open .ld,.explain{animation:fadeDown .35s ease both}
.layer{transition:transform .2s ease,filter .2s ease}
.layer:hover{transform:translateX(6px);filter:brightness(1.08)}
.stepbody>*{animation:fadeDown .35s ease both}

.navlist .done .num{animation:checkPop .5s cubic-bezier(.3,1.6,.5,1) both}


#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}

/* ===================== look: glass, soft shadows, richer dark ===================== */
:root{--glow:0 0 0 0 transparent;--radius:16px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px -14px rgba(40,30,20,.22);
  --glass:color-mix(in srgb,var(--panel) 68%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 32px -16px rgba(0,0,0,.75);
  --glow:0 0 22px -5px color-mix(in srgb,var(--accent) 75%,transparent);
  --glass:color-mix(in srgb,var(--panel) 58%,transparent)}}
:root[data-theme="dark"]{
  --shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 32px -16px rgba(0,0,0,.75);
  --glow:0 0 22px -5px color-mix(in srgb,var(--accent) 75%,transparent);
  --glass:color-mix(in srgb,var(--panel) 58%,transparent)}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;will-change:transform;background:
  radial-gradient(1100px 620px at -8% -12%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 62%),
  radial-gradient(900px 620px at 108% 112%,color-mix(in srgb,var(--c4) 13%,transparent),transparent 60%),
  radial-gradient(color-mix(in srgb,var(--text) 7%,transparent) 1px,transparent 1.3px) 0 0/22px 22px,
  transparent}
nav.side,.topbar{background:color-mix(in srgb,var(--panel) 94%,var(--bg));border-color:color-mix(in srgb,var(--line) 65%,transparent)}
.card,.lessongrid button,.palgrid button{background:color-mix(in srgb,var(--panel) 88%,transparent);border-radius:var(--radius);border-color:color-mix(in srgb,var(--line) 75%,transparent);box-shadow:var(--shadow)}
.try{box-shadow:var(--shadow),var(--glow)}
.simple,.keys,.pj-info,.stepbody,.svgbox{border-radius:14px}
.btn{border-radius:11px;box-shadow:var(--glow)}
.btn.ghost{box-shadow:none;background:color-mix(in srgb,var(--panel2) 85%,transparent)}
.navlist button{border-radius:11px}
.navlist button.on{box-shadow:var(--glow)}
.opt{border-radius:11px}
.rcard{border-radius:14px;background:color-mix(in srgb,var(--panel2) 80%,transparent)}
.tblwrap{border-radius:12px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:color-mix(in srgb,var(--panel) 80%,transparent)}
.tbl th{background:color-mix(in srgb,var(--panel2) 90%,transparent)}
.tbl tr:last-child td{border-bottom:0}
h1{letter-spacing:-.015em}
:root[data-theme="dark"] h1,:root[data-theme="dark"] .hero h1{text-shadow:0 0 28px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1{text-shadow:0 0 28px color-mix(in srgb,var(--accent) 35%,transparent)}}

/* ===================== new home hero ===================== */
.hero.hero2{position:relative;overflow:hidden;padding:30px;border-radius:22px;box-shadow:var(--shadow),var(--glow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.hero2 .netbg{position:absolute;inset:0;width:100%;height:100%;opacity:.6;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 25%,#000 75%);mask-image:linear-gradient(90deg,transparent 0%,transparent 25%,#000 75%)}
.hero2 .netbg line{stroke:var(--accent);stroke-opacity:.35;stroke-width:1.3}
.hero2 .netbg circle.nd{fill:var(--accent);opacity:.8}
.hero2 .netbg circle.mv{fill:var(--accent)}
@keyframes ndPulse{0%,100%{opacity:.45}50%{opacity:1}}
.hero-in{position:relative;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .bgc{stroke:color-mix(in srgb,var(--line) 85%,transparent)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lbl b{font-size:30px;line-height:1}
.ring .lbl span{font-size:12px;color:var(--muted)}
.cont{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 16px;border-radius:14px;cursor:pointer;width:100%;text-align:left;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.cont:hover{transform:translateY(-2px);box-shadow:var(--glow),0 10px 24px -14px var(--accent)}
.cont .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:18px;flex:none}
.cont small{display:block;color:var(--muted);font-size:12px}
@media (max-width:640px){.hero-in{grid-template-columns:1fr}.ring{margin:0 auto}}

/* ===================== fonts ===================== */
:root{--fh:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fm:'JetBrains Mono',ui-monospace,Consolas,monospace}
body{font-family:var(--fb)}
h1,h2,h3,.brand,.lessongrid .t,.layer,.ring .lbl b,.pj-info .hd b,.tabs button,.steps button,.btn,.chip,.navsep,.level,.qn,.sv b,.flip .f{font-family:var(--fh)}
h2{letter-spacing:-.01em}
.mono,kbd,.bits,.urlparts,pre,code,.kv dd.mono{font-family:var(--fm)}
/* ===================== icons ===================== */
.svgi{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none;display:inline-block}
.ltile{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ltile .svgi{width:22px;height:22px}
.ltile.big{width:56px;height:56px;border-radius:16px;box-shadow:var(--glow)}
.ltile.big .svgi{width:30px;height:30px}
.lrow{display:flex;gap:12px;align-items:flex-start;margin-top:6px}
.lhead{display:flex;gap:16px;align-items:center;margin-bottom:4px}
.lhead h1{margin:2px 0 0}
.keys h3 .svgi,.simple b .svgi{margin-right:4px}
.try>.tag .svgi{width:1em;height:1em;vertical-align:-.15em}
#menuBtn .svgi{width:20px;height:20px}
.cont .ic .svgi{width:18px;height:18px}
/* ===================== quiz look ===================== */
.qhead{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;margin:-4px -6px 6px;border-radius:12px;background:color-mix(in srgb,var(--panel) 96%,transparent);box-shadow:0 6px 14px -12px rgba(0,0,0,.4)}
@media (max-width:820px){.qhead{top:58px}}
.qcount{font-size:13px;color:var(--muted);font-weight:600}
.qdots{display:flex;flex-wrap:wrap;gap:6px}
.qdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;cursor:pointer;transition:transform .2s,background-color .3s}
.qdot:hover{transform:scale(1.3)}
.qdot.ok{background:var(--ok);border-color:var(--ok)}
.qdot.no{background:var(--bad);border-color:var(--bad)}
.quiz .qitem{padding:14px;margin:10px 0;border-radius:14px;border:1px solid transparent;transition:border-color .3s,background-color .3s}
.quiz .qitem.got{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.quiz .qitem.missed{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.qtext{display:flex;gap:10px;align-items:baseline}
.qn{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 9px;border-radius:99px}
.opt{display:flex;align-items:center;gap:12px}
.letter{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);transition:background-color .25s,border-color .25s,color .25s}
.opt:hover:not(:disabled) .letter{border-color:var(--accent);color:var(--accent)}
.opt.right .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.qscore{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:18px 20px;border-radius:16px;margin-top:12px;animation:fadeUp .5s ease both}
.qscore.pass{background:var(--ok-soft)} .qscore.fail{background:var(--warn-soft)}
.sring{position:relative;width:120px;height:120px;flex:none}
.sring svg{width:120px;height:120px;transform:rotate(-90deg)}
.sring circle{fill:none;stroke-width:10}
.sring .bg{stroke:color-mix(in srgb,var(--text) 12%,transparent)}
.sring .fg{stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.qscore.pass .fg{stroke:var(--ok)} .qscore.fail .fg{stroke:var(--warn)}
.sv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sv b{font-size:28px;line-height:1}
.sv span{font-size:12px;color:var(--muted)}
.stext{flex:1;min-width:200px}
.stext h3{margin:0 0 4px} .stext p{margin:0 0 10px}
.qscore.pass h3{color:var(--ok)} .qscore.fail h3{color:var(--warn)}
/* ===================== SDLC model diagrams ===================== */
.wf{animation:wfHi 6s infinite both}
@keyframes wfHi{0%,19%,100%{opacity:.5}3%,16%{opacity:1}}
.grow{transform-box:fill-box;transform-origin:left center;animation:growX 6s infinite both}
@keyframes growX{0%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}

/* ===================== performance ===================== */
.offscreen *, .offscreen{animation-play-state:paused!important}
body.lite *,body.lite *::before,body.lite *::after{animation:none!important;transition:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;filter:none!important}
body.lite::before{display:none}
body.lite .rv{opacity:1;transform:none}
.svgbox,.hero{contain:layout paint}

/* ===================== study buddy ===================== */
#buddy{position:fixed;right:18px;bottom:16px;z-index:45;width:var(--bs,96px);height:var(--bs,96px);pointer-events:none}
.bud{--bs:var(--bsz,96px)}
#buddy.off{display:none}
.bud.bean{--bud-c:var(--c7)} .bud.cat{--bud-c:#1b191e;--bud-rim:#5a5463} .bud.cat .eyeopen ellipse{fill:#f2c53d} .bud.cat .pupil circle:first-child{fill:#111} .bud.cat .eyeshut,.bud.cat .eyehappy,.bud.cat .mouth{stroke:#e9e3ef} .bud.blob{--bud-c:var(--accent)}
.bud-btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:var(--bs,96px);height:var(--bs,96px);pointer-events:auto;-webkit-tap-highlight-color:transparent}
.bud-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:50%}
.bud-body{width:100%;height:100%;transform-origin:50% 92%;animation:budFloat 4s ease-in-out infinite}
.bud-body svg{width:100%;height:100%;overflow:visible;display:block;transition:transform .3s ease;transform-origin:50% 90%}
.bud.lean-d .bud-body svg{transform:rotate(-7deg) translateY(2px)}
.bud.lean-u .bud-body svg{transform:rotate(7deg) translateY(-2px)}
@keyframes budFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bud.blob .bud-body{animation:budSquish 3.2s ease-in-out infinite}
.bud.penguin .bud-body{animation:pengSway 3.4s ease-in-out infinite}
@keyframes pengSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bud.vibing .bud-body{animation:budBob calc(var(--beat,.8s)*2) ease-in-out infinite}
@keyframes budBob{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(3px) rotate(-3deg)}75%{transform:translateY(3px) rotate(3deg)}}
@keyframes budSquish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
.bud.m-sleep .bud-body{animation:budBreath 3.6s ease-in-out infinite}
@keyframes budBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.bud.hop .bud-body{animation:budHop .55s ease 2}
@keyframes budHop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-18px) scale(.94,1.07)}70%{transform:translateY(0) scale(1.08,.92)}}
.bud.shake .bud-body{animation:budShake .5s ease}
@keyframes budShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bud.party .bud-body{animation:budParty .8s ease 3}
@keyframes budParty{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-14deg) translateY(-14px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(14deg) translateY(-14px)}}
.bud.jiggle .bud-body{animation:budJiggle .55s ease 2}
@keyframes budJiggle{0%,100%{transform:scale(1)}25%{transform:scale(1.12,.88)}50%{transform:scale(.92,1.08)}75%{transform:scale(1.04,.96)}}
.bud.startle .bud-body{animation:budStartle .45s ease}
@keyframes budStartle{0%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.05)}100%{transform:translateY(0)}}
.bud .eye{transform-box:fill-box;transform-origin:center;animation:budBlink 5.5s infinite}
@keyframes budBlink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.bud .tail{transform-box:view-box;transform-origin:72px 84px;animation:tailSwish 2.8s ease-in-out infinite}
@keyframes tailSwish{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.bud .steam path{stroke:var(--muted);stroke-width:2.2;fill:none;stroke-linecap:round;opacity:0}
.bud.m-happy .steam path,.bud.m-love .steam path,.bud.m-party .steam path{animation:steamUp 1.8s ease-out infinite}
.bud .steam path:nth-child(2){animation-delay:.5s!important}.bud .steam path:nth-child(3){animation-delay:1s!important}
@keyframes steamUp{0%{opacity:0;transform:translateY(6px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-9px)}}
.bud .deco>*{opacity:0;transition:opacity .3s}
.bud.m-sleep .zzz,.bud.m-love .hearts,.bud.m-think .qmark,.bud.m-sad .sweat,.bud.m-party .sparks,.bud.m-surprised .bang{opacity:1}
.bud .zzz{animation:zzz 2.6s ease-in-out infinite}
@keyframes zzz{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-4px)}}
.bud .eyeshut,.bud .eyehappy{display:none}
.bud.m-sleep .eyeopen{display:none}.bud.m-sleep .eyeshut{display:inline}
.bud.m-love .eyeopen,.bud.m-party .eyeopen,.bud.m-happy .eyeopen{display:none}
.bud.m-love .eyehappy,.bud.m-party .eyehappy,.bud.m-happy .eyehappy{display:inline}
.bud .cheek{opacity:.35;transition:opacity .3s}.bud.m-love .cheek,.bud.m-happy .cheek{opacity:.75}
.bud-bubble{position:absolute;right:6px;bottom:calc(var(--bs,96px) + 8px);width:max-content;max-width:min(280px,calc(100vw - 36px));padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 12px 28px -12px rgba(0,0,0,.45);font-size:14px;line-height:1.45;opacity:0;transform:translateY(8px) scale(.96);transform-origin:bottom right;transition:opacity .22s ease,transform .22s ease;pointer-events:none}
.bud-bubble.show{opacity:1;transform:none;pointer-events:auto}
.bud-bubble .bname{display:block;font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px;padding-right:18px}
.bud-x{position:absolute;top:5px;right:7px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px}
.bud-menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.bud-menu button,.bud-q button{font:inherit;font-size:13px;color:var(--text);border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 9px;cursor:pointer;text-align:left}
.bud-menu button:hover,.bud-q button:hover:not(:disabled){border-color:var(--accent)}
.bud-q{display:grid;gap:5px;margin-top:8px}
.bud-q button.right{background:var(--ok-soft);border-color:var(--ok)}
.bud-q button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.bud-q button:disabled{cursor:default}
.bud-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bud-row button,.bud-row a{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:4px 10px;cursor:pointer;text-decoration:none}
@media (max-width:820px){#buddy{right:8px;bottom:8px}.bud{--bs:calc(var(--bsz,96px)*.72)}}
@media print{#buddy,.buddy2,.bud-home,.wx,.cosy-bg{display:none}}

.u-tok small{font-size:11px;color:var(--muted);text-align:center}
.u-tok.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.u-tok:focus-visible,.u-prob:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.u-gen{font-size:18px;font-weight:600;padding:12px 14px;background:var(--panel2);border-radius:12px;min-height:52px}
.u-caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-.15em;margin-left:3px;animation:pulse 1s steps(2) infinite}
.u-prob{display:grid;grid-template-columns:88px 1fr 44px;gap:10px;align-items:center;font-size:14px;margin:3px 0}
.u-prob span{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.u-prob i{display:block;height:100%;background:var(--muted);border-radius:99px}
.u-prob.top i{background:var(--ok)}
.u-prob small{color:var(--muted);text-align:right}
.u-formula{background:var(--panel2);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px;overflow-x:auto;white-space:nowrap}
/* ===================== Units 1-2 lesson extras ===================== */
.card.trap{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad-soft) 55%,var(--panel))}
.card.trap ul{margin:6px 0 0;padding-left:20px}
.card.count{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
details.model{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;background:var(--panel)}
details.model summary{cursor:pointer}
details.model[open] summary{margin-bottom:6px}
.u-gh{display:grid;gap:8px}
.u-gh label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.u-gh input[type=range]{flex:1;min-width:140px}
.u-lane{display:grid;grid-template-columns:150px 1fr 120px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.u-cells{display:flex;gap:4px}
.u-cells span{flex:1;text-align:center;padding:6px 0;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:12px;transition:background-color .2s}
.u-cells span.seen{background:var(--accent-soft)}
.u-cells span.cur{background:var(--accent);color:var(--on-accent)}
.u-cells span.hit{background:var(--ok);color:#fff}
.u-layer{margin:4px auto;padding:9px;border-radius:9px;color:#fff;font-weight:600;text-align:center;opacity:.75;transition:transform .25s,opacity .25s}
.u-layer.on{opacity:1;transform:scale(1.04);box-shadow:0 0 0 3px var(--accent)}
.u-term{background:#14110f;color:#e8e0d6;border-radius:10px;padding:10px;margin-top:6px;font-size:13px}
.u-term .u-tlog{max-height:120px;overflow:auto;white-space:pre-wrap}
.u-term input{background:transparent;border:0;color:inherit;outline:none;padding:2px}
.u-stack{display:grid;gap:3px;margin:6px 0}
.u-stack div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:7px;font-size:13.5px;font-weight:600}
.u-stack .you{background:var(--accent-soft);color:var(--accent)}
.u-stack .prov{background:var(--panel2);color:var(--muted)}
.u-stack span{font-weight:400;font-size:12px}
@media (max-width:640px){.u-lane{grid-template-columns:1fr}}

/* ===================== buddy v3: petting, particles, treats, outfits ===================== */
.bud-fx{position:absolute;left:0;top:0;width:var(--bs,96px);height:var(--bs,96px);pointer-events:none;overflow:visible}
.bfx{position:absolute;left:50%;top:22%;font-size:17px;line-height:1;opacity:0;animation:bfxUp 1.3s ease-out forwards;will-change:transform,opacity}
@keyframes bfxUp{0%{opacity:0;transform:translate(-50%,0) scale(.4)}18%{opacity:1;transform:translate(calc(-50% + var(--dx)*.3),-12px) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-72px) scale(.85) rotate(var(--rot))}}
.bfx.treat{font-size:26px;top:40%;animation:treatIn .65s cubic-bezier(.45,0,.8,.55) forwards}
@keyframes treatIn{0%{opacity:1;transform:translate(-190%,-150px) rotate(-50deg) scale(1.1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,8px) rotate(0) scale(.35)}}
.bfx.fly{font-size:11px;top:10%;animation:flyAround 2.5s linear forwards}
@keyframes flyAround{0%{opacity:1;transform:translate(-80px,-10px)}20%{transform:translate(-10px,-55px)}40%{transform:translate(45px,-20px)}60%{transform:translate(10px,-60px)}80%{opacity:1;transform:translate(-40px,-70px)}100%{opacity:0;transform:translate(-120px,-120px)}}
.bud.petting .bud-body{animation:none}
.bud.petting .bud-body svg{transform:translate(calc(var(--px,0)*3px),calc(var(--py,0)*2px + var(--press,0)*3px)) rotate(var(--lean,0deg)) scale(calc(1.03 + var(--press,0)*.04),calc(.97 - var(--press,0)*.06));transition:transform .12s ease-out}
.bud.petting.blob .bud-body{animation:budJiggle .4s ease infinite}
.bud.petting.cat .tail{animation-duration:1s}
.bud.petting .cheek{opacity:1}
.bud.munch .mouth{animation:munch .19s ease-in-out 6;transform-box:fill-box;transform-origin:center}
@keyframes munch{50%{transform:scaleY(.25) scaleX(1.1)}}
.bud.stretch .bud-body{animation:budStretch 1.2s ease}
@keyframes budStretch{0%,100%{transform:none}40%,60%{transform:scale(.9,1.16)}}
.bud.melt .bud-body{animation:budMelt 1.8s ease}
@keyframes budMelt{0%,100%{transform:none}35%,60%{transform:scale(1.24,.66) translateY(15px)}}
.bud-aff{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0 4px;padding-right:18px}
.bud-aff .bar{flex:1;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;min-width:90px}
.bud-aff .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ab8,#ff4f79);border-radius:99px}
.bud-menu button.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.bud-menu button.locked{opacity:.6;cursor:not-allowed}
.bud-menu small{font-size:11px}
.bud-hint{margin:8px 0 0;font-size:11.5px;color:var(--muted)}
.bud-bubble{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}


/* ===================== buddy: drag + bubble flip ===================== */
.bud-btn{touch-action:none;cursor:grab}
.bud.dragging .bud-btn{cursor:grabbing}
#buddy.free{right:auto;bottom:auto}
.bud.dragging .bud-body{animation:budHeld .5s ease-in-out infinite}
@keyframes budHeld{0%,100%{transform:rotate(-9deg) scale(1.05,.95)}50%{transform:rotate(9deg) scale(.95,1.08)}}
.bud.land .bud-body{animation:budLand .45s ease}
@keyframes budLand{0%{transform:scale(1.15,.8) translateY(6px)}55%{transform:scale(.94,1.08) translateY(-4px)}100%{transform:none}}
#buddy.flip-x .bud-bubble{right:auto;left:6px;border-radius:16px 16px 16px 4px;transform-origin:bottom left}
#buddy.flip-y .bud-bubble{bottom:auto;top:calc(var(--bs,96px) + 8px);border-radius:16px 4px 16px 16px;transform-origin:top right}
#buddy.flip-x.flip-y .bud-bubble{border-radius:4px 16px 16px 16px;transform-origin:top left}


.iq summary{line-height:1.45}
.iqn{display:inline-block;min-width:34px;font-weight:700;color:var(--accent);font-family:var(--fh)}
details.iq.seen summary .iqn::after{content:" ✓";color:var(--ok)}
.iq pre{background:var(--panel2);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:13px}
.iq-see{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:12px}

{ id:'eco', unit:'1-2', level:'Basics', title:'The computer ecosystem', desc:'Definition, 6 elements, 4 characteristics, applications & digitization',
html:`
${simple('A computer is not just a box on a desk. It is a whole <b>ecosystem</b>: devices, programs, networks, data and people that only produce something useful when they all work together — like plants and animals in a forest.')}
<div class="card"><b>Definition (learn word for word):</b> A <b>computer ecosystem</b> is a comprehensive and interconnected environment consisting of hardware, software, networks, data and users that work together to perform computing tasks, share resources and deliver digital services.</div>
<ul><li>It works like a <b>biological ecosystem</b>: components interact and depend on each other.</li><li>This interdependence maintains balance and efficiency; each element has a specific role and none is useful on its own.</li><li>Their combined interaction decides the system’s overall <b>performance, security and reliability</b>.</li><li>It includes not only the machine but also the <b>users and the network</b>; modern ecosystems also include AI components such as Siri and Alexa.</li></ul>
<h2>The six key elements</h2>
${table(['Element','Meaning','Example'],[['<b>Hardware</b>','Physical devices that form the foundation','CPU, monitor, printer'],['<b>Software</b>','Programs that manage and control hardware','Windows, MS Word'],['<b>Networking</b>','Systems enabling communication and data sharing','Internet, Wi-Fi router'],['<b>Data</b>','Information processed and stored in the system','Files, records'],['<b>Users</b>','Entities that interact with and control the ecosystem','Students, businesses'],['<b>Environment</b>','Platforms and infrastructure supporting it','Cloud platforms, data centres']])}
<div class="card"><b>Memory trick:</b> <i><b>H</b>appy <b>S</b>tudents <b>N</b>ever <b>D</b>elay <b>U</b>nit <b>E</b>xams</i> = Hardware, Software, Networking, Data, Users, Environment.</div>
<h2>The four characteristics</h2>
<div class="grid">
${reveal('Interconnectedness','All components communicate and work in sync, giving seamless operation.')}
${reveal('Flexibility','Supports various configurations and uses; adapts to different scenarios.')}
${reveal('Scalability','Can grow or shrink with the needs; adapts to changing demands.')}
${reveal('Sustainability','Encourages responsible use of resources and energy; long-term viability.')}
</div>
<p>Trick: <b>“IF SS”</b> = Interconnected, Flexible, Scalable, Sustainable. <i>Elements are the parts; characteristics are qualities of the whole.</i></p>
<h2>The ecosystem cycle (5 stages)</h2>
<div class="svgbox"><svg viewBox="0 0 600 260" role="img" aria-label="Computer ecosystem cycle">
<text x="300" y="134" text-anchor="middle" font-weight="700">Computer Ecosystem Cycle</text>
${['Hardware Interaction','Software Execution','Network Connectivity','Data Management','User Engagement'].map((t,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,x=300+200*Math.cos(a),y=130+100*Math.sin(a);const a2=a+2*Math.PI/5,x2=300+200*Math.cos(a2),y2=130+100*Math.sin(a2);return `<path d="M${(x+(x2-x)*.32).toFixed(0)} ${(y+(y2-y)*.32).toFixed(0)} L${(x+(x2-x)*.68).toFixed(0)} ${(y+(y2-y)*.68).toFixed(0)}" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#cyA)"/><rect x="${(x-78).toFixed(0)}" y="${(y-16).toFixed(0)}" width="156" height="32" rx="16" fill="var(--c${[1,4,2,6,3][i]})"/><text x="${x.toFixed(0)}" y="${(y+5).toFixed(0)}" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:#fff">${t}</text>`}).join('')}
<defs><marker id="cyA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs></svg></div>
<div class="card"><b>Cloud example (use whenever an example is asked):</b> hardware = data centres and client devices; software = cloud platforms (AWS, Azure); networking = internet infrastructure; users = businesses, developers and end-users; services = storage, computing power, AI tools.</div>
${tryBox('Which element is it?', sorter('ecoSort',[['CPU','Hardware'],['Monitor','Hardware'],['Windows','Software'],['MS Word','Software'],['Wi-Fi router','Networking'],['The Internet','Networking'],['Student records file','Data'],['Customer database','Data'],['Students','Users'],['Businesses','Users'],['Cloud data centre','Environment'],['Cloud platform','Environment']],['Hardware','Software','Networking','Data','Users','Environment']))}
<h2>Applications of computers</h2>
<p>Computers are used in everyday life and in many fields: agriculture, banking, education, social networks, and research &amp; development.</p>
<ul><li>Traffic lights changing red → green → amber are a computer system at work.</li><li>Engineers, architects and filmmakers use computers to <b>design</b>.</li><li>Teachers, writers and office workers use them for research, word processing and email.</li><li>Small businesses use them for sales and record keeping; young people play games.</li></ul>
<h3>Agriculture</h3>
<ul><li>Records: budgets, farm-equipment inventories, animal health forms.</li><li>Tractors and fertiliser sprayers have programmable computers that adjust fertiliser to the soil and crop → better soil, higher yield.</li><li>Irrigation in dry areas; breeding disease-resistant animals that give more milk or fur.</li></ul>

<h3>The ecosystem in the digitization of industries</h3>
${table(['Element','In a digitized farm'],[['Hardware','Light, moisture and temperature sensors; programmable sprayers'],['Software','Compares readings to preset values and decides the action'],['Networking','Sends readings from the field to the farmer’s computer'],['Data','Budget, equipment and animal-health records, analysed for better decisions'],['Users','Farmer and farm staff act on what the system reports']])}
<p>Because the ecosystem is <b>scalable and flexible</b>, the same arrangement fits one farm or a national chain → automation with fewer errors.</p>

/* ---------- U1: hardware & devices ---------- */
{ id:'hardware', unit:'1-2', level:'Basics', title:'Hardware & I/O devices', desc:'Hardware, input/output/storage devices, block vs character',
html:`
${simple('Hardware is everything you can touch. Each part has one job on the path data travels: it comes <b>In</b>, gets <b>Processed</b>, is <b>Stored</b>, and goes <b>Out</b>.')}
<div class="card"><b>Definition:</b> <b>Hardware</b> is a collective term for any of the physical components of an analog or digital computer. It distinguishes the tangible parts of a computer from <b>software</b>, which is written, machine-readable instructions that tell the physical components what to do and when.</div>
<ul><li>Hardware is the <b>foundation</b> of the ecosystem: case, CPU, monitor, mouse, keyboard, storage, graphics card, sound card, speakers, motherboard.</li><li>The <b>motherboard</b> connects the CPU to every other component (think of it as the road network).</li><li>Hardware cannot decide anything by itself; it only follows instructions from software.</li></ul>
${table(['Category','Job','Examples'],[['<b>Input devices</b>','Take data and instructions into the computer','Keyboard, mouse, scanner, camera'],['<b>Processing unit</b>','Processes the data','CPU (control unit + ALU)'],['<b>Storage devices</b>','Hold data temporarily or permanently','RAM, ROM, hard disk, USB flash drive'],['<b>Output devices</b>','Give the processed result to the user','Monitor, printer, speakers']])}
<div class="card"><b>Memory trick: I-P-S-O</b> — In, Process, Store, Out: the order data travels through hardware.</div>
<h2>Input, output &amp; storage devices</h2>
<div class="grid">
${reveal('Input device','Takes data and instructions into the computer. e.g. keyboard, mouse, scanner.')}
${reveal('Output device','Gives the processed information to the user. e.g. monitor, laser printer, speakers.')}
${reveal('Storage device','Any hardware capable of holding information temporarily or permanently. e.g. RAM, hard disk, USB drive.')}
${reveal('Communication device','Carries data both ways: modem, Ethernet. Don’t call them input-only!')}
</div>
${table(['Point','Input devices','Output devices','Storage devices'],[['Role','Bring data &amp; instructions in','Deliver processed information out','Hold data before, during and after processing'],['Direction','User → computer','Computer → user','Both ways, within the computer'],['Position on the path','Start','End','Alongside the whole path'],['Volatility matters?','No','No','Yes — primary mostly volatile, secondary not'],['Examples','Keyboard, mouse, scanner','Monitor, printer, speakers','RAM, hard disk, USB drive']])}
<h3>Two more ways to classify devices</h3>
${table(['Point','Block device','Character device'],[['Moves data as','Fixed-size blocks','A stream of single characters'],['Addressable','Yes — blocks can be read out of order','No — characters arrive one after another'],['Examples','Hard disk, USB drive','Keyboard, mouse, printer']])}
<ul><li><b>Dedicated</b> devices serve one user/job at a time (a printer mid-page); <b>shared</b> devices serve many at once (a disk).</li><li>The operating system keeps track of all devices using the <b>I/O controller</b> and device drivers.</li></ul>
<p class="muted">Trick: a block device moves data in buckets; a character device moves it drop by drop.</p>
${tryBox('Sort the devices', sorter('hwSort',[['Keyboard','Input'],['Scanner','Input'],['Mouse','Input'],['Camera','Input'],['Monitor','Output'],['Laser printer','Output'],['Speakers','Output'],['RAM','Storage'],['Hard disk','Storage'],['USB flash drive','Storage'],['Modem','Communication'],['Ethernet','Communication'],['CPU','Processing']],['Input','Output','Storage','Processing','Communication']))}
${counts('four hardware categories by job · two device classifications (block/character, dedicated/shared).')}
${model('Compare input, output and storage devices with respect to their role in the ecosystem (5 marks)','One-line definitions of all three → points (start / end / alongside the path; storage = primary + secondary; OS controls them via drivers and the I/O controller) → <b>the comparison table</b> (the marks are in the table) → example: a scanned page enters by scanner, is held in RAM and on disk, leaves by printer.')}
${traps(['Calling the monitor an input device. It is output.','Forgetting the motherboard and internal storage when listing hardware.','Calling a modem or Ethernet input-only — they are two-way communication devices.','Answering a “compare” question with three lists and no table.'])}`,
init(){initSorter('hwSort')},
keys:['Hardware = physical, tangible components; software = machine-readable instructions telling hardware what to do.','4 categories by job: Input, Processing, Storage, Output (I-P-S-O).','Input = start of path, output = end, storage = alongside; modem/Ethernet = two-way communication.','Block devices (disk, USB) move fixed blocks and are addressable; character devices (keyboard, mouse, printer) move a stream.','Dedicated (printer) vs shared (disk); the OS tracks devices with the I/O controller.'],
quiz:[
{q:'Which is an output device?',o:['Scanner','Monitor','Keyboard','Mouse'],a:1,e:'Monitor shows information to the user.'},
{q:'A modem is best described as a…',o:['Input device','Output device','Communication device (two-way)','Storage device'],a:2,e:'Modem and Ethernet carry data both ways.'},
{q:'Which is a block device?',o:['Keyboard','Mouse','Hard disk','Printer'],a:2,e:'Hard disk and USB drive move fixed-size, addressable blocks.'},
{q:'What connects the CPU to every other component?',o:['Monitor','Motherboard','RAM','Power supply'],a:1,e:'The motherboard is the road network of the computer.'},
{q:'I-P-S-O stands for…',o:['Input, Process, Store, Output','Install, Program, Save, Open','Input, Print, Scan, Output','Instruction, Process, System, OS'],a:0,e:'The order data travels through hardware.'},
