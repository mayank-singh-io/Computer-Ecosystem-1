{ id:'www', level:'Applied', title:'WWW, URLs, browsers & search engines', desc:'How the web is addressed and searched',
html:`
${simple('The Internet is the roads; the World Wide Web is one of the things that travels on them — web pages linked together. A URL is a page’s address, a browser shows pages, and a search engine helps you find pages when you don’t know the address.')}
<div class="card"><b>World Wide Web (WWW):</b> a huge collection of linked documents (web pages) stored on web servers all over the Internet, connected by hyperlinks and accessed with a web browser using HTTP/HTTPS.</div>
<h2>URL (Uniform Resource Locator)</h2>
<p>The address of a web page or other resource on the Internet — like a postal address identifies a house.</p>
${tryBox('URL dissector — type any web address', `<input type="text" id="urlIn" class="mono" value="http://www.vbs.com/welcome/main.html" style="width:100%"><div id="urlOut" style="margin-top:10px"></div>
<div class="legend"><span><i style="background:var(--c1)"></i>Protocol</span><span><i style="background:var(--c2)"></i>Host name</span><span><i style="background:var(--c4)"></i>Domain name</span><span><i style="background:var(--c3)"></i>Path</span></div>`)}
<ul><li><b>Protocol</b> (http:// or https://): tells the browser which protocol to use.</li>
<li><b>Host name</b> (www.vbs.com, i.e. name.domain name): identifies the web site / web server.</li>
<li><b>Domain name</b> (vbs.com): the last part of the host name, registered for that organisation’s exclusive use.</li>
<li><b>Path</b> (welcome/main.html): the folder and file where the page is stored on the server.</li></ul>
<h2>Domain Name System (DNS) & domain extensions</h2>
<p>DNS translates domain names into IP addresses. The part after the last dot is the <b>top-level domain (TLD)</b>, showing the type of organisation or the country.</p>
${table(['Domain','Used for','Example'],[
['.com','Commercial websites (earn money, e.g. from ads)','www.yahoo.com'],['.edu','Educational (schools, colleges, universities)','www.lums.edu.pk'],['.gov','Government institutions','www.india.gov.in'],
['.org','Non-profit organisations','www.wikipedia.org'],['.mil','Military','www.army.mil'],['.net','Networking organisations','www.php.net'],
['.ca / .th / .sa / .in','Country codes (ccTLDs): Canada, Thailand, Saudi Arabia, India; often combined, e.g. .edu.pk, .ac.in','www.utoronto.ca, www.iitd.ac.in']])}
<h2>Web browser</h2>
<p>A software application that locates, retrieves and displays web pages (text, images, music, videos, games). It requests a page from the web server using its URL, then displays it. After installing, a browser icon appears on the desktop — double-click it to open.</p>
<div class="grid">
${reveal('Google Chrome','By Google; currently the most widely used browser.')}
${reveal('Mozilla Firefox','Free, open-source, by the Mozilla Foundation.')}
${reveal('Safari','By Apple; default on Mac, iPhone and iPad.')}
${reveal('Internet Explorer','By Microsoft; once default on Windows, now retired and replaced by Microsoft Edge.')}
${reveal('Opera','Fast browser by Opera Software; also Opera Mini for mobile.')}
${reveal('Netscape Navigator','One of the earliest popular browsers; discontinued.')}
</div>
<p class="muted">Others: TheWorld, Tencent Traveler, Maxthon, Camino, Flock, OmniWeb, Shiira.</p>
<h3>Parts of a browser window</h3>
<div class="svgbox"><svg viewBox="0 0 600 250" role="img" aria-label="Browser window parts">
<rect x="10" y="10" width="580" height="230" rx="8" fill="var(--panel)" stroke="var(--line)"/>
<rect x="10" y="10" width="580" height="24" rx="8" fill="var(--c1)"/><text x="20" y="27" font-size="12" style="fill:#fff">Title bar — page title + browser name</text>
<text x="20" y="50" font-size="12">File  Edit  View  History  Bookmarks  Tools  Help   ← menu bar</text>
<text x="20" y="74" font-size="14">◀ ▶ ⟳ ✕ ⌂</text><rect x="110" y="60" width="300" height="22" rx="4" fill="var(--panel2)" stroke="var(--c2)"/><text x="118" y="76" font-size="12">http://www.google.co.in/  ← address bar</text>
<rect x="420" y="60" width="160" height="22" rx="4" fill="var(--panel2)" stroke="var(--c3)"/><text x="428" y="76" font-size="12">🔍 search box</text>
<text x="20" y="100" font-size="12" class="muted">★ Bookmarks toolbar: saved / most-visited sites</text>
<rect x="20" y="108" width="560" height="100" fill="var(--panel2)"/><text x="300" y="162" text-anchor="middle" font-size="14">Display area — the web page</text>
<text x="20" y="230" font-size="12">Status bar: “Done” / loading status</text>
<text x="20" y="92" font-size="10" class="muted">nav buttons: back · forward · reload · stop · home</text>
</svg></div>
<h2>Search engines</h2>
<p>If you don’t know a site’s URL, you search for it (in older browsers the address bar could only open a known address). A <b>search engine</b> is a tool/web site that helps you find information on the WWW: you type <b>keywords</b> and get a list of links ranked by relevance.</p>
${tryBox('How a search engine works', `<div class="steps" id="seSteps"></div><div class="stepbody" id="seBody"></div>`)}
<p><b>Search engines:</b> Google (most used today), Yahoo!, MSN / Windows Live (now <b>Bing</b>), Ask.com, AOL Search, AltaVista, Lycos, Overture, Netscape Search, iWon, DMOZ (directory), LookSmart, Teoma, HotBot, AlltheWeb, Inktomi; also DuckDuckGo today.</p>`,
init(){
 const inp=$('#urlIn'), out=$('#urlOut');
 const TLD={com:'Commercial',edu:'Educational',gov:'Government',org:'Non-profit organisation',mil:'Military',net:'Networking organisation',in:'India',ca:'Canada',th:'Thailand',sa:'Saudi Arabia',pk:'Pakistan',uk:'United Kingdom',us:'United States',au:'Australia'};
 function upd(){
  let s=inp.value.trim(), added=false;
  if(!s){out.innerHTML='';return}
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)){s='http://'+s;added=true}
  let u; try{u=new URL(s)}catch(e){out.innerHTML='<p class="bad">That doesn’t look like a valid URL.</p>';return}
  const host=u.hostname, labels=host.split('.');
  let dn=host;
  if(labels.length>=2){const sld=labels[labels.length-2];dn=(labels.length>=3&&labels[labels.length-1].length===2&&['ac','co','edu','gov','org','net','com'].includes(sld))?labels.slice(-3).join('.'):labels.slice(-2).join('.')}
  const pre=host.slice(0,host.length-dn.length), path=(u.pathname+u.search+u.hash).replace(/^\//,'');
  const tld=labels[labels.length-1].toLowerCase();
  out.innerHTML=`<div class="urlparts"><span style="background:var(--c1);color:#fff">${esc(u.protocol)}//</span><span style="background:var(--c2);color:#fff">${esc(pre)}</span><span style="background:var(--c4);color:#fff">${esc(dn)}</span>${path?`<span style="background:var(--c3);color:#fff">/${esc(path)}</span>`:''}</div>
  <dl class="kv" style="margin-top:10px"><dt>Protocol</dt><dd>${esc(u.protocol.replace(':',''))}${added?' <span class="muted">(assumed)</span>':''}${u.protocol==='https:'?' — encrypted with SSL/TLS':u.protocol==='http:'?' — not encrypted':''}</dd>
  <dt>Host name</dt><dd>${esc(host)}</dd><dt>Domain name</dt><dd>${esc(dn)}</dd><dt>Top-level domain</dt><dd>.${esc(tld)} ${TLD[tld]?'— '+TLD[tld]:''}</dd><dt>Path</dt><dd>${path?esc('/'+path):'(home page)'}</dd></dl>`;
 }
 inp.oninput=upd; upd();
 stepper('#seSteps','#seBody',[
  ['1. Crawling','Programs called <b>crawlers</b> (spiders / bots) visit web pages and follow their links to discover new pages.'],
  ['2. Indexing','The content of the pages found is stored in a huge database called the <b>index</b>.'],
  ['3. Ranking','When you type keywords, the engine looks them up in the index and shows the <b>most relevant results first</b>.']]);
},
keys:['WWW = linked web pages on servers, accessed by browsers via HTTP/HTTPS; the Internet is the network, the WWW is a service on it.','URL parts: protocol (http://) · host name (www.vbs.com) · domain name (vbs.com) · path (welcome/main.html).','DNS: names → IP addresses. TLDs: .com .edu .gov .org .mil .net + country codes (.in .ca .th .sa).','Browser = locates, retrieves, displays pages (Chrome, Firefox, Safari, IE→Edge, Opera, Netscape).','Search engine = crawl → index → rank; Google, Bing, Yahoo!…'],
quiz:[
{q:'In http://www.vbs.com/welcome/main.html, what is the domain name?',o:['http://','www.vbs.com','vbs.com','welcome/main.html'],a:2,e:'Domain name = last part of the host name, vbs.com.'},
{q:'The path part of that URL is…',o:['www','vbs.com','welcome/main.html','http'],a:2,e:'The path is where the page is stored on the server.'},
{q:'Which extension is used by military websites?',o:['.mil','.gov','.net','.org'],a:0,e:'.mil = military.'},
{q:'What does DNS do?',o:['Encrypts web pages','Translates domain names into IP addresses','Sends emails','Stores bookmarks'],a:1,e:'DNS maps names to IP addresses.'},
{q:'A search engine’s database of discovered pages is called the…',o:['Index','Cache','Crawler','Bookmark'],a:0,e:'Crawl → Index → Rank.'},
{q:'Which browser replaced Internet Explorer?',o:['Opera','Safari','Microsoft Edge','Netscape'],a:2,e:'IE has been retired and replaced by Microsoft Edge.'}
]},

{ id:'iot', level:'Applied', title:'Internet of Things (IoT)', desc:'Smart devices that sense, talk and act',
html:`
${simple('IoT means everyday objects — a watch, a car, a fridge, a parking spot — have sensors and internet, so they can collect data and act on it by themselves.')}
<div class="card"><b>Internet of Things (IoT):</b> the network of physical objects or “things” embedded with electronics, software, sensors and network connectivity, which lets them collect and exchange data.</div>
<div class="card"><b>A “Thing”</b> is an entity or physical object that has a <b>unique identifier</b>, an <b>embedded system</b> and the <b>ability to transfer data over a network</b>. Examples: heart-monitoring implants · biochip transponders on farm animals · automobiles with built-in sensors · DNA analysis devices and other wearables. They collect useful data and then autonomously pass it to other devices.</div>
<h2>How IoT works</h2>
<p>IoT — sometimes called the <b>Internet of Everything (IoE)</b> — is made of <b>web-enabled</b> “smart” or “connected” devices that collect, send and act on data from their surroundings using embedded sensors, processors and communication hardware. Devices can talk to related devices — called <b>machine-to-machine (M2M)</b> communication — and act on the information they get. Humans set them up, give instructions or access data, but the devices do most of the work <b>without human intervention</b>. This is possible thanks to tiny mobile components and always-online home and business networks.</p>
${tryBox('IoT lifecycle — follow a smart parking spot', `<div class="steps" id="iotSteps"></div><div class="stepbody" id="iotBody"></div>`)}
<h2>Applications</h2>
<div class="grid">${['🏠 Building & home automation','🏭 Manufacturing','🏥 Medical & healthcare systems','📺 Media','🌿 Environmental monitoring','🌉 Infrastructure management','⚡ Energy management','🚗 Transportation','👵 Better quality of life for the elderly'].map(x=>`<div class="card" style="margin:0">${x}</div>`).join('')}</div>
<p><i>“You name it, and you will have it in IoT!”</i></p>
<div class="card"><b>Smart parking:</b> could create <b>USD 41 billion</b> by showing parking-space availability across a city. Residents find and reserve the closest free space, traffic wardens spot non-compliant use, and municipalities can introduce demand-based pricing.</div>`,
init(){
 stepper('#iotSteps','#iotBody',[
  ['Collect','A sensor in the parking spot detects whether a car is present.'],
  ['Communicate','The sensor sends that status over the network to a city server (machine-to-machine).'],
  ['Analyze','The server combines data from thousands of spots to find which are free, and where demand is high.'],
  ['Act','Drivers’ apps show and reserve the nearest free spot; wardens get alerts; prices adjust to demand.']]);
},
keys:['IoT = physical things with electronics, software, sensors and connectivity that collect and exchange data.','A Thing has a unique identifier, an embedded system and can send data over a network.','Also called Internet of Everything (IoE); devices talk via machine-to-machine (M2M) with little human intervention.','Lifecycle: Collect → Communicate → Analyze → Act.','Applications: home automation, healthcare, energy, transport, environment…; smart parking ≈ USD 41 billion.'],
quiz:[
{q:'Device-to-device communication in IoT is called…',o:['P2P','M2M','B2B','LAN'],a:1,e:'Machine-to-machine (M2M).'},
{q:'Which is NOT required for something to be an IoT “Thing”?',o:['Unique identifier','Embedded system','Ability to transfer data over a network','A touchscreen'],a:3,e:'A Thing needs an identifier, an embedded system and network ability; no screen needed.'},
{q:'The correct order of the IoT lifecycle is…',o:['Analyze → Collect → Act → Communicate','Collect → Communicate → Analyze → Act','Act → Analyze → Collect → Communicate','Communicate → Collect → Act → Analyze'],a:1,e:'Collect, Communicate, Analyze, Act.'},
{q:'IoT is also sometimes called…',o:['Internet of Everything (IoE)','World Wide Web','Intranet','Extranet'],a:0,e:'Internet of Everything (IoE).'}
]},

{ id:'software', level:'Applied', title:'Applications, utilities & APIs', desc:'The software ecosystem and how programs talk',
html:`
${simple('Applications are the programs you use to get work done (Word, Chrome). Utilities are the programs that look after the computer itself (antivirus, disk cleanup). APIs are how programs talk to each other.')}
<div class="card"><b>Software ecosystem:</b> a collection of software products, tools and services that interact to fulfil user needs. It includes applications, utilities, operating systems and supporting frameworks, ensuring smooth interaction between users, hardware and software resources.</div>
<div class="grid">
<div class="card" style="margin:0"><h3>Applications</h3>Software programs designed to perform <b>specific user tasks</b>; they interact directly with users to solve real-world problems.<br><span class="muted">MS Word (documents), Chrome (browsing), Zoom (communication)</span></div>
<div class="card" style="margin:0"><h3>Utility programs</h3><b>System-support</b> software to manage, optimise and maintain computer performance; often runs in the background to improve efficiency and protect system integrity.<br><span class="muted">Antivirus, Disk Cleanup, file compression</span></div>
</div>
${table(['Types of applications','Examples'],[
['<b>System applications</b> — manage and control computer operations',''],['<b>Productivity</b> — help with daily tasks','MS Office, Google Docs'],['<b>Web applications</b> — run in a browser','Gmail, YouTube'],
['<b>Mobile applications</b> — for smartphones/tablets','WhatsApp, Instagram'],['<b>Enterprise applications</b> — organisational needs','ERP, CRM']])}
${table(['Types of utility programs','Examples'],[
['<b>File management</b> — manage files and storage','WinRAR, File Explorer'],['<b>Security</b> — protect against malware','Avast, Windows Defender, AVG Antivirus'],['<b>Disk management</b> — clean, format, defragment disks','CCleaner, Disk Cleanup'],
['<b>Backup</b> — securely store and recover data',''],['<b>System monitoring</b> — track CPU, RAM and performance','']])}
<div class="card"><b>Importance:</b> improve productivity and task automation · maintain system health and performance · easy access to computing resources · multitasking and better resource use · data protection through regular monitoring.<br>
<b>Role:</b> applications connect users to system resources; utilities improve performance, stability and reliability; together they create a balanced, efficient computing environment. <i>Example: a photo-editing app relies on file-management and memory utilities.</i></div>
${tryBox('Application or utility?', `<div id="auList"></div><p class="muted">Score: <b id="auScore">0</b></p>`)}
<h2>APIs — Application Programming Interfaces</h2>
<p>APIs are a <b>bridge</b> that lets applications, services and platforms interact and exchange data. <b>API development</b> = designing, building and implementing APIs so different software systems can exchange data and features in a standardised way; APIs act as intermediaries for developers.</p>
${tryBox('The 4 types of APIs', `<div class="tabs" id="apiTabs"></div><div id="apiBody"></div>`)}
<h3>API specifications</h3>
<p>Define the structure, behaviour and functionality of an API — a <b>blueprint</b> and a <b>contract</b> between provider and consumers.</p>
<ul><li><b>OpenAPI Specification (OAS)</b> — formerly <b>Swagger</b>; standard machine-readable description of RESTful APIs: endpoints, request/response models, authentication.</li>
<li><b>GraphQL Schema Definition Language (SDL)</b> — defines a GraphQL schema: types, fields, relationships and operations.</li></ul>
<h3>Why API documentation matters</h3>
<div class="grid">
${reveal('Onboarding & adoption','Step-by-step instructions, code samples and usage examples make the API quick to learn and adopt.')}
${reveal('Developer experience','Accurate, up-to-date info on authentication, request/response formats, error handling, rate limits.')}
${reveal('Troubleshooting & debugging','Explains common problems, error codes and solutions.')}
${reveal('Versioning & compatibility','Highlights breaking changes and how to migrate between versions.')}
</div>`,
init(){
 const items=[['MS Word','A'],['Antivirus','U'],['Google Chrome','A'],['WinRAR','U'],['Photoshop','A'],['CCleaner','U'],['WhatsApp','A'],['Disk Cleanup','U'],['MS Excel','A'],['Windows Defender','U'],['Zoom','A'],['Backup tool','U']];
 let score=0;
 $('#auList').innerHTML=shuffle(items).map(([n,t])=>`<div class="sortitem" data-t="${t}"><b>${n}</b><span class="row"><button class="btn ghost" data-v="A">Application</button><button class="btn ghost" data-v="U">Utility</button><span class="res"></span></span></div>`).join('');
 $$('#auList .sortitem').forEach(it=>$$('button',it).forEach(b=>b.onclick=()=>{const ok=b.dataset.v===it.dataset.t;if(ok)score++;$('.res',it).innerHTML=ok?'<b class="ok">✓</b>':`<b class="bad">✗ ${it.dataset.t==='A'?'Application':'Utility'}</b>`;$$('button',it).forEach(x=>x.disabled=true);$('#auScore').textContent=score+' / '+items.length}));
 const A={
  'REST':`<p><b>RESTful APIs</b> (Representational State Transfer): widely popular; follow a set of architectural principles and use <b>HTTP methods GET, POST, PUT, DELETE</b> on resources. Platform-independent; usable from any programming language.</p><pre class="mono card" style="white-space:pre-wrap">GET /students/42      → read student 42
POST /students        → create a student
PUT /students/42      → update student 42
DELETE /students/42   → delete student 42</pre>`,
  'SOAP':`<p><b>SOAP APIs</b> (Simple Object Access Protocol): a more structured, formalised approach. Use <b>XML</b> for data exchange and run over protocols like <b>HTTP, SMTP or TCP</b>.</p><pre class="mono card" style="white-space:pre-wrap">&lt;soap:Envelope&gt;
  &lt;soap:Body&gt;&lt;GetStudent&gt;&lt;Id&gt;42&lt;/Id&gt;&lt;/GetStudent&gt;&lt;/soap:Body&gt;
&lt;/soap:Envelope&gt;</pre>`,
  'GraphQL':`<p><b>GraphQL</b>: a flexible <b>query language</b> for APIs. The client asks for <b>exactly the data it needs</b>, avoiding over-fetching or under-fetching.</p><pre class="mono card" style="white-space:pre-wrap">{ student(id: 42) { name  marks } }   ← only name and marks come back</pre>`,
  'WebSocket':`<p><b>WebSocket APIs</b>: <b>real-time, bidirectional</b> communication over a <b>persistent connection</b>, so data arrives instantly. Good for chat apps, real-time collaboration tools and financial platforms.</p><pre class="mono card" style="white-space:pre-wrap">client ⇄ server   (connection stays open; either side can send anytime)</pre>`};
 const tabs=$('#apiTabs'), body=$('#apiBody');
 Object.keys(A).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{$$('button',tabs).forEach(x=>x.classList.remove('on'));b.classList.add('on');body.innerHTML=A[k]};tabs.appendChild(b);if(!i)b.click()});
},
keys:['Software ecosystem = applications + utilities + OS + frameworks working together.','Applications do user tasks (system, productivity, web, mobile, enterprise). Utilities maintain the system (file, security, disk, backup, monitoring).','API = bridge for apps to exchange data. Types: REST (HTTP GET/POST/PUT/DELETE), SOAP (XML), GraphQL (ask for exactly what you need), WebSocket (real-time, two-way).','Specs: OpenAPI (formerly Swagger) for REST; GraphQL SDL. Docs help onboarding, developer experience, troubleshooting, versioning.'],
quiz:[
{q:'WinRAR is an example of a…',o:['Productivity application','File-management utility','Web application','Enterprise application'],a:1,e:'WinRAR manages/compresses files — a utility.'},
{q:'ERP and CRM are…',o:['Mobile applications','Enterprise applications','Security utilities','Web browsers'],a:1,e:'They support organisational needs.'},
{q:'Which API type uses XML and can run over SMTP?',o:['REST','SOAP','GraphQL','WebSocket'],a:1,e:'SOAP uses XML over HTTP, SMTP or TCP.'},
{q:'Which API type lets the client request exactly the fields it needs?',o:['GraphQL','SOAP','REST','FTP'],a:0,e:'GraphQL avoids over- and under-fetching.'},
{q:'A live chat app would best use…',o:['WebSocket APIs','SOAP APIs','FTP','Batch files'],a:0,e:'WebSocket = persistent, real-time, two-way.'},
{q:'The OpenAPI Specification was formerly known as…',o:['Swagger','SDL','SOAP','JSON'],a:0,e:'OAS was formerly Swagger.'}
]},

/* ---------- 12 ---------- */
{ id:'sdlc', level:'Applied', title:'SDLC & open-source vs proprietary', desc:'How software is built, and who owns it',
html:`
${simple('Building software is like building a house: first decide what is needed, draw the plan, build it, inspect it, hand over the keys, then keep repairing it. That sequence is the SDLC.')}
<div class="card"><b>Software Development Life Cycle (SDLC):</b> a conceptual model used in software project management that includes the stages involved in making software — a framework defining the activities performed at each stage of a software project.</div>
<h3>Why it matters</h3>
<ul><li>The success or failure of any software product can be traced back to the SDLC used.</li><li>Guides development to make it systematic and efficient.</li><li>Helps figure out the requirements for the problem.</li><li>Improves estimates of budget and other resources.</li><li>Gives testing and maintenance their own stages, so enough time is spent on them.</li></ul>
${tryBox('The 6 phases — click through', `<div class="steps" id="sdlcSteps"></div><div class="stepbody" id="sdlcBody"></div>`)}
<h2>SDLC models</h2>
${table(['Model','How it works','Good for / drawbacks'],[
['<b>Waterfall</b>','Phases run strictly one after another; a phase starts only when the previous ends.','Simple, easy to manage; hard to go back for changes. Small projects with fixed, clear requirements.'],
['<b>Iterative</b>','Build a simple version from part of the requirements, then repeat the cycle, adding/improving features each iteration.','Working software early, handles change; needs more resources and management.'],
['<b>Spiral</b>','Iterative + risk analysis. Each loop: planning → risk analysis → engineering (build & test) → evaluation.','Large, complex, high-risk projects; costly.'],
['<b>V-Model</b>','Verification & Validation; extension of Waterfall. Each phase has a matching test: requirements ↔ acceptance, design ↔ system/integration, coding ↔ unit testing.','Catches defects early; rigid like Waterfall.'],
['<b>Agile</b>','Small increments in short sprints (1–4 weeks) with continuous customer feedback and teamwork (Scrum, Kanban).','Very flexible and fast; needs active customer involvement, harder to estimate.']])}
${tryBox('See each model in action', `<div class="tabs" id="mdTabs"></div><div class="svgbox"><svg id="mdSvg" viewBox="0 0 640 300" role="img" aria-label="SDLC model diagram"></svg></div><div id="mdInfo" class="stepbody"></div>`)}
${tryBox('Pick the best model', `<div id="mpQ" class="stepbody"></div><div class="row" id="mpBtns" style="margin-top:8px"></div><p id="mpMsg"></p><button class="btn ghost" id="mpNext">Next scenario</button>`)}
<h2>Open-source vs proprietary software</h2>
<p>The two dominant models in the software ecosystem. They differ in <b>access, control, cost and collaboration</b>; understanding both helps in making development and business decisions.</p>
<div class="grid">
<button class="flip" onclick="this.classList.toggle('on')"><div class="in"><div class="f">Open-Source Software (OSS)<span class="muted" style="font-weight:400;font-size:12px">tap to flip</span></div><div class="b">Source code freely available to use, modify and distribute.<br><br><b>e.g.</b> Linux, Android, Mozilla Firefox, TensorFlow</div></div></button>
<button class="flip" onclick="this.classList.toggle('on')"><div class="in"><div class="f">Proprietary software<span class="muted" style="font-weight:400;font-size:12px">tap to flip</span></div><div class="b">Closed-source, owned by a company or individual, with restricted licensing.<br><br><b>e.g.</b> Microsoft Windows, macOS, Oracle Database, Adobe Photoshop</div></div></button>
</div>
${table(['','Open-source','Proprietary'],[
['<b>Advantages</b>','Cost-effective and flexible · innovation through collaboration · transparent and secure thanks to open code review','Professional technical support · stable performance with quality control · seamless integration with other commercial tools'],
['<b>Challenges</b>','Limited official support · fragmentation risk · compatibility with proprietary tools','High cost and vendor lock-in · less customisation flexibility · slower innovation cycle']])}
<div class="card"><b>Emerging trends:</b> hybrid models (e.g. Red Hat Enterprise Linux) · open-source adoption in AI, cloud and cybersecurity · collaboration between open and closed systems.<br>
<b>Conclusion:</b> both play vital roles; the best choice depends on cost, scalability and control requirements; the future points to a balanced hybrid approach.</div>`,

function packetJourney(root){
 const L=[
  {n:'Application',c:'var(--c1)',h:'AH',hd:'Application header',add:'Adds an <b>HTTP request header</b> (“GET /index.html”) so the server knows what you want.',strip:'Reads the HTTP request and hands the message to the <b>web-server program</b>.'},

  {n:'Session',c:'var(--c5)',h:'SH',hd:'Session header',add:'Adds a <b>session ID and sync checkpoint</b> so the conversation can be managed (and resumed if interrupted).',strip:'Matches the session ID to the open conversation (dialogue control).'},
  {n:'Transport',c:'var(--c2)',h:'TCP',hd:'TCP header',add:'Adds a <b>TCP header</b>: source port 49152 → destination <b>port 80</b>, plus a <b>sequence number</b>. Large data is split into <b>segments</b>.',strip:'Checks sequence numbers, <b>reassembles</b> segments in order, sends an acknowledgement and delivers to <b>port 80</b>.'},
  {n:'Network',c:'var(--c6)',h:'IP',hd:'IP header',add:'Adds an <b>IP header</b>: source <b>192.168.1.10</b> → destination <b>142.250.1.1</b>. Routers use this logical address to find a path.',strip:'Confirms the destination IP is its own, then removes the IP header.'},
  {n:'Data Link',c:'var(--c7)',h:'MAC',hd:'MAC header + FCS trailer',add:'Adds a <b>MAC header</b> (source & destination hardware addresses) in front and an <b>FCS trailer</b> (error check) at the end: a <b>frame</b>.',strip:'Checks the <b>FCS</b> for errors and that the MAC address is its own, then removes header and trailer.'},
  {n:'Physical',c:'var(--c3)',h:null,hd:'',add:'Turns the whole frame into <b>bits (0s and 1s)</b> and sends them as electrical, light or radio <b>signals</b>.',strip:'Receives the signals and turns the bits back into a <b>frame</b>.'}];

 function segsFor(st){

  segs.forEach(sg=>{const cls=sg.fresh?'seg-new':sg.strip?'seg-strip':'';
   inner+=sg.data?`<g class="${cls}"><rect x="${x}" y="0" width="${sg.w}" height="34" rx="5" fill="var(--panel)" stroke="var(--text)" stroke-width="1.5"/><text x="${x+sg.w/2}" y="22" text-anchor="middle" font-size="12" class="mono">${esc(sg.t)}</text></g>`
     :`<g class="${cls}"><rect x="${x}" y="0" width="${sg.w-2}" height="34" rx="5" fill="${sg.c}"/><text x="${x+(sg.w-2)/2}" y="22" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">${sg.t}</text></g>`;
   x+=sg.w});

  pkt.innerHTML=inner;

   requestAnimationFrame(()=>{bits.style.transition='';bits.style.transform=`translate(${RX+W/2-70}px,452px)`})}

function stepper(stepsSel, bodySel, steps){
 const box=$(stepsSel), body=$(bodySel);
 box.innerHTML=steps.map((s,i)=>`<button data-i="${i}">${s[0]}</button>`).join('')+`<button data-next="1" title="next">Next ▶</button>`;
 let cur=0;
 const go=i=>{cur=i;$$('button[data-i]',box).forEach(b=>{const k=+b.dataset.i;b.className=k===i?'on':k<i?'past':''});body.innerHTML=steps[i][1]};
 $$('button[data-i]',box).forEach(b=>b.onclick=()=>go(+b.dataset.i));
 $('button[data-next]',box).onclick=()=>go((cur+1)%steps.length);
 go(0);
}
function ipToStr(n){return [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.')}
function ipInfo(ipS, pfS){
 const parts=ipS.trim().split('.');
 if(parts.length!==4||parts.some(p=>!/^\d{1,3}$/.test(p)||+p>255)) return {err:'Enter a valid IPv4 address: four numbers 0–255 separated by dots.'};
 const o=parts.map(Number), ip=((o[0]<<24)|(o[1]<<16)|(o[2]<<8)|o[3])>>>0;
 const a=o[0];
 let clsLetter = a<128?'A':a<192?'B':a<224?'C':a<240?'D':'E';
 const defP={A:8,B:16,C:24}[clsLetter];
 let p; pfS=String(pfS).trim().replace(/^\//,'');
 if(pfS==='') p=defP??24;
 else if(/^\d{1,2}$/.test(pfS)&&+pfS<=32) p=+pfS;
 else if(/^\d+\.\d+\.\d+\.\d+$/.test(pfS)){const m=pfS.split('.').map(Number);if(m.some(x=>x>255))return{err:'Invalid mask.'};const mi=((m[0]<<24)|(m[1]<<16)|(m[2]<<8)|m[3])>>>0;const bin=mi.toString(2).padStart(32,'0');if(!/^1*0*$/.test(bin))return{err:'A subnet mask must be 1s followed by 0s (e.g. 255.255.255.0).'};p=bin.indexOf('0');if(p<0)p=32}
 else return {err:'Prefix must be 0–32 or a mask like 255.255.255.0.'};
 const mask=p===0?0:(0xFFFFFFFF<<(32-p))>>>0, net=(ip&mask)>>>0, bc=(net|(~mask>>>0))>>>0, hostPart=(ip&~mask)>>>0;
 const hosts=p>=32?1:p===31?2:Math.pow(2,32-p)-2;
 const bin=ip.toString(2).padStart(32,'0');
 let bitsHtml='';for(let i=0;i<32;i++){bitsHtml+=`<span class="${i<p?'n':'h'}">${bin[i]}</span>`;if(i%8===7&&i<31)bitsHtml+='.'}
 let typeShort, why;
 if(a===127){typeShort='Loopback';why='127.x.x.x is the loopback range (127.0.0.1 = localhost).'}
 else if(a===169&&o[1]===254){typeShort='APIPA';why='169.254.x.x is self-assigned when no DHCP server answers.'}
 else if(a===10||(a===172&&o[1]>=16&&o[1]<=31)||(a===192&&o[1]===168)){typeShort='Private';why='It falls in an RFC 1918 private range (10/8, 172.16/12, 192.168/16).'}
 else if(clsLetter==='D'){typeShort='Multicast';why='224–239 is Class D, used for multicast.'}
 else if(clsLetter==='E'){typeShort='Reserved';why='240–255 is Class E, reserved for experimental use.'}
 else if(a===0){typeShort='Reserved';why='0.x.x.x is reserved.'}
 else {typeShort='Public';why='It is not in any private or special range, so it is a public address.'}
 const clsTxt = a===127?'A range, but reserved for loopback':a===0?'Reserved (0.x.x.x)':`Class ${clsLetter} (first octet ${a})`;
 return {ipStr:ipToStr(ip),p,mask:ipToStr(mask),net:ipToStr(net),bc:ipToStr(bc),host:ipToStr(hostPart),hosts:hosts.toLocaleString(),
  range:p>=31?'—':`${ipToStr(net+1)} – ${ipToStr(bc-1)}`,bitsHtml,cls:clsTxt,clsLetter,type:typeShort,typeShort,why};
}

const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let revealObs=null, ioFired=false, revealTimer=null;
function revealEl(el){if(!el.classList.contains('rv')||el.classList.contains('in'))return;el.classList.add('in');el.addEventListener('animationend',ev=>{if(ev.target===el)el.classList.remove('rv','in')})}
function animatePage(){
 if(REDUCED) return;
 main.classList.remove('anim'); void main.offsetWidth; main.classList.add('anim');
 if(revealObs) revealObs.disconnect();
 clearTimeout(revealTimer); ioFired=false;
 const els=[];
 ['.lessongrid>button','.palgrid>button','.grid>*'].forEach(sel=>$$(sel,main).forEach((el,i)=>{el.classList.add('rv');el.style.setProperty('--d',(Math.min(i,10)*0.05)+'s');els.push(el)}));
 $$('main>h2, .lesson-body>h2, .lesson-body>h3, .lesson-body>.card, .lesson-body>.simple, .lesson-body>.tblwrap, .lesson-body>.svgbox, .lesson-body>ul, .lesson-body>p, .keys, .pager',main)
   .forEach(el=>{if(!el.classList.contains('rv')){el.classList.add('rv');els.push(el)}});
 // anything already on screen animates immediately; the rest waits until scrolled into view
 els.forEach(el=>{const b=el.getBoundingClientRect();if(b.top<innerHeight&&b.bottom>0)revealEl(el)});
 if('IntersectionObserver' in window){
  revealObs=new IntersectionObserver(es=>{ioFired=true;es.forEach(e=>{if(e.isIntersecting){revealObs.unobserve(e.target);revealEl(e.target)}})},{threshold:.08,rootMargin:'0px 0px -30px 0px'});
  els.forEach(el=>{if(!el.classList.contains('in'))revealObs.observe(el)});
 }
 // safety net: if the observer never reports (old browser, print, background tab), show everything
 revealTimer=setTimeout(()=>{if(!ioFired||!('IntersectionObserver' in window))$$('.rv',main).forEach(revealEl)},2500);
}
function confetti(){
 if(REDUCED||document.body.classList.contains('lite')) return;
 const c=$('#confetti'), x=c.getContext('2d'), W=c.width=innerWidth, H=c.height=innerHeight;
 const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#888';
 const cols=[acc,'#f4b400','#e8505b','#36b37e','#4c9aff','#b06ab3'];
 const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
 const t0=performance.now();
 (function f(t){x.clearRect(0,0,W,H);const k=(t-t0)/2200;
  P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-k);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  k<1?requestAnimationFrame(f):x.clearRect(0,0,W,H)})(t0);
}

let animObs=null;
function watchAnimated(){

  const el=e.target, on=e.isIntersecting&&!document.hidden;
  el.classList.toggle('offscreen',!on);
  $$('svg',el).concat(el.tagName==='svg'?[el]:[]).forEach(sv=>{try{on?sv.unpauseAnimations():sv.pauseAnimations()}catch(_){}});
 }),{rootMargin:'100px'});
 $$('.svgbox,.hero2,.pj',main).forEach(el=>animObs.observe(el));
}
document.addEventListener('visibilitychange',()=>{$$('svg').forEach(sv=>{try{document.hidden?sv.pauseAnimations():sv.unpauseAnimations()}catch(_){}})});

/* ===================== quiz rendering ===================== */
function renderQuiz(container, qs, onDone){
 const LET='ABCDEFG';
 container.innerHTML=`<div class="qhead"><span class="qcount">0 / ${qs.length} answered</span><div class="qdots">${qs.map((_,i)=>`<button class="qdot" data-i="${i}" aria-label="Go to question ${i+1}"></button>`).join('')}</div></div>`+
  qs.map((q,i)=>`<div class="qitem" data-i="${i}"><div class="qtext"><span class="qn">Q${i+1}</span><span>${q.q}</span></div>${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="letter">${LET[j]}</span><span class="otext">${o}</span></button>`).join('')}<div class="explain">${q.e}${q.from?` <a href="#${q.from}">→ review lesson</a>`:''}</div></div>`).join('')+'<div class="qres"></div>';
 let answered=0, right=0;
 $$('.qdot',container).forEach(d=>d.onclick=()=>$(`.qitem[data-i="${d.dataset.i}"]`,container).scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'}));
 $$('.qitem',container).forEach(item=>{const i=+item.dataset.i, q=qs[i];
  $$('.opt',item).forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j, ok=j===q.a;
   item.classList.add('answered',ok?'got':'missed');
   $$('.opt',item).forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a){x.classList.add('right');$('.letter',x).textContent='✓'}});
   if(!ok){b.classList.add('wrong');$('.letter',b).textContent='✗'} else right++;
   answered++;
   window.studyBuddy&&studyBuddy.answer(ok,q);
   $(`.qdot[data-i="${i}"]`,container).classList.add(ok?'ok':'no');
   $('.qcount',container).textContent=`${answered} / ${qs.length} answered · ${right} correct`;
   if(answered===qs.length) showScore();
  })});
 function showScore(){
  const pct=Math.round(right/qs.length*100), pass=pct>=75, C=2*Math.PI*50, res=$('.qres',container);
  if(pass) setTimeout(confetti,150);
  res.innerHTML=`<div class="qscore ${pass?'pass':'fail'}"><div class="sring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="50"/><circle class="fg" cx="60" cy="60" r="50" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="sv"><b>0%</b><span>${right} / ${qs.length}</span></div></div>
   <div class="stext"><h3>${pass?(pct===100?'Perfect score!':'Passed!'):'Keep going'}</h3><p>Score: ${right}/${qs.length} (${pct}%). ${pass?'Nice work, this counts towards your progress.':'You need 75% to pass. Read the explanations above, then try again.'}</p><button class="btn ${pass?'ghost':''}">${ic('reset')} Retry</button></div></div>`;
  $('button',res).onclick=()=>renderQuiz(container,onDone.reshuffle?onDone.reshuffle():qs,onDone);
  const fg=$('.fg',res), num=$('.sv b',res);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fg.style.strokeDashoffset=C*(1-pct/100)}));
  if(REDUCED) num.textContent=pct+'%';
  else{const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1200),e=1-Math.pow(1-k,3);num.textContent=Math.round(pct*e)+'%';if(k<1)requestAnimationFrame(f)})(t0)}
  window.studyBuddy&&studyBuddy.score(pct,pass);
  onDone(right,qs.length);
 }
}

function home(){

 const target=last&&!(progress[last.id]>=75)?last:nextL, ti=LESSONS.indexOf(target);
 const C=2*Math.PI*62, h=new Date().getHours(), cafeOn=!!store.get('ce-cafe-night',false);
 const greet=h<5?'Late-night study':h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'Late-night study';

const IQ=[
{unit:'Unit 3 · Networks', qs:[
{q:'Give the difference between guided and unguided transmission media. Describe the CAN and WAN network types and give the difference with appropriate explanation.', see:['media','sizes'], a:`
<p><b>Guided media</b> carry signals along a physical path (a cable). <b>Unguided media</b> send signals through air or space as electromagnetic waves, with no physical conductor.</p>
${table(['Point','Guided (wired)','Unguided (wireless)'],[
['Path','Physical cable','Air / free space'],
['Examples','Twisted pair, coaxial cable, optical fibre','Radio waves, microwaves, infrared, satellite'],
['Speed & reliability','Higher, more stable','Lower, affected by weather and obstacles'],
['Interference','Low (fibre has almost none)','High'],
['Security','More secure: needs physical access','Less secure: signals can be intercepted'],
['Mobility','Fixed','Devices can move'],
['Cost of setup','Cabling cost over distance','Cheaper to cover large or hard areas']])}
<p><b>CAN (Campus Area Network):</b> connects several LANs inside a limited area such as a university, hospital or office campus, usually owned by one organisation. Range is roughly 1–5 km, using fibre between buildings and Ethernet/Wi-Fi inside them.</p>
<p><b>WAN (Wide Area Network):</b> covers a very large area — cities, countries or the whole world. It links LANs and MANs using leased lines, telephone networks, fibre backbones and satellites, often owned by several providers. The Internet is the largest WAN.</p>
${table(['Point','CAN','WAN'],[
['Area','A campus (1–5 km)','Country / world'],
['Ownership','Single organisation','Many providers / public'],
['Speed','High','Lower, more delay'],
['Cost','Moderate','Very high'],
['Errors & congestion','Few','More'],
['Example','College network joining library, labs, hostels','The Internet, a bank’s nationwide branch network']])}`},

{q:'Explain the core functionalities of web browsers in the context of the World Wide Web.', see:['www'], a:`
<p>A <b>web browser</b> is application software that fetches, interprets and displays resources from the WWW (Chrome, Firefox, Edge, Safari). Its core functions:</p>
<ol>
<li><b>Accepting the URL:</b> the user types a URL or clicks a hyperlink; the browser breaks it into protocol, domain and path.</li>
<li><b>DNS lookup:</b> it converts the domain name (e.g. google.com) into an IP address.</li>
<li><b>Sending requests:</b> it opens a connection and sends an HTTP/HTTPS request to the web server.</li>
<li><b>Receiving and rendering:</b> the rendering engine reads HTML (structure), CSS (style) and runs JavaScript (behaviour) to draw the page.</li>
<li><b>Hyperlink navigation:</b> links let users jump between pages — the “web” of the WWW.</li>
<li><b>Security:</b> HTTPS/SSL padlock, certificate checking, phishing and malware warnings, sandboxing.</li>
<li><b>Storage:</b> cache (faster reloads), cookies (sessions, logins), history and bookmarks.</li>
<li><b>Extra features:</b> tabs, downloads, private/incognito mode, extensions/plug-ins, search bar.</li>
</ol>
<p><b>Flow:</b> URL → DNS → HTTP request → server response → render page → user clicks link → repeat.</p>`},

{q:'Give the explanation of how data traverses in a communication network with the help of the OSI model. Explain all the layers.', see:['osi'], note:'The end of this question was cut off in the photo; the answer covers all seven layers.', a:`
<p>The <b>OSI (Open Systems Interconnection) model</b>, made by ISO, divides communication into <b>7 layers</b>. On the sender, data moves <b>down</b> from layer 7 to layer 1 and each layer adds its own header (<b>encapsulation</b>). It travels as bits over the medium, then moves <b>up</b> layers 1 to 7 at the receiver, where each layer removes its header (<b>decapsulation</b>).</p>
${table(['#','Layer','Job','Data unit / example'],[
['7','Application','Interface for user programs; network services','Data · HTTP, FTP, SMTP, DNS'],
['6','Presentation','Translation, encryption, compression','Data · JPEG, SSL/TLS, ASCII'],
['5','Session','Opens, manages and closes sessions; checkpoints','Data · NetBIOS, RPC'],
['4','Transport','End-to-end delivery, segmentation, error and flow control, port numbers','Segment · TCP, UDP'],
['3','Network','Logical (IP) addressing and routing between networks','Packet · IP, ICMP · router'],
['2','Data Link','Framing, MAC addressing, error detection on one link','Frame · Ethernet · switch'],
['1','Physical','Sends raw bits as electrical, light or radio signals','Bits · cables, hub']])}
<p><b>Example — sending an email:</b> the mail app creates the message (7), it is encoded/encrypted (6), a session with the server is opened (5), TCP splits it into numbered segments (4), IP adds source and destination addresses and routers choose a path (3), each hop wraps it in a frame with MAC addresses (2), and it travels as signals (1). The receiver reverses the steps and the message appears in the inbox.</p>
<p><b>Memory aid (7→1):</b> “All People Seem To Need Data Processing.”</p>`},

{q:'Demonstrate and explain how the TCP/IP model facilitates communication between systems.', see:['tcpip'], a:`
<p><b>TCP/IP</b> is the practical protocol suite on which the Internet runs. It has <b>4 layers</b> and lets different devices, operating systems and networks talk using common rules.</p>
${table(['Layer','Job','Protocols'],[
['Application','Services the user’s program needs','HTTP/HTTPS, FTP, SMTP, DNS, Telnet'],
['Transport','Process-to-process delivery, reliability','TCP (reliable, connection-oriented), UDP (fast, connectionless)'],
['Internet','Addressing and routing packets across networks','IP, ICMP, ARP'],
['Network access (Link)','Sending frames on the physical network','Ethernet, Wi-Fi']])}
<p><b>Demonstration — opening a website:</b></p>
<ol>
<li>The browser creates an HTTP request (Application).</li>
<li>TCP does a <b>3-way handshake</b> (SYN → SYN-ACK → ACK), splits data into segments, numbers them and adds port numbers (Transport).</li>
<li>IP adds source and destination IP addresses; routers forward the packets hop by hop (Internet).</li>
<li>Ethernet/Wi-Fi turns packets into frames and signals (Network access).</li>
<li>At the server the layers are removed in reverse; TCP acknowledges segments, resends lost ones and reorders them; the reply returns the same way.</li>
</ol>
<p>It works because of standard addressing (IP), reliable delivery (TCP), and independence from hardware — any device that follows the rules can communicate.</p>`},

{q:'Explain how bandwidth affects network or communication performance.', see:['network'], a:`
<p><b>Bandwidth</b> is the maximum amount of data a channel can carry per second, measured in bps (Kbps, Mbps, Gbps). It is the width of the “pipe”.</p>
<ul>
<li><b>Speed:</b> more bandwidth means files, pages and updates transfer faster. Time ≈ size ÷ bandwidth (100 MB on 10 Mbps ≈ 80 s; on 100 Mbps ≈ 8 s).</li>
<li><b>Throughput:</b> the real data rate achieved can never exceed bandwidth.</li>
<li><b>Congestion:</b> when many users share low bandwidth, queues form, causing delay (latency) and packet loss.</li>
<li><b>Number of users:</b> higher bandwidth supports more simultaneous users and devices.</li>
<li><b>Applications:</b> video calls, streaming, cloud and online gaming need high bandwidth; low bandwidth causes buffering, lag and poor quality.</li>
</ul>
<p><b>Note:</b> bandwidth is not the only factor — latency, jitter and errors also affect performance. A high-bandwidth satellite link can still feel slow because of high latency.</p>`},

{q:'Give the difference between the OSI and TCP/IP model with respect to their work, performance and example.', see:['osi','tcpip'], a:`
${table(['Point','OSI model','TCP/IP model'],[
['Developed by','ISO (1984)','US Department of Defense (ARPANET)'],
['Layers','7','4'],
['Nature','Theoretical / reference model','Practical, implemented model'],
['Approach','Model first, protocols later','Protocols first, model described after'],
['Session & Presentation','Separate layers','Merged into Application layer'],
['Transport','Connection-oriented only','Both TCP (connection-oriented) and UDP (connectionless)'],
['Performance','More layers = more overhead; used for teaching and troubleshooting','Fewer layers, less overhead, faster and more efficient in real networks'],
['Reliability','Strict layer boundaries','Flexible, robust; adapts to many networks'],
['Usage','Not used directly on the Internet','Basis of the Internet'],
['Example','Explaining where a fault is: “cable fault = layer 1, IP issue = layer 3”','Browsing a website using HTTP over TCP over IP']])}
<p><b>Conclusion:</b> OSI is a guide to understand networking; TCP/IP is what actually carries data today.</p>`},

{q:'Explain how bandwidth influences the quality of service.', see:['network'], a:`
<p><b>Quality of Service (QoS)</b> is how well a network delivers traffic, measured by bandwidth, latency (delay), jitter (variation in delay) and packet loss. It also means the techniques used to prioritise important traffic.</p>
<ul>
<li><b>Video and audio quality:</b> enough bandwidth gives HD video and clear voice; too little forces lower resolution, buffering and robotic audio.</li>
<li><b>Delay and jitter:</b> when bandwidth is used up, packets queue, raising latency and jitter — bad for VoIP, video calls and gaming.</li>
<li><b>Packet loss:</b> full buffers drop packets, causing retransmissions (TCP) or gaps (UDP streams).</li>
<li><b>Fair sharing:</b> limited bandwidth must be divided, so one heavy download can harm everyone else.</li>
<li><b>QoS techniques:</b> traffic prioritisation, bandwidth reservation and traffic shaping give critical apps (voice, video meetings) guaranteed bandwidth.</li>
</ul>
<p><b>Rough needs:</b> voice call ≈ 0.1 Mbps, HD video ≈ 5 Mbps, 4K video ≈ 25 Mbps per stream.</p>`},

{q:'How are the different topologies suitable for a large organisation?', see:['topology'], a:`
${table(['Topology','Fit for a large organisation','Why'],[
['Bus','Poor','One cable failure stops all; slows with many devices'],
['Ring','Poor','One node or link failure can break the ring; adding nodes disturbs it'],
['Star','Good for each floor/department','Easy to add devices and isolate faults; but the central switch is a single point of failure'],
['Tree (hierarchical)','Very good','Stars connected in levels (core → distribution → access); easy to expand and manage department by department'],
['Mesh','Good for the core/backbone','Multiple paths give redundancy and fault tolerance; too costly to use everywhere'],
['Hybrid','Best overall','Combines tree/star for users with partial mesh for core links — scalable, reliable, cost-balanced']])}
<p><b>Conclusion:</b> a large organisation usually uses a <b>hybrid</b> design: star at each floor, tree to join floors and buildings, and a partial mesh between core switches and data centres so one failure does not cut the network.</p>`},

{q:'Design a networking solution for an organisation or university campus by selecting appropriate topology, transmission media, communication protocol and internet services.', see:['topology','media','tcpip'], a:`
<p><b>Scenario:</b> a university with an admin block, academic blocks, library, labs and hostels, about 3,000 users.</p>
<ol>
<li><b>Network type:</b> a CAN (campus area network) made of a LAN in each building, joined by a backbone.</li>
<li><b>Topology:</b> hybrid — <b>star</b> on each floor (PCs to an access switch), <b>tree</b> linking floor switches to a building switch, and a <b>partial mesh</b> between core switches in the data centre for redundancy.</li>
<li><b>Transmission media:</b> <b>optical fibre</b> between buildings (long distance, high speed, no interference); <b>Cat 6 twisted pair</b> from switches to desks and labs; <b>Wi-Fi 6 access points</b> in classrooms, library and hostels for mobile devices.</li>
<li><b>Protocols:</b> TCP/IP suite; Ethernet and Wi-Fi at the link layer; DHCP for automatic IPs; DNS for names; HTTP/HTTPS for web; SMTP/IMAP for email; FTP/SFTP for files; VLANs to separate students, staff, admin and guests; private IPv4 addresses with NAT.</li>
<li><b>Internet services:</b> leased lines from two ISPs (backup link) through a router and firewall; campus email, ERP and student portal, Learning Management System, cloud storage, video conferencing, library e-resources, VPN for remote staff.</li>
<li><b>Security:</b> firewall and content filtering, antivirus, WPA3/802.1X login for Wi-Fi, regular backups, CCTV over IP.</li>
</ol>
<p><b>Why it works:</b> fast fibre backbone, easy expansion with star/tree, no single point of failure in the core, separate traffic using VLANs, and reliable internet with two ISPs.</p>`}
]},
{unit:'Unit 4 · Software & development', qs:[
{q:'Define the software ecosystem and explain the role of utility software in the software environment.', see:['software'], a:`
<p>A <b>software ecosystem</b> is the whole set of software, platforms, developers, users, vendors and services that work together and depend on each other — for example the Android ecosystem (OS, Play Store, apps, developers, APIs, users).</p>
<p><b>Components:</b> system software (OS, drivers), application software, utility software, programming tools, APIs, platforms/app stores, and people (developers, users, vendors).</p>
<p><b>Utility software</b> is system software that maintains, optimises and protects the computer. Its role:</p>
<ul>
<li><b>Security:</b> antivirus, firewall, anti-spyware protect data.</li>
<li><b>Disk management:</b> disk cleanup, defragmenter, formatting, partitioning keep storage fast and organised.</li>
<li><b>Backup and recovery:</b> copy data and restore it after loss.</li>
<li><b>File compression:</b> WinRAR, 7-Zip reduce file size for storage and sharing.</li>
<li><b>System monitoring:</b> Task Manager checks CPU, memory and processes.</li>
<li><b>Performance:</b> remove junk files and manage startup programs so applications run smoothly.</li>
</ul>
<p>In short, utilities sit between the OS and applications and keep the environment healthy, secure and efficient.</p>`},

{q:'Define Git and GitHub, and explain repository management.', see:['sdlc'], a:`
<p><b>Git</b> is a free, open-source <b>distributed version control system</b> (created by Linus Torvalds, 2005). It tracks every change to files, lets you return to old versions, and every developer has a full copy of the project history on their own machine.</p>
<p><b>GitHub</b> is a <b>cloud-based hosting platform</b> for Git repositories. It adds collaboration features: pull requests, code review, issues, wikis, GitHub Actions (CI/CD) and project boards.</p>
<p><b>Git vs GitHub:</b> Git is the tool (works offline, on your computer); GitHub is the online service that stores and shares Git repositories.</p>
<p><b>Repository management</b> means organising and controlling a repository (the project folder plus its full history):</p>
<ul>
<li><b>Create / clone:</b> <code>git init</code> or <code>git clone &lt;url&gt;</code>.</li>
<li><b>Track changes:</b> <code>git add</code> → <code>git commit -m "message"</code> with clear messages.</li>
<li><b>Branching:</b> work on features in separate branches, then merge (<code>git branch</code>, <code>git merge</code>).</li>
<li><b>Sync:</b> <code>git push</code> and <code>git pull</code> with the remote repository.</li>
<li><b>Collaboration:</b> pull requests, reviews, resolving merge conflicts.</li>
<li><b>Access control:</b> public/private repos, collaborators, branch protection.</li>
<li><b>Housekeeping:</b> README, .gitignore, licence, tags/releases for versions.</li>
</ul>`},

{q:'Describe generative AI and explain the conceptual view of generative AI.', see:['aiapps','genmodels'], a:`
<p><b>Generative AI</b> is a type of artificial intelligence that <b>creates new content</b> — text, images, audio, video or code — by learning patterns from large amounts of training data. Examples: ChatGPT and Claude (text), DALL·E and Midjourney (images), GitHub Copilot (code).</p>
<p><b>Conceptual view (how it works):</b></p>
<ol>
<li><b>Data:</b> huge datasets of text, images, code are collected.</li>
<li><b>Training:</b> a deep neural network learns the patterns and probability of what comes next (e.g. which word follows which).</li>
<li><b>Model:</b> the learned knowledge is stored as parameters — models include <b>transformers</b> (LLMs), <b>GANs</b> (generator vs discriminator), VAEs and diffusion models.</li>
<li><b>Prompt (input):</b> the user gives an instruction.</li>
<li><b>Generation (output):</b> the model produces new content that matches the prompt.</li>
<li><b>Feedback & refinement:</b> fine-tuning and human feedback improve quality and safety.</li>
</ol>
<p><b>Flow:</b> Data → Training → Model → Prompt → Generated output → Feedback.</p>
<p><b>Uses:</b> writing, chatbots, design, coding, music, education. <b>Limits:</b> can be wrong (hallucination), biased, raises copyright and deepfake concerns.</p>`},

{q:'Describe how version control facilitates collaboration in software development.', see:['sdlc'], a:`
<p><b>Version control</b> is a system that records changes to files over time so that many people can work on the same project safely (e.g. Git, SVN).</p>
<ul>
<li><b>Parallel work:</b> each developer works on their own branch without disturbing others.</li>
<li><b>Merging:</b> changes are combined into the main code; conflicts are detected and resolved.</li>
<li><b>History & accountability:</b> every commit shows who changed what, when and why.</li>
<li><b>Rollback:</b> a bad change can be undone by returning to an earlier version.</li>
<li><b>Code review:</b> pull requests let teammates review and discuss code before it is merged.</li>
<li><b>Single source of truth:</b> a shared remote repository (GitHub, GitLab) keeps everyone in sync.</li>
<li><b>Remote teamwork:</b> developers in different places collaborate through push and pull.</li>
<li><b>Automation:</b> CI/CD tests and deploys code automatically on each commit.</li>
</ul>
<p><b>Example:</b> developer A adds login on branch <code>login</code> while B fixes a bug on <code>bugfix</code>; both open pull requests, they are reviewed and merged into <code>main</code> without overwriting each other’s work.</p>`},

{q:'Give the steps to illustrate the process of creating a GitHub repository.', see:['sdlc'], a:`
<ol>
<li><b>Sign in</b> to github.com (create an account if needed).</li>
<li>Click <b>“+” → New repository</b> at the top right.</li>
<li>Enter a <b>repository name</b> and an optional description.</li>
<li>Choose <b>Public</b> or <b>Private</b>.</li>
<li>Optionally tick <b>Add a README</b>, choose a <b>.gitignore</b> template and a <b>licence</b>.</li>
<li>Click <b>Create repository</b>.</li>
<li><b>Connect a local project</b> using Git:
<pre>git init
git add .
git commit -m "First commit"
git branch -M main
git remote add origin https://github.com/username/repo.git
git push -u origin main</pre></li>
<li>Refresh the page: your files now appear on GitHub. Add collaborators under <b>Settings → Collaborators</b>.</li>
</ol>`},

{q:'Assess the influence of AI-powered software applications on modern software engineering.', see:['aiapps'], a:`
<p>AI-powered tools (GitHub Copilot, ChatGPT, Claude, AI testing tools) are changing every phase of the SDLC.</p>
<p><b>Positive influence:</b></p>
<ul>
<li><b>Faster coding:</b> code suggestions, auto-completion and generated functions boost productivity.</li>
<li><b>Requirements & design:</b> AI helps write user stories, summaries and design drafts.</li>
<li><b>Testing:</b> automatic test-case generation and bug detection.</li>
<li><b>Debugging:</b> explains errors and suggests fixes.</li>
<li><b>Documentation:</b> generates comments, README files and API docs.</li>
<li><b>DevOps:</b> predicts failures, monitors logs, automates deployment.</li>
<li><b>Learning:</b> beginners learn new languages and frameworks faster.</li>
</ul>
<p><b>Challenges:</b> incorrect or insecure code, over-dependence and weaker fundamentals, copyright/licensing doubts, data privacy, bias, and the need for human review.</p>
<p><b>Assessment:</b> AI does not replace software engineers; it shifts their role from writing every line to designing, reviewing, testing and guiding AI output. Used responsibly, it raises quality and speed.</p>`},

{q:'Describe the software development life cycle and explain all the phases of SDLC.', see:['sdlc'], a:`
<p>The <b>Software Development Life Cycle (SDLC)</b> is a structured process for planning, building, testing, delivering and maintaining software, so that it is high-quality, on time and within budget.</p>
<ol>
<li><b>Planning & requirement analysis:</b> understand the problem, collect requirements from users, check feasibility (technical, economic, time). Output: SRS (Software Requirement Specification).</li>
<li><b>Defining requirements:</b> document and get approval for what the software must do.</li>
<li><b>Design:</b> plan the architecture, database, modules and user interface (high-level and low-level design).</li>
<li><b>Development / coding:</b> programmers write code following the design.</li>
<li><b>Testing:</b> find and fix defects — unit, integration, system and acceptance testing.</li>
<li><b>Deployment:</b> release the software to users / production.</li>
<li><b>Maintenance:</b> fix bugs, update and improve the software after release.</li>
</ol>
<p><b>Common SDLC models:</b> Waterfall, V-model, Spiral, Iterative, Agile, DevOps.</p>`},

{q:'Give the difference between the Waterfall model and the Spiral model.', see:['sdlc'], a:`
${table(['Point','Waterfall model','Spiral model'],[
['Approach','Linear and sequential','Iterative, in loops (spirals)'],
['Phases','Each phase finishes before the next starts','Each loop: planning → risk analysis → engineering → evaluation'],
['Risk analysis','Not done explicitly','Main focus in every loop'],
['Requirement changes','Very difficult once started','Easy to accommodate'],
['Customer involvement','Mainly at start and end','In every iteration'],
['Cost','Low','High (risk analysis needs experts)'],
['Project size','Small, simple, clear requirements','Large, complex, high-risk'],
['Working software','Only at the end','Prototype after each loop'],
['Example','Payroll or small college management system','Defence or banking software, new technology projects']])}`},

{q:'Give the difference between the Agile and DevOps models.', see:['sdlc'], a:`
${table(['Point','Agile','DevOps'],[
['Meaning','Iterative development method delivering software in small sprints','Culture and practices joining Development and Operations teams'],
['Focus','Development speed and adapting to changing requirements','Fast, reliable delivery, deployment and operation'],
['Teams','Developers, testers, product owner','Developers + operations (and testers, security)'],
['Feedback from','Customer','Operations/monitoring and users'],
['Delivery','Working software at end of each sprint (2–4 weeks)','Continuous integration and continuous deployment, often many times a day'],
['Automation','Less emphasis','Heavy automation (build, test, deploy)'],
['Documentation','Light','Light, but configuration is code'],
['Tools','Jira, Trello, Scrum boards','Git, Jenkins, Docker, Kubernetes'],
['Methods','Scrum, Kanban, XP','CI/CD, Infrastructure as Code, monitoring']])}
<p><b>Relation:</b> they complement each other — Agile makes building fast; DevOps makes releasing and running fast.</p>`},

{q:'Give the difference between the Spiral and DevOps models with example.', see:['sdlc'], a:`
${table(['Point','Spiral model','DevOps model'],[
['Type','Risk-driven SDLC process model','Culture + practices for continuous delivery'],
['Main focus','Identifying and reducing risk','Speed, automation and collaboration'],
['Process','Loops: planning → risk analysis → engineering → evaluation','Continuous loop: plan → code → build → test → release → deploy → operate → monitor'],
['Release frequency','After each long loop (weeks/months)','Very frequent (daily or more)'],
['Teams','Development team with customer review','Development and Operations work together'],
['Automation','Low','Very high (CI/CD pipelines)'],
['Cost','High, due to risk analysis','High setup cost, low long-term cost'],
['Best for','Large, complex, high-risk projects','Web/cloud products needing constant updates']])}
<p><b>Examples:</b> Spiral — developing a missile control system or core banking software where failure is costly, so each loop checks risks first. DevOps — Netflix, Amazon or Instagram releasing new features and fixes many times a day through automated pipelines.</p>`}

function timeHue(){

 const n=new Date(), t=n.getHours()+n.getMinutes()/60;
 for(let i=0;i<pts.length-1;i++){const [t0,h0]=pts[i],[t1,h1]=pts[i+1];if(t>=t0&&t<=t1){let dh=h1-h0;if(dh>180)dh-=360;if(dh<-180)dh+=360;return h0+dh*(t-t0)/(t1-t0)}}
 return 250;
}

function lofiEngine(ctx,out){

 const master=ctx.createGain();master.gain.value=.0001;
 const warm=ctx.createBiquadFilter();warm.type='lowpass';warm.frequency.value=4200;warm.Q.value=.3;
 const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
 master.connect(warm);warm.connect(comp);comp.connect(out||ctx.destination);
 const keys=ctx.createGain();keys.gain.value=.9;const keysLP=ctx.createBiquadFilter();keysLP.type='lowpass';keysLP.frequency.value=1700;keys.connect(keysLP);keysLP.connect(master);
 const drums=ctx.createGain();drums.connect(master);
 const delay=ctx.createDelay(2),fb=ctx.createGain(),dLP=ctx.createBiquadFilter();fb.gain.value=.32;dLP.type='lowpass';dLP.frequency.value=2200;
 delay.connect(dLP);dLP.connect(fb);fb.connect(delay);dLP.connect(master);
 const wob=ctx.createOscillator(),wobG=ctx.createGain();wob.frequency.value=.35;wobG.gain.value=7;wob.connect(wobG);wob.start();
 const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=R()*2-1;
 const loopNoise=(hpF,lpF)=>{const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=nb;s.loop=true;hp.type='highpass';hp.frequency.value=hpF;lp.type='lowpass';lp.frequency.value=lpF;g.gain.value=0;
  s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);s.start();return g};

 const env=(g,t,a,peak,end)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+end)};
 function ep(m,t,dur,v){ // soft electric piano: sine body + triangle + a quick bell partial
  [['sine',1,0,1],['triangle',1,-7,.3],['sine',2,4,.12]].forEach(([type,mul,det,lv],i)=>{

 let pupils=[], mouthEl=null;
 function draw(){
  root.classList.remove('bean','cat','blob','owl','penguin','bear','capy','fox','mugcat');root.classList.add(S.type);setVariant(root,S.type);applyAge();applySize(root,S.type);
  const acc=S.wear&&ACC_SVG[S.wear]?`<g class="acc" transform="translate(0 ${S.wear==='shades'?0:ACC_OFF[S.type]})">${ACC_SVG[S.wear]}</g>`:'';
  bodyEl.innerHTML=`<svg viewBox="${ageBox()}" aria-hidden="true">${BODIES[S.type]}${face()}${S.vibing?phones():''}${coverPaws()}${acc||seasonHat(S.type)}${deco}</svg>`;
  pupils=$$('.pupil',bodyEl); mouthEl=$('.mouth',bodyEl); setMood(S.mood);
 }
 // particles (hearts, sparkles, treats) — max 8 alive, transform/opacity only
 function spawn(chars,n=1,cls='',box=fxEl,x,y){
  if(calm()) return;
  for(let i=0;i<n;i++){
   if(!box) return; if(box.childElementCount>=8) box.firstElementChild.remove();
   const s=document.createElement('span');s.className='bfx '+cls;s.textContent=Array.isArray(chars)?pick(chars):chars;
   s.style.setProperty('--dx',((Math.random()-.5)*70).toFixed(0)+'px');s.style.setProperty('--rot',((Math.random()-.5)*50).toFixed(0)+'deg');
   s.style.animationDelay=(i*.09)+'s';if(x!=null){s.style.left=(x+(Math.random()-.5)*10).toFixed(0)+'px';s.style.top=(y-8).toFixed(0)+'px'}s.addEventListener('animationend',()=>s.remove());box.appendChild(s);
  }
 }
 // ===================== moods & motion =====================
 let moodT=0;
 function setMood(m,dur){
  S.mood=m; root.className=root.className.replace(/\bm-\w+/g,'').trim()+' m-'+m;
  if(mouthEl){mouthEl.setAttribute('d',MOUTH[m]||MOUTH.idle);mouthEl.setAttribute('fill-opacity',/happy|party|surprised|yawn/.test(m)?1:0)}
  clearTimeout(moodT); if(dur) moodT=setTimeout(()=>setMood(S.base),dur);
 }
 function play(cls,ms=1200){root.classList.remove(cls);void root.offsetWidth;root.classList.add(cls);setTimeout(()=>root.classList.remove(cls),ms)}
 function setPupils(x,y,x2){pupils.forEach((p,i)=>p.setAttribute('transform',`translate(${(i&&x2!=null?x2:x).toFixed(2)} ${y.toFixed(2)})`))}
 // ===================== speech =====================
 let hideT=0;
 function render(html,closable,isMain){const back=closable&&!isMain&&S.menu;
  bubble.innerHTML=(closable?'<button class="bud-x" aria-label="Close">✕</button>':'')+(back?'<button class="bud-back" aria-label="Back to menu">‹</button>':'')+(isMain?'':`<span class="bname">${CH[S.type].name}</span>`)+html;
  bubble.classList.toggle('menu',!!closable);bubble.classList.add('show');S.showing=true;fitBubble();const x=$('.bud-x',bubble);if(x)x.onclick=e=>{e.stopPropagation();hide()};
  const bk=$('.bud-back',bubble);if(bk)bk.onclick=e=>{e.stopPropagation();sfx('tick');menu(true)}}
 function fitBubble(){ // open towards the side with more room; scroll if still too tall
  const r=root.getBoundingClientRect(), up=r.top-14, down=innerHeight-r.bottom-14, below=down>up&&bubble.scrollHeight>up;
  root.classList.toggle('flip-y',below||(root.classList.contains('free')&&r.top<230&&down>up));
  bubble.style.maxHeight=Math.max(120,(root.classList.contains('flip-y')?down:up))+'px';
 }
 function hide(){bubble.classList.remove('show');S.showing=false;S.menu=false;clearTimeout(hideT);
  if(S.mood==='think')setMood(S.base);
  if(S.queue.length){const [t,o]=S.queue.shift();setTimeout(()=>say(t,o),450)}}
 function say(text,o={}){
  if(!S.on) return;
  if(o.auto&&(quiet()||S.sleeping||S.menu||P.active||document.hidden||Date.now()<S.autoCool)) return;
  if(o.mood&&!P.active) setMood(o.mood,o.moodDur??2800);
  if(o.anim&&!P.active) play(o.anim);
  if(quiet()&&!o.force) return;
  if(S.menu&&!o.force) return;
  if(S.showing&&o.queue){S.queue.push([text,o]);if(S.queue.length>3)S.queue.shift();return}
  if(o.auto) S.autoCool=Date.now()+20000;
  render(text,false);if(o.voice)sfx('voice');else if(!o.silent)talk(text);
  clearTimeout(hideT);hideT=setTimeout(hide,o.dur||Math.min(9500,3600+plain(text).length*38));
 }
 // ===================== menus =====================

 const tile=(a,i,l)=>`<button class="bt" data-a="${a}" aria-label="${l}"><span>${i}</span><small>${l}</small></button>`;
 function menu(again){
  S.menu=true;clearTimeout(hideT);setMood('happy');if(!again)sfx(Math.random()<.4?'chatter':'pop');
  const c=CH[S.type],tab=MENU_TABS[store.get('ce-buddy-tab','play')]?store.get('ce-buddy-tab','play'):'play',mus=window.lofi&&lofi.playing,n=needs(S.type),ag=ageOf();
  const T={play:[tile('laser','🔴','Laser'),tile('dance','💃','Dance'),tile('tag','🏃','Tag'),tile('friend','👫',FRIENDS.length?`Friends ${FRIENDS.length}`:'Friends')],
   care:[tile('home','🏠','Home'),tile('diary','📔','Diary'),tile('wardrobe','👗','Outfits'),tile('colors','🎨','Colours'),tile('rename','✏️','Names')],
   study:[tile('tip','💡','Tip'),tile('fact','📌','Fact'),tile('joke','😂','Joke'),tile('remember','🧠','Tricky')],
   set:[tile('char','🔄','Buddy'),tile('sndset','🔊','Sounds'),tile('quiet',quiet()?'🗣️':'🔇',quiet()?'Talk':'Quiet'),tile('size','📏','Size'),tile('cafe','☕','Café night'),tile('pos','📍','Corner'),tile('hide','👋','Hide')]};
  render(`<div class="bm-head"><b class="bm-name">${c.name}</b><span class="bm-age" title="${ag[2]}">${ag[2].split(' ')[0]}</span>
   <span class="bm-bar" title="Affection ${A.v}">💗<i style="--v:${A.v}%;--c:#ff6b95"></i></span>
   ${['food','energy','fun'].map((k,i)=>`<span class="bm-bar" title="${['Food','Energy','Fun'][i]} ${Math.round(n[k])}%">${['🍽️','⚡','🎾'][i]}<i style="--v:${Math.round(n[k])}%;--c:${needCol(n[k])}"></i></span>`).join('')}</div>
   <div class="bm-quick">${tile('quiz','🎲','Quiz')}${tile('feed',c.treat,'Feed')}${tile('toys','🧸','Toys')}${tile('games','🎮','Games')}${tile('music',mus?'⏸️':'🎵',mus?'Stop':'Music')}</div>
   <div class="bm-tabs" role="tablist">${Object.entries(MENU_TABS).map(([k,[i,l]])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}" class="${k===tab?'on':''}">${i} ${l}</button>`).join('')}</div>
   <div class="bm-grid" role="tabpanel">${T[tab].join('')}</div>
   <p class="bud-hint">Rub me to pet · fling me · hold <b>L</b> for laser</p>`,true,true);
  $$('[data-a]',bubble).forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.dataset.a)});
  $$('[data-tab]',bubble).forEach(b=>b.onclick=e=>{e.stopPropagation();store.set('ce-buddy-tab',b.dataset.tab);sfx('tick');menu(true)});

 function act(a){
  S.menu=false;
  if(a==='quiz') return quizMe();
  if(a==='feed') return feed();
  if(a==='tip') return say(pick(TIPS),{force:true,mood:'think'});
  if(a==='joke'){sfx('giggle');return say(pick(JOKES),{force:true,mood:'party',anim:'jiggle',silent:true})}
  if(a==='fact') return say(fact(),{force:true,mood:'think'});
  if(a==='music'){hide();if(window.lofi)lofi.toggle();return}
  if(a==='laser') return laser(true,10000);
  if(a==='toys') return toysMenu();

  const g=tagGame={manual:!!manual,it:pick(actors),run:null,raf:0,ctrl:null,endT:0,swapT:0};g.run=pick(actors.filter(a=>a!==g.it));
  const nameOf=A=>CH[A.type()].name,tsay=(A,t)=>A.say(t,{force:!quiet(),dur:1800,silent:true});
  tsay(g.it,pick([`Tag! I’m it — run, ${nameOf(g.run)}! 🏃`,`Bet you can’t outrun me, ${nameOf(g.run)}! 😆`,'Ready or not, here I come! 🏃']));
  let last=performance.now(),wob=Math.random()*6;
  const flee=now=>{if(tagGame!==g)return;const dt=Math.min(.05,(now-last)/1000);last=now;const A=g.run,w=A.w(),p=A.pos(),q=g.it.pos();
   let dx=p.x-q.x,dy=(p.y-q.y)*.5;const d=Math.hypot(dx,dy)||1;wob+=dt*2;dx=dx/d+Math.sin(wob)*.5;dy=dy/d+Math.cos(wob*1.3)*.4;
   if(p.x<40)dx=Math.abs(dx)+.5;if(p.x>innerWidth-w-40)dx=-Math.abs(dx)-.5;
   const top=Math.max(4,innerHeight-w-200);if(p.y<top)dy=Math.abs(dy)+.3;if(p.y>innerHeight-w-8)dy=-Math.abs(dy)-.2;
   const m=Math.hypot(dx,dy)||1,sp=(A.type()==='cat'?300:A.type()==='penguin'?190:240)*(d<160?1.15:.7);
   A.setPos(p.x+dx/m*sp*dt,p.y+dy/m*sp*dt,false);A.el.classList.add('run');A.el.classList.toggle('face-l',dx<0);A.el.classList.toggle('face-r',dx>0);
   g.raf=requestAnimationFrame(flee)};
  const chaseRunner=()=>{g.ctrl=pursue(g.it,()=>{const p=g.run.pos(),w=g.run.w();return {x:p.x+w/2,y:p.y+w*.9}},{once:true,speedMul:1,onCatch(){
   g.ctrl=null;if(tagGame!==g)return;tsay(g.it,pick(['Tag! You’re it! 😜','Gotcha! 🙌','Tag! 🏷️']));g.run.el.classList.remove('run');sfxAs(g.it.type(),'boop');
   const old=g.it;g.it=g.run;g.run=old;g.swapT=setTimeout(()=>{if(tagGame===g)chaseRunner()},900)}})};
  last=performance.now();g.raf=requestAnimationFrame(flee);chaseRunner();
  g.endT=setTimeout(()=>{if(tagGame!==g)return;const a=g.it,b=g.run;stopTag();a.say('Phew! You win this time 😮‍💨',{force:!quiet(),dur:2000,silent:true});setTimeout(()=>b.say('Hehe, too fast for you! 😎',{force:!quiet(),dur:2000,silent:true}),900)},manual?14000:9000+Math.random()*4000);
  logDay('tag');allBuddies().forEach(t=>needAdd(t,'fun',10));return true}
