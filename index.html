/* ---------- U1: CPU & system clock ---------- */
{ id:'cpu', unit:'1-2', level:'Basics', title:'The CPU & system clock', desc:'Control unit, ALU, registers, data processing, clock cycles',
html:`
${simple('The CPU is the brain. Inside it, the <b>control unit</b> is the manager giving orders, the <b>ALU</b> is the worker doing the sums, and the <b>registers</b> are the desk the work happens on. The <b>system clock</b> is the conductor’s baton everyone moves to.')}
<div class="card"><b>Definition:</b> The <b>central processing unit (CPU)</b> is the unit of the computer system that includes the circuits that control the interpretation and execution of instructions. It is the most important component of a computer system.</div>
<ul><li>It receives input from users or sensors, decides what to do based on its program, and gives output.</li><li>It connects to the motherboard; <b>primary memory</b> is an extension of the CPU and assists it.</li><li>Two major subunits: the <b>control unit (CU)</b> and the <b>arithmetic logic unit (ALU)</b>.</li></ul>
<h3>Three functions of the CPU</h3><ol><li>Control the use of memory to store data and instructions.</li><li>Control the sequence of operations.</li><li>Give instructions to all parts of the computer to carry out processing.</li></ol>
${table(['Point','Control unit (CU)','Arithmetic logic unit (ALU)'],[['Nickname','The nerve centre','The calculating unit'],['Job','Controls and coordinates all hardware — peripherals, memory and the processor itself','Arithmetic (add, divide) and logical operations (comparing data)'],['Steps','Fetches the instruction from main memory, interprets it, executes it by signalling the correct device','Fetches data into registers, performs the operation, leaves the result in a data register'],['Driven by','A clock pulse (its rate is the speed)','Instructions from the CU']])}
<div class="card"><b>Register:</b> a very small, very fast storage location inside the CPU holding the data currently being worked on. Most registers are <b>word sized</b> (32-bit or 64-bit).</div>
<h3>How data is processed (block diagram)</h3>
<div class="svgbox"><svg viewBox="0 0 640 270" role="img" aria-label="CPU block diagram">
<defs><marker id="cpA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
<rect x="190" y="14" width="260" height="150" rx="12" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 4"/><text x="320" y="34" text-anchor="middle" font-weight="700" style="fill:var(--accent)">PROCESSOR (CPU)</text>
<rect x="210" y="46" width="220" height="32" rx="7" fill="var(--c1)"/><text x="320" y="67" text-anchor="middle" font-weight="600" style="fill:#fff">Control Unit</text>
<rect x="210" y="86" width="105" height="62" rx="7" fill="var(--c2)"/><text x="262" y="122" text-anchor="middle" font-weight="600" style="fill:#fff">ALU</text>
<rect x="325" y="86" width="105" height="62" rx="7" fill="var(--c6)"/><text x="377" y="122" text-anchor="middle" font-weight="600" style="fill:#fff">Registers</text>
<rect x="14" y="70" width="130" height="50" rx="8" fill="var(--c3)"/><text x="79" y="92" text-anchor="middle" font-weight="600" style="fill:#fff">INPUT</text><text x="79" y="108" text-anchor="middle" font-size="10.5" style="fill:#fff">data &amp; instructions</text>
<rect x="496" y="70" width="130" height="50" rx="8" fill="var(--c5)"/><text x="561" y="92" text-anchor="middle" font-weight="600" style="fill:#fff">OUTPUT</text><text x="561" y="108" text-anchor="middle" font-size="10.5" style="fill:#fff">processed information</text>
<rect x="230" y="212" width="180" height="44" rx="8" fill="var(--c4)"/><text x="320" y="239" text-anchor="middle" font-weight="600" style="fill:#fff">Main Memory</text>
<path d="M146 95 H186" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#cpA)"/><path d="M452 95 H492" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#cpA)"/>
<path d="M320 168 V208" stroke="var(--muted)" stroke-width="2.5" marker-start="url(#cpA)" marker-end="url(#cpA)"/><text x="330" y="194" font-size="11" style="fill:var(--muted)">two-way data flow</text></svg></div>
<ol><li><b>Input:</b> data and instructions enter through an input device.</li><li><b>Store:</b> they are held in main memory.</li><li><b>Fetch &amp; interpret:</b> the CU fetches the instruction and interprets it.</li><li><b>Execute:</b> the CU signals the right device; the ALU does arithmetic/logic using registers.</li><li><b>Result:</b> the ALU leaves the result in a data register → back to main memory (under CU direction).</li><li><b>Output:</b> processed information goes to an output device.</li></ol>
<p class="muted">ALU in four steps: fetch from memory → place in registers/accumulators → perform the operation → leave the result in a data register.</p>
<h2>The system clock</h2>
<div class="card"><b>Definition:</b> A <b>system clock</b> is an electronic oscillator that generates a sequence of regular timing pulses (clock signals) used to synchronise and control the execution of instructions and data transfers within a computer system. Its <b>frequency determines the operating speed</b> of the computer.</div>
${table(['Function','What to write'],[['1. Synchronises operations','Coordinates CPU, memory and I/O; keeps instructions in the correct sequence'],['2. Controls instruction execution','Decides when the CPU fetches, decodes and executes'],['3. Regulates data transfer','Controls data movement; prevents corruption through proper timing'],['4. Determines processing speed','Measured as frequency in Hz, MHz or GHz'],['5. Coordinates hardware','Keeps every component working at the correct time interval']])}
<p><b>Advantages:</b> accurate operation · synchronisation among components · better processing efficiency · reliable communication between devices.</p>
${tryBox('Watch the clock run an addition', `<div class="u-clock"><div class="row"><button class="btn u-tick">⏱ Tick</button><button class="btn ghost u-auto">▶ Auto</button><span class="muted u-cyc"></span></div>
<div class="steps u-steps" style="margin-top:8px">${['1. Fetch data from memory','2. Decode the instruction','3. Add in the ALU','4. Store the result'].map(t=>`<button disabled>${t}</button>`).join('')}</div>
<div class="stepbody u-body">Press <b>Tick</b>: each clock pulse lets the CPU do one step.</div>
<p style="margin-bottom:0">Clock speed: <input type="text" class="u-ghz mono" value="3" style="width:70px"> GHz → <b class="u-res"></b></p></div>`)}
${counts('two CPU subunits · three CPU functions · four ALU steps · five clock functions · four clock advantages · four cycles in the addition example.')}
${model('How is data processed in the system? Demonstrate with a block diagram (5 marks)','Definition of the CPU → the six numbered steps (input, store, fetch & interpret, execute, result, output) → stage/part table → <b>labelled diagram</b>: CU, ALU and registers inside the processor box, input left, output right, main memory below with a two-way arrow → example: adding two numbers.')}
${traps(['Saying the ALU controls the sequence of operations — that is the control unit.','Leaving main memory out of the diagram, or not labelling the arrows.','Saying the system clock tells the time of day — it is a timing oscillator.','Giving Hz/MHz/GHz without saying frequency determines operating speed.'])}`,
init(){
 const box=$('.u-clock'); let c=0, t=null;
 const msgs=['Cycle 1: the CPU fetches the two numbers from memory into registers.','Cycle 2: the control unit decodes the ADD instruction.','Cycle 3: the ALU adds the numbers.','Cycle 4: the result is stored back to memory. Done in 4 pulses!'];
 const tick=()=>{c=c%4+1;$$('.u-steps button',box).forEach((b,i)=>b.className=i+1===c?'on':i+1<c?'past':'');$('.u-body',box).textContent=msgs[c-1];$('.u-cyc',box).textContent='Clock cycle '+c;window.studyBuddy&&studyBuddy.sfx('tick')};
 $('.u-tick',box).onclick=tick;
 $('.u-auto',box).onclick=e=>{if(t){clearInterval(t);t=null;e.target.textContent='▶ Auto';return}e.target.textContent='⏸ Stop';t=setInterval(tick,900)};
 window.addEventListener('hashchange',()=>clearInterval(t),{once:true});
 const g=$('.u-ghz',box),res=$('.u-res',box);const u=()=>{const v=parseFloat(g.value);res.textContent=v>0?`${(v*1e9).toLocaleString()} cycles per second ≈ ${(v*1e9/4).toLocaleString()} additions/s at 4 cycles each`:'—'};g.oninput=u;u();
},
keys:['CPU = circuits that control the interpretation and execution of instructions; most important component.','CU = nerve centre (fetch, interpret, execute; controls sequence; driven by clock). ALU = arithmetic & logic. Registers = tiny fast storage, word sized.','3 CPU functions: control memory use, control sequence, instruct all parts.','System clock = oscillator producing timing pulses; frequency (Hz/MHz/GHz) sets operating speed. 3 GHz ≈ 3 billion cycles/s.','Addition in 4 cycles: fetch → decode → add in ALU → store.'],
quiz:[
{q:'Which part of the CPU is called the nerve centre?',o:['ALU','Control unit','Registers','Cache'],a:1,e:'The CU controls and coordinates all hardware operations.'},
{q:'Comparing two data items is done by the…',o:['Control unit','ALU','System clock','Motherboard'],a:1,e:'The ALU performs arithmetic and logical operations.'},
{q:'Most registers are…',o:['Word sized (32/64-bit)','1 KB each','Stored on the hard disk','Part of ROM'],a:0,e:'Registers are word sized.'},
{q:'Clock speed is measured in…',o:['Bytes','Hertz (Hz, MHz, GHz)','Bits per second','Watts'],a:1,e:'Frequency in Hz/MHz/GHz determines operating speed.'},
{q:'A 3 GHz processor generates about…',o:['3 million cycles per second','3 billion cycles per second','3 thousand cycles per second','3 cycles per second'],a:1,e:'Giga = billion.'},
{q:'In the 4-cycle addition example, cycle 2 is…',o:['Fetch','Decode the instruction','Add in the ALU','Store the result'],a:1,e:'Fetch → Decode → Add → Store.'},
{q:'Which is NOT one of the three CPU functions?',o:['Control the use of memory','Control the sequence of operations','Tell the time of day','Give instructions to all parts'],a:2,e:'The CPU (and its clock) has nothing to do with the time of day.'}
]},

/* ---------- U1: memory ---------- */
{ id:'memory', unit:'1-2', level:'Core', title:'Memory: RAM, ROM, cache & virtual memory', desc:'Primary vs secondary, SRAM/DRAM, ROM types, hierarchy, units, access methods',
html:`
${simple('Fast memory is expensive and forgets everything when the power goes; cheap memory is huge but slow. So computers use <b>layers</b>: tiny fast registers and cache near the CPU, RAM in the middle, and big slow disks at the bottom.')}
<div class="card"><b>Definition:</b> A <b>storage device</b> is any hardware capable of holding information either temporarily or permanently. There are two types: <b>primary</b> and <b>secondary</b> storage devices.</div>
${table(['Point','Primary storage','Secondary storage'],[['Other name','Main / internal memory','Auxiliary / external memory'],['Size','Small','Large capacity'],['Speed','Fastest access','Slower'],['Volatility','Mostly volatile','Non-volatile (keeps data without power)'],['Holds','Data in use right now','Software and files not in use'],['Examples','Cache, RAM, ROM','USB flash drive, CD, DVD, hard disk']])}
<h2>RAM vs ROM</h2>
${table(['Point','RAM','ROM'],[['Full form','Random access memory','Read only memory'],['Contents','Temporary, continually changing','Permanent, cannot be changed by the user'],['Volatility','Volatile — lost when power is lost','Non-volatile — kept when power is off'],['Holds','The OS, software in use, files being worked on','Boot routines (firmware) used to start the computer'],['Operations','Read and write','Read only']])}
<h2>SRAM vs DRAM</h2>
${table(['Point','SRAM (static)','DRAM (dynamic)'],[['Memory refresh','<b>Not needed</b>','<b>Needed</b>'],['Speed / cost','Faster, costlier','Slower, cheaper'],['Used as','Cache memory, registers','Main memory (the RAM in our system)']])}
<div class="card"><b>Exam answer:</b> the RAM used as main memory in our system is <b>DRAM</b> (cheap, so it can be large). The RAM that improves processor throughput is <b>SRAM</b>, because it is used as cache and needs no refresh.</div>
<h3>Types of ROM</h3>
${table(['Type','Full form','Meaning'],[['PROM','Programmable ROM','Blank when made; written once, then fixed'],['EPROM','Erasable programmable ROM','Can be erased and re-programmed'],['EEPROM','Electrically erasable programmable ROM','Erased and rewritten electrically, in place (flash memory comes under this)']])}
<p class="muted">Also optical ROM: CD/DVD/BD-ROM. Trick: count the Es — no E: write once; one E: erasable; two Es: electrically erasable.</p>
<div class="grid">
${reveal('Cache memory','Very small, very fast primary memory between the CPU and main memory. Built from SRAM (no refresh), volatile, smaller and costlier than RAM. Holds frequently used data so the CPU doesn’t wait for slower RAM.')}
${reveal('Significance of ROM','Holds the boot routines as firmware, so the machine can start itself when power is switched on. Non-volatile.')}
${reveal('Virtual memory','Part of the hard disk is used as if it were main memory, giving the illusion of a very large RAM. The program is split into pieces; only the needed pieces are in RAM, the rest brought in on demand by the OS. Bigger/more programs can run, but it is slower.')}
${reveal('Memory hierarchy','Storage arranged in levels where speed and cost per unit fall and capacity rises as you go down: registers → cache → RAM → secondary storage.')}
</div>
${tryBox('Memory hierarchy — tap a level', `<div class="u-pyr"></div><div class="stepbody u-pinfo">Tap a level of the pyramid.</div>`)}
${table(['Point','Virtual memory','Virtualization in the cloud'],[['What is faked','Main memory, using disk space','Whole machines, using one physical server'],['Purpose','Run programs larger than the RAM','One resource appears as many, or many as one'],['Managed by','The operating system','The hypervisor'],['Scope','Inside one computer','Across servers and data centres']])}
<h2>Units, characteristics &amp; access methods</h2>
${table(['Unit','Meaning'],[['Bit','<b>BI</b>nary digi<b>T</b> — a single 0 or 1'],['Byte','8 bits'],['Kilobit','1000 bits'],['Word','The natural unit of data for a processor; its size is the word length (32-bit, 64-bit)'],['KB / KiB','1 KB is taken as 2¹⁰ = 1024 bytes, more precisely one kibibyte (KiB)'],['Binary prefixes','1 KiB = 2¹⁰ B, 1 MiB = 2²⁰ B, 1 GiB = 2³⁰ B']])}
${table(['Characteristic','Sub-types','Examples'],[['<b>V</b>olatility','Volatile / non-volatile','RAM is volatile; ROM and hard disk are not'],['<b>M</b>utability','Read/write / read only','HDD, SSD read/write; CD-ROM read only'],['<b>A</b>ccessibility','Random / direct / sequential','RAM; hard disk; magnetic tape']])}
${tryBox('Access methods race: find item #7', `<div class="row"><button class="btn u-race">▶ Race</button><span class="muted">Random = instant · Direct = jump close, then read · Sequential = pass everything before it</span></div><div class="u-lanes"></div>`)}
<p class="muted">Two memory categories: main = primary = internal; secondary = auxiliary = external. Trick: random is a music app, sequential is a cassette, direct is a book with chapters.</p>
${counts('two storage types · two main memory types (RAM, ROM) · two RAM categories · three ROM types · four hierarchy levels · 8 bits in a byte · three characteristics (V-M-A) · three access methods.')}
${model('Which type of RAM do we use? State the significance of ROM and cache (5 marks)','RAM definition → two categories DRAM and SRAM → <b>main memory is DRAM</b> (cheap, large) → SRAM needs no refresh → SRAM = cache/registers → improves throughput → significance of ROM (boot firmware) → significance of cache (CPU doesn’t wait) → SRAM vs DRAM table → example: an 8 GB laptop uses DRAM; the few MB of cache are SRAM.')}
${traps(['Saying ROM is where files are saved — ROM holds boot routines; files go to secondary storage.','Saying our system uses SRAM as main memory. Main memory is DRAM.','Treating virtual memory and virtualization as the same thing.','Confusing random access (immediate anywhere) with direct access (jump close, then read).','Writing that a byte is 10 bits. It is 8.'])}`,
init(){
 const L=[['Registers','Fastest · smallest · highest cost per unit. Inside the CPU, word sized.','var(--c5)',30],['Cache memory','Very fast · very small · very high cost. SRAM between CPU and RAM.','var(--c3)',50],['RAM (main memory)','Fast · medium size · medium cost. DRAM, volatile, holds what is in use.','var(--c2)',72],['Secondary storage','Slow · very large · lowest cost. HDD, SSD, optical, tape — non-volatile.','var(--c1)',96]];
 const p=$('.u-pyr');p.innerHTML=L.map((l,i)=>`<button class="layer" style="background:${l[2]};width:${l[3]}%;margin:4px auto;text-align:center" data-i="${i}">${l[0]}</button>`).join('')+'<p class="muted" style="text-align:center;font-size:12px">▲ faster &amp; costlier · ▼ bigger &amp; cheaper</p>';
 $$('button',p).forEach(b=>b.onclick=()=>{$('.u-pinfo').innerHTML=`<b>${L[b.dataset.i][0]}:</b> ${L[b.dataset.i][1]}`});
 const lanes=$('.u-lanes');
 const M=[['Random (RAM)','rnd'],['Direct (hard disk)','dir'],['Sequential (tape)','seq']];
 lanes.innerHTML=M.map(([n,k])=>`<div class="u-lane"><b>${n}</b><div class="u-cells" data-k="${k}">${Array.from({length:10},(_,i)=>`<span>${i+1}</span>`).join('')}</div><span class="u-t muted"></span></div>`).join('');
 let running=false;
 $('.u-race').onclick=async()=>{if(running)return;running=true;const sl=ms=>new Promise(r=>setTimeout(r,ms));
  $$('.u-cells span',lanes).forEach(s=>s.className='');$$('.u-t',lanes).forEach(t=>t.textContent='');
  const run=async(k,path)=>{const cells=$$(`.u-cells[data-k="${k}"] span`,lanes);for(const i of path){cells.forEach(c=>c.classList.remove('cur'));cells[i].classList.add('cur','seen');await sl(260)}cells[6].classList.add('hit');$(`.u-cells[data-k="${k}"]`,lanes).nextElementSibling.textContent=`found in ${path.length} step${path.length>1?'s':''}`};
  await Promise.all([run('rnd',[6]),run('dir',[5,6]),run('seq',[0,1,2,3,4,5,6])]);running=false};
},
keys:['Primary = small, fast, mostly volatile (cache, RAM, ROM); secondary = large, non-volatile (HDD, USB, CD/DVD).','RAM volatile read/write (OS, open files); ROM non-volatile read-only (boot routines = firmware).','DRAM needs refresh → main memory; SRAM no refresh, faster → cache & registers, improves throughput.','ROM types: PROM (write once), EPROM (erasable), EEPROM (electrically erasable, flash). Cache = SRAM between CPU and RAM. Virtual memory = disk used as RAM, managed by the OS.','Hierarchy: registers → cache → RAM → secondary. Byte = 8 bits; 1 KiB = 1024 B. V-M-A characteristics; random / direct / sequential access.'],
quiz:[
{q:'Which RAM is used as the main memory of our system?',o:['SRAM','DRAM','EPROM','Cache'],a:1,e:'DRAM is cheaper and can be large; it needs refresh.'},
{q:'Which RAM needs no memory refresh?',o:['DRAM','SRAM','Both','Neither'],a:1,e:'SRAM — so it is faster and used for cache and registers.'},
{q:'ROM holds…',o:['Files you save','The boot routines (firmware)','The OS while running','Cache data'],a:1,e:'Boot routines so the computer can start itself.'},
{q:'Which ROM can be erased and rewritten electrically, in place?',o:['PROM','EPROM','EEPROM','CD-ROM'],a:2,e:'Two Es = electrically erasable; flash memory comes under it.'},
{q:'Virtual memory is managed by the…',o:['Hypervisor','Operating system','BIOS only','User'],a:1,e:'Cloud virtualization is managed by a hypervisor; virtual memory by the OS.'},
{q:'Magnetic tape uses which access method?',o:['Random','Direct','Sequential','Indexed'],a:2,e:'It must pass over all earlier data.'},
{q:'A hard disk is…',o:['Volatile, read-only, sequential','Non-volatile, read/write, direct access','Volatile, read/write, random','Non-volatile, read-only, random'],a:1,e:'One device answers all three V-M-A questions.'},
{q:'Moving down the memory hierarchy…',o:['Speed rises, capacity falls','Speed and cost fall, capacity rises','Everything rises','Cost rises'],a:1,e:'Registers are fastest and costliest; secondary storage is slowest and cheapest.'}
]},

/* ---------- U1: storage media ---------- */
{ id:'storage', unit:'1-2', level:'Core', title:'Storage media & secondary storage', desc:'Optical, solid state, magnetic; HDD vs SSD; storage & performance',
html:`
${simple('There are only three ways to keep data without power: mark a disk with <b>light</b> (optical), trap a charge in a <b>chip</b> (solid state), or <b>magnetise</b> a coating (magnetic). Everything about speed and durability follows from which trick is used.')}
<div class="card"><b>Definition:</b> Data needs a material on which to be stored, called the <b>storage media</b>. There are three types: <b>optical</b>, <b>solid state</b> and <b>magnetic</b>. (Trick: O-S-M, “Old School Media” — light, chip, tape.)</div>
<div class="grid">
<div class="card" style="margin:0"><h3>💿 Optical</h3>Flat circular disks storing data as a series of bumps (binary pattern) read by a laser. CDs and DVDs; both can store data and be used for backup.</div>
<div class="card" style="margin:0"><h3>🔌 Solid state</h3>No moving parts, hence “solid state”. Uses a special programmable ROM chip that remembers data even when the power is off. e.g. memory cards, USB flash drives.</div>
<div class="card" style="margin:0"><h3>📼 Magnetic</h3>Plastic tape coated with a magnetic layer; backs up hard disks; huge capacity; used in batch processing (payroll, stock control). Also hard drives and floppy disks.</div>
</div>
${table(['USB flash drive — advantages','USB flash drive — disadvantages'],[['Portable','Can carry viruses from one computer to another'],['Needs no power to operate','If lost or stolen, sensitive files are easily accessed'],['No moving parts → less danger of losing information','—']])}
${table(['Magnetic tape — advantages','Magnetic tape — disadvantages'],[['One cartridge stores up to 1 terabyte','Special equipment must be bought and set up'],['Used by big companies for continuous recording and backup','Data can only be read on that special equipment'],['Data collection can run overnight or all weekend','Lifespan about 15 years; quality erodes over time'],['Can be recorded over and reused','—'],['Inexpensive, budget friendly','—']])}
${table(['Point','HDD','SSD','Optical disk'],[['Stands for','Hard disk drive','Solid state drive','CD / DVD / BD'],['Technology','Magnetic','Flash memory chips','Light — bumps read by laser'],['Moving parts','Yes','No','Yes (disk spins)'],['Speed','Medium','Fastest','Slowest'],['Access','Direct','Direct','Direct']])}
<h3>Why storage technology matters for performance</h3>
<ul><li><b>Speed of access:</b> the faster the storage, the less the CPU waits.</li><li><b>Non-volatility:</b> programs and files survive a power cut and need not be reloaded.</li><li><b>No moving parts:</b> SSD/flash is faster and less likely to lose information.</li><li><b>Capacity:</b> large storage allows virtual memory, so bigger programs run.</li><li><b>Backup:</b> cheap high-capacity tape protects the whole ecosystem’s data.</li><li><b>Hierarchy:</b> registers + cache + RAM + disk together give both speed and capacity.</li></ul>
${tryBox('Pick the best storage', `<div id="stChoose"></div>`)}
${counts('three storage media · flash drive 3 advantages / 2 disadvantages · tape 5 advantages / 3 disadvantages.')}
${model('Short note on the importance of storage technology in enhancing performance (5 marks)','Definition of storage device and storage media → six points (speed, non-volatility, no moving parts, capacity/virtual memory, backup, hierarchy) → medium/strength/weakness table → example: swapping an HDD for an SSD makes the same PC start and load faster.')}
${traps(['Calling a hard disk optical. It is magnetic; only CDs/DVDs are optical.','Writing tape lifespan as 15 days or months — it is about 15 years.','Giving advantages without disadvantages when both are asked.'])}`,
init(){initChooser('stChoose',[
 ['A company must back up 1 TB of data every night, as cheaply as possible.','Magnetic tape','Huge capacity, cheap, reusable, runs overnight.'],
 ['You want your laptop to boot and open programs as fast as possible.','SSD','No moving parts — the fastest.'],
 ['You need to carry a presentation to college in your pocket.','USB flash drive','Portable and needs no power.'],
 ['A musician wants to distribute an album on a cheap physical disc.','Optical disc (CD/DVD)','Cheap and good for distribution.'],
 ['A desktop needs 4 TB of everyday storage at low cost.','HDD','Large and cheap; medium speed.']],
 ['Magnetic tape','SSD','USB flash drive','Optical disc (CD/DVD)','HDD'])},
keys:['Storage media = the material data is stored on: optical (CD/DVD), solid state (flash, no moving parts), magnetic (tape, HDD).','Solid state = no moving parts; programmable ROM chip keeps data without power.','Flash drive: portable, no power, no moving parts / viruses, theft risk.','Tape: up to 1 TB, backup, overnight, reusable, cheap / special equipment, ~15-year lifespan.','SSD fastest, HDD medium, optical slowest; all direct access.'],
quiz:[
{q:'Why are solid state devices called “solid state”?',o:['They are heavy','They have no moving parts','They use magnets','They use lasers'],a:1,e:'No moving parts; data is held on a chip.'},
{q:'A hard disk drive uses which technology?',o:['Optical','Magnetic','Solid state','Paper'],a:1,e:'Only CDs/DVDs are optical.'},
{q:'Magnetic tape lifespan is about…',o:['15 days','15 months','15 years','150 years'],a:2,e:'About 15 years; data quality erodes over time.'},
{q:'Which is the fastest secondary storage?',o:['HDD','SSD','DVD','Tape'],a:1,e:'SSD — flash chips with no moving parts.'},
{q:'A disadvantage of USB flash drives is…',o:['They need mains power','They can carry viruses between computers','They have moving parts','They hold only 1 KB'],a:1,e:'Also: if lost or stolen, sensitive files can be accessed.'},
{q:'Magnetic tape is used in…',o:['Gaming','Batch processing such as payroll','Live video calls','Cache memory'],a:1,e:'Payroll processing and general stock control.'}
]},

/* ---------- U1: software, interaction & translators ---------- */
{ id:'sw1', unit:'1-2', level:'Core', title:'Software, translators & HW–SW interaction', desc:'System/application/utility software, drivers, compiler vs interpreter, the 4-layer diagram',
html:`
${simple('Hardware is the body, software is the brain, and the operating system is the nervous system between them. Neither works alone: <i>no software, no use; no hardware, no place.</i>')}
<div class="card"><b>Definition:</b> <b>Software</b> is a set of instructions or programs that instructs a computer to do specific tasks. A <b>program</b> is a sequence of instructions written to solve a particular problem.</div>
<ul><li>Designed for a well-defined function; one program cannot do everything.</li><li>Not touchable — only its effects appear on screen.</li><li>By functionality, two main types: <b>system software</b> and <b>application software</b>.</li></ul>
<div class="card"><b>Safe exam sentence (your files disagree):</b> “Software is broadly divided into system software and application software; within system software the main kinds are operating systems, utility programs and device drivers, and utility software is often listed as a third category in its own right.”</div>
${table(['Type','Definition','Two examples'],[['<b>System software</b>','Controls and manages the operations of computer hardware and enables application programs to execute properly','Windows, Linux'],['<b>Application software</b>','Does real work for the user; created for specific tasks; also called an application package','MS Word, MS Excel'],['<b>Utility software</b>','System software that lets the user analyse, configure and maintain the computer','Antivirus, disk cleanup']])}
${table(['Kind of system software','What it does','Example'],[['Operating system','Manages hardware resources, provides common services','Windows, Linux, macOS'],['Utility program','Analyse, configure and maintain the computer','Antivirus, disk cleanup, backup'],['Device driver','Operates/controls one particular type of attached device','Printer driver']])}
<p class="muted">Trick: O-U-D, “Our Useful Drivers”. Basic operations of system software: saving data on disk, making the computer work for us, printing a document.</p>
${table(['Point','Custom software','Packaged software'],[['Also called','Bespoke, tailor made','Ready-made'],['Made for','One specific organisation or user','Sale, lease or licence to the public'],['Fit','Exactly what the buyer wants','Only what the maker included'],['Cost','High','Lower, shared by many buyers'],['Example','Billing system for one hospital','MS Office, Photoshop']])}
<div class="card"><b>Device drivers in the HW–SW interaction:</b> a driver is system software that operates one type of device; one is needed per kind of device. The OS manages device communication through the drivers and loads the right one automatically when a device (pen drive, camera) is attached. The driver translates the OS’s general request into the exact signals one device understands — without it the hardware is present but unusable.</div>
<h2>Interaction between hardware and software</h2>
<div class="card"><b>Definition:</b> Hardware and software are <b>mutually dependent</b>: both must work together to make a computer produce a useful output. Software cannot be utilised without supporting hardware; hardware without programs to operate upon is useless. <i>Always write both directions.</i></div>
${tryBox('Send a print job through the layers', `<div class="u-layers"></div><div class="row" style="margin-top:8px"><button class="btn u-send">🖨 Print a document</button><span class="muted u-lmsg"></span></div>`)}
${table(['Point','Hardware','Software'],[['Nature','Physical and touchable','Instructions; not touchable'],['Role','Executes the instructions','Tells the hardware what to do and when'],['If the other is missing','Useless','Cannot be utilised'],['Failure','Wears out and breaks','No wear; has errors or bugs'],['Example','CPU, keyboard, monitor','Windows, MS Word']])}
<h2>Language translators</h2>
<div class="card"><b>Definition:</b> A <b>language translator</b> is system software that converts a program written by a human (<b>source code</b>) into the machine language the hardware can execute (<b>object code</b>). Types: <b>compiler, interpreter, assembler</b>. The OS coordinates and assigns them to users.</div>
${table(['Point','Compiler','Interpreter','Assembler'],[['Translates','Whole program at once','One line at a time','Whole assembly program'],['Execution','After translation','Line by line while translating','After translation'],['Object code','Yes','No','Yes'],['Execution speed','Faster','Slower','Fast'],['Errors','All listed after scanning the whole program','Stops at the first error','Reported after assembly'],['Input language','High-level (C, C++)','High-level (Python, BASIC)','Assembly (ADD, MOV)']])}
${tryBox('Compiler vs interpreter: the program has a bug on line 3', `<pre class="mono card u-src" style="white-space:pre;margin:6px 0">1  x = 5
2  print(x)
3  pritn(x + 1)   ← typo
4  print("done")</pre><div class="row"><button class="btn u-comp">Compile</button><button class="btn u-interp">Interpret</button></div><div class="stepbody u-tout" style="margin-top:8px;font-family:var(--fm);font-size:13px;white-space:pre-wrap">Choose one.</div>`)}
<p class="muted">Trick: a compiler is a translated book — translated in full, then read fast. An interpreter is a live translator — sentence by sentence, slower, but mistakes are caught immediately.</p>
${counts('two main software types · three kinds of system software · four layers in the HW–SW diagram · two directions of dependence · three translator types.')}
${model('With a neat diagram, explain the interaction between hardware and software (5 marks)','Define hardware, software and mutual dependence → numbered flow: user → application → OS → driver → hardware → result back up → both dependence sentences → <b>4-layer diagram</b> (hardware bottom, OS, system &amp; application programs, users top; two-way arrows) → layer/role table → example: printing from MS Word.')}
${traps(['Calling an operating system an application — it is system software.','Giving Windows as utility software. Give antivirus or disk cleanup.','Writing only one direction of the hardware–software dependence.','Saying an interpreter is faster. Interpreted execution is slower.','Calling an assembler a compiler: its input is assembly language.'])}`,
init(){
 const L=[['👩‍🎓 Users','Give the task: “print my notes”','var(--c3)'],['📄 System & application programs','MS Word turns the task into a print request','var(--c2)'],['⚙️ Operating system','Windows passes it to the printer driver and schedules the printer','var(--c4)'],['🖨 Computer hardware','The printer executes and produces the page','var(--c1)']];
 const box=$('.u-layers');box.innerHTML=L.map((l,i)=>`<div class="u-layer" style="background:${l[2]};width:${70+i*10}%">${l[0]}</div>`).join('');
 $('.u-send').onclick=async()=>{const ls=$$('.u-layer',box),sl=ms=>new Promise(r=>setTimeout(r,ms));
  for(let i=0;i<4;i++){ls.forEach(x=>x.classList.remove('on'));ls[i].classList.add('on');$('.u-lmsg').textContent='⬇ '+L[i][1];window.studyBuddy&&studyBuddy.sfx('tick');await sl(900)}
  for(let i=2;i>=0;i--){ls.forEach(x=>x.classList.remove('on'));ls[i].classList.add('on');$('.u-lmsg').textContent='⬆ result returns: '+['the user sees the printed page ✅','Word shows “Printed”','OS reports the job is done'][i];await sl(650)}
  ls.forEach(x=>x.classList.remove('on'))};
 const out=$('.u-tout');
 $('.u-comp').onclick=()=>{out.innerHTML='Scanning the WHOLE program first…\n\n<span class="bad">Error on line 3: unknown name “pritn”\n1 error found. No object code produced.</span>\n\nNothing ran. Fix all errors, compile again → object code runs fast every time.'};
 $('.u-interp').onclick=async()=>{const sl=ms=>new Promise(r=>setTimeout(r,ms));out.textContent='Line 1 → x = 5 ✓\n';await sl(600);out.textContent+='Line 2 → 5 ✓\n';await sl(600);out.innerHTML+='<span class="bad">Line 3 → Error: “pritn” not defined. STOPPED.</span>\n\nLines 1–2 already ran; line 4 never ran. Error found immediately, but the program is re-translated on every run (slower).'};

/* ---------- U2: OS basics, architecture, bootstrap & functions ---------- */
{ id:'os', unit:'1-2', level:'Core', title:'Operating system: basics & functions', desc:'Definition, objectives, components, bus architecture, bootstrap, 8 functions, process states',
html:`
${simple('The operating system is like a hotel receptionist: you never walk into the kitchen yourself — you ask, and it’s arranged. It decides which program gets the CPU, memory, devices and files, and stops programs from clashing.')}
<div class="card"><b>Definition:</b> An <b>operating system</b> is a program that manages a computer’s hardware. It also provides a basis for application programs and acts as an <b>intermediary</b> between the computer user and the computer hardware.</div>
<ul><li>Interface between user and hardware; performs basic tasks: file, memory and process management, handling input/output, controlling peripherals (disk drives, printers).</li><li>An integrated set of specialised programs managing the computer’s overall resources; controls and monitors all other programs.</li><li>Examples in your files: Linux, Windows, VMS, OS/400, AIX, z/OS.</li></ul>
<h3>Four objectives</h3><ol><li>Make the computer convenient to use in an efficient manner.</li><li>Hide the details of the hardware resources from users.</li><li>Provide users a convenient interface.</li><li>Act as an intermediary between hardware and users.</li></ol>
${table(['Component','What it is','Examples'],[['Hardware','Physical resources of the machine','CPU, memory, I/O devices'],['Operating system','The program that governs all the processes','Windows, Linux'],['Application programs','Programs doing the user’s real work','Word processors, spreadsheets, browsers'],['Users','People using the system','Students, clerks, developers']])}
<p><b>Mark-earning sentence:</b> the OS controls the hardware and coordinates its use among the various application programs for the various users. (Trick: H-O-A-U, “Hardware Obeys Apps for Users”.)</p>
<h2>Modern computer architecture</h2>
<div class="card"><b>Definition:</b> A modern general-purpose computer system consists of one or more CPUs and a number of device controllers connected through a <b>common bus</b> that provides access to <b>shared memory</b>.</div>
<div class="svgbox"><svg viewBox="0 0 640 250" role="img" aria-label="Bus architecture">
${[['CPU',85,'var(--c1)',''],['Disk controller',235,'var(--c2)','💽 disks'],['USB controller',385,'var(--c3)','🖱 ⌨ 🖨'],['Graphics adapter',535,'var(--c4)','🖥 monitor']].map(([t,x,c,d])=>`${d?`<text x="${x}" y="30" text-anchor="middle" font-size="13">${d}</text><line x1="${x}" y1="38" x2="${x}" y2="70" stroke="var(--muted)" stroke-width="2"/>`:''}<rect x="${x-62}" y="72" width="124" height="38" rx="8" fill="${c}"/><text x="${x}" y="96" text-anchor="middle" font-size="12.5" font-weight="600" style="fill:#fff">${t}</text><line x1="${x}" y1="110" x2="${x}" y2="140" stroke="var(--muted)" stroke-width="2"/>`).join('')}
<line x1="20" y1="142" x2="620" y2="142" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/><text x="600" y="132" text-anchor="end" font-size="11" style="fill:var(--accent)">common bus</text>
<line x1="320" y1="145" x2="320" y2="182" stroke="var(--muted)" stroke-width="2"/><rect x="240" y="184" width="160" height="40" rx="8" fill="var(--c6)"/><text x="320" y="209" text-anchor="middle" font-weight="600" style="fill:#fff">Shared memory</text></svg></div>
<div class="card"><b>Bootstrap program:</b> the initial program a computer runs when powered up or rebooted. It is simple, stored in <b>ROM or EEPROM</b> (called <b>firmware</b>), initialises all aspects of the system — <b>CPU registers, device controllers, memory contents</b> — and must know how to load the operating system and start executing it. (Name: lifting yourself by your own bootlaces.)</div>
${tryBox('Boot the computer', `<div class="steps" id="bootSteps"></div><div class="stepbody" id="bootBody"></div>`)}
<h2>Functions of the OS (resource management)</h2>
<div class="card"><b>Definition:</b> <b>Resource management</b> is the OS function by which it keeps a track of every resource, decides which process gets a resource and for how long, and allocates and de-allocates it. <i>Same three actions for every resource: keep track → allocate → de-allocate.</i></div>
${table(['#','Function','What to write'],[['1','Memory management','Decides where program instructions go in memory; puts frequently needed parts in the fastest memory'],['2','Device management','With drivers, tracks all devices through the I/O controller; decides who gets a device and for how long; allocates and de-allocates'],['3','Processor management','Decides which process gets the CPU, when and for how long (process scheduling); the traffic controller tracks process status'],['4','File management','Tracks location, information and status of files (the file system); allocates and de-allocates'],['5','Security','Passwords and similar techniques stop unauthorised access'],['6','Error detection','Error-detecting aids help prevent errors'],['7','Coordination among software and users','Assigns compilers, assemblers, interpreters and other software to users'],['8','Job accounting','Keeps track of the resources and jobs used by different users']])}
<p class="muted">Trick: “My Devices Process Files Securely, Errors Caught, Jobs Counted”. If a paper says “any five”, take the first five.</p>
${tryBox('Process states: move the process', `<div class="u-ps"><svg viewBox="0 0 600 170" style="width:100%;max-height:190px"><defs><marker id="psA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>
<path d="M150 60 H250" stroke="var(--muted)" stroke-width="2" marker-end="url(#psA)"/><text x="200" y="52" text-anchor="middle" font-size="11" style="fill:var(--muted)">dispatch</text>
<path d="M250 80 H150" stroke="var(--muted)" stroke-width="2" marker-end="url(#psA)"/><text x="200" y="98" text-anchor="middle" font-size="11" style="fill:var(--muted)">time slice ends</text>
<path d="M340 95 Q380 140 420 130" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#psA)"/><text x="400" y="110" font-size="11" style="fill:var(--muted)">waits for I/O</text>
<path d="M440 150 Q260 175 90 100" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#psA)"/><text x="260" y="166" text-anchor="middle" font-size="11" style="fill:var(--muted)">I/O done</text>
${[['Ready',90,70],['Running',300,70],['Blocked',480,135]].map(([t,x,y])=>`<g data-st="${t}"><rect x="${x-60}" y="${y-22}" width="120" height="44" rx="22" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" font-weight="700">${t}</text></g>`).join('')}</svg>
<div class="row"><button class="btn ghost" data-ev="dispatch">Dispatch (give CPU)</button><button class="btn ghost" data-ev="timeout">Time slice ends</button><button class="btn ghost" data-ev="io">Request I/O</button><button class="btn ghost" data-ev="iodone">I/O completes</button></div><p class="u-psmsg muted"></p></div>`)}
<p>File access methods: sequential, random (direct), index sequential.</p>
${counts('four components · four objectives · three things the bootstrap initialises · three named controllers · eight OS functions · three process states · three file access methods · three actions per resource.')}
${model('What is the resource management function of the OS? Explain with a block diagram (5 marks)','OS definition + resource management definition → memory, processor (process scheduling, traffic controller), device (drivers, I/O controller), file (file system) management → same three actions for every resource → job accounting → resource/function/helper table → <b>diagram</b>: OS box in the centre, Processor, Main memory, I/O devices, Files around it with two-way arrows, Users and Application programs above → example: opening a file in MS Word uses all four.')}
${traps(['Writing three components and forgetting <b>users</b>.','Drawing the layers upside down — hardware at the bottom, users at the top.','Saying the bootstrap program is on the hard disk. It is in ROM/EEPROM (firmware).','Drawing devices connected straight to the CPU. They connect through controllers to the bus.','Forgetting the helpers: traffic controller (processor), I/O controller (devices).'])}`,
init(){
 stepper('#bootSteps','#bootBody',[
  ['1. Power on','The CPU starts with nothing loaded: RAM is empty (volatile). It must run something stored permanently.'],
  ['2. Run bootstrap','The bootstrap program runs from <b>ROM / EEPROM</b> — the firmware.'],
  ['3. Initialise','It initialises <b>CPU registers</b>, <b>device controllers</b> and <b>memory contents</b>.'],
  ['4. Load the OS','It finds the operating system on the disk and loads it into memory.'],
  ['5. Start the OS','It starts executing the OS. From now on the OS manages the computer ✅']]);
 const T={Ready:{dispatch:'Running'},Running:{timeout:'Ready',io:'Blocked'},Blocked:{iodone:'Ready'}};
 const W={Ready:'In memory, waiting for its turn on the CPU.',Running:'Has the CPU and is executing.',Blocked:'Waiting for something (usually I/O) before it can continue.'};
 let st='Ready'; const box=$('.u-ps');
 const draw=(msg)=>{$$('g[data-st]',box).forEach(g=>{const on=g.dataset.st===st;$('rect',g).setAttribute('stroke',on?'var(--accent)':'var(--line)');$('rect',g).setAttribute('fill',on?'var(--accent-soft)':'var(--panel)')});$('.u-psmsg',box).innerHTML=(msg?msg+' ':'')+`<b>${st}:</b> ${W[st]}`};
 $$('[data-ev]',box).forEach(b=>b.onclick=()=>{const n=T[st][b.dataset.ev];if(n){st=n;draw('<span class="ok">✓</span>');window.studyBuddy&&studyBuddy.sfx('tick')}else draw(`<span class="bad">✗ Not allowed from ${st}.</span>`)});
 draw();
},
keys:['OS = program that manages hardware, provides a basis for applications, intermediary between user and hardware (Windows, Linux).','4 objectives: convenient & efficient use, hide hardware details, convenient interface, intermediary. 4 components: hardware, OS, application programs, users.','Modern system: CPUs + device controllers (disk, USB, graphics) on a common bus with shared memory.','Bootstrap: first program at power-up, in ROM/EEPROM (firmware); initialises registers, controllers, memory; loads and starts the OS.','8 functions: memory, device, processor, file management, security, error detection, coordination, job accounting. Process states: ready, running, blocked.'],

{q:'Where is the bootstrap program stored?',o:['Hard disk','RAM','ROM or EEPROM (firmware)','Cache'],a:2,e:'It must survive with no power, so it is firmware.'},
{q:'Which is NOT initialised by the bootstrap program?',o:['CPU registers','Device controllers','Memory contents','Your Word documents'],a:3,e:'It initialises registers, controllers and memory, then loads the OS.'},
{q:'How many components does a computer system have (as per your notes)?',o:['3','4','5','6'],a:1,e:'Hardware, OS, application programs, users.'},
{q:'Process scheduling is part of…',o:['File management','Processor management','Job accounting','Security'],a:1,e:'Deciding which process gets the CPU, when and for how long.'},
{q:'A process waiting for I/O is in which state?',o:['Ready','Running','Blocked (waiting)','Terminated'],a:2,e:'It cannot continue until the I/O completes.'},

/* ---------- U2: types of OS, interfaces, modern OS ---------- */
{ id:'ostypes', unit:'1-2', level:'Applied', title:'Types of OS & user interfaces', desc:'Batch to embedded, multiprogramming vs multitasking, CLI vs GUI, popular OSes',
html:`
${simple('Each type of OS solved the problem left by the one before: batch kept the expensive machine busy, multiprogramming filled the waits, time-sharing gave everyone quick turns, multiprocessing added more CPUs. Real-time, distributed and embedded answer different needs.')}
<div class="card"><b>Definition:</b> Operating systems are classified according to how they handle jobs, users and time. The main types are batch, multiprogramming, multitasking, multiprocessing, time-sharing, real-time, distributed and embedded, and network OS is also listed — <b>nine</b> in all.</div>
${table(['Type','One line to write'],[['1. Batch','Similar jobs grouped into batches and run one after another, no user interaction'],['2. Multiprogramming','Several jobs kept in memory so the CPU always has something to execute'],['3. Multitasking','One user runs several tasks at once by rapid CPU switching'],['4. Multiprocessing','Two or more processors work in one system at the same time'],['5. Time-sharing','Each user gets a small fixed slice (quantum) of CPU time in turn'],['6. Real-time (RTOS)','Must respond within a fixed guaranteed time limit'],['7. Distributed','Many independent, loosely coupled computers on a network act as one system'],['8. Embedded','Small fixed-purpose OS built inside a device'],['9. Network','Runs on a server; manages users, data and security of a network']])}
<div class="card"><b>Memory tricks:</b> batch = a dhobi washing all clothes in one lot · multiprogramming = a barber starting the next customer while the first one’s dye sets · multitasking = one person juggling · time-sharing = a teacher giving each student two minutes · real-time = an airbag, late is useless.</div>
<h3>Batch OS</h3>
<ul><li>No direct user interaction while the job runs; jobs prepared offline (punch cards) and handed to the operator, who sorts them into batches.</li><li>A small resident program, the <b>monitor</b>, stays in memory and loads the next job automatically. Memory = monitor/OS area + one user program area.</li><li>Suits payroll and stock control.</li></ul>
${table(['Batch — advantages','Batch — disadvantages'],[['CPU kept busy; next job loaded automatically','No interaction while the job runs'],['Good for large, repetitive jobs','Long turnaround time'],['Less operator work','CPU may sit idle during slow I/O'],['Easy to manage, low cost','Hard to set priorities; urgent small job waits']])}
${table(['Point','Multiprogramming','Multitasking'],[['Users','Multi-user','Single user'],['Idea','Many jobs in memory so the CPU is never idle','One user’s tasks share the CPU by fast switching'],['Switch happens','When the running job waits for I/O','When a short time slice ends'],['Aim','Maximum CPU utilisation','Fast response to the user']])}
<p>Multiprogramming keeps waiting jobs in a <b>job pool</b> on disk; job scheduling picks which enters memory. Multitasking is <b>cooperative</b> (the program gives up the CPU) or <b>pre-emptive</b> (the OS takes it — modern systems).</p>
<h3>Multiprocessing</h3>
<p><b>Advantages (T-E-R-G, “Two Engines Run Great”):</b> increased Throughput · Economy of scale (shared memory/peripherals) · increased Reliability · Graceful degradation.</p>
${table(['Point','SMP (symmetric)','ASMP (asymmetric)'],[['Control','All processors equal peers','One master controls slaves'],['OS','Each processor runs a copy','Only the master runs the OS'],['If one CPU fails','Continues with reduced power','Master failure can stop the system']])}
${table(['Type','Points','Examples'],[['Time-sharing','Extension of multiprogramming switched by time (quantum), minimises response time; many users at terminals; overhead and data-security issues','Shared college server'],['Real-time','Late answer = failure; hard RTOS never misses a deadline, soft tolerates small delay; priority scheduling','Airbag, aircraft control, ICU monitor, robot'],['Distributed','Independent loosely coupled computers with own CPU and memory, communicating over a network, appearing as one; resource sharing, speed, reliability; the network can fail','Bank branches sharing one database'],['Embedded','Small, fixed purpose, in ROM/flash, little memory and power, often no keyboard/monitor, often real-time','Washing machine, microwave, ATM, camera, traffic lights']])}
${tryBox('Which OS type is it?', `<div id="osChoose"></div>`)}
<h2>User interfaces</h2>
<div class="card"><b>Definition:</b> A <b>user interface</b> is the part of the OS through which the user communicates with the computer. Two kinds: <b>CLI</b> (command line interface — type text commands) and <b>GUI</b> (graphical user interface — click windows, icons, menus and a pointer).</div>
${tryBox('Try both: do the same job in a CLI and a GUI', `<div class="grid"><div class="card" style="margin:0"><b>CLI</b><div class="u-term mono"><div class="u-tlog">C:\\&gt; type <b>help</b></div><div class="row"><span>C:\\&gt;</span><input type="text" class="u-tin mono" aria-label="command" style="flex:1"></div></div></div>
<div class="card" style="margin:0"><b>GUI</b><div class="row u-gui" style="margin-top:6px"><button class="btn ghost" data-g="dir">📁 Open folder</button><button class="btn ghost" data-g="date">📅 Clock</button><button class="btn ghost" data-g="cls">🧹 Clear</button></div><p class="u-gout muted" style="font-size:13px">Click an icon.</p></div></div>`)}
${table(['Point','CLI','GUI'],[['Input','Typed text commands','Mouse clicks and touch'],['Learning','Difficult — commands memorised','Easy — options shown'],['Memory needed','Less','More'],['Speed for an expert','Faster (and scriptable)','Slower'],['Multitasking view','One command at a time','Many windows at once'],['Example','Linux terminal, MS-DOS','Windows, macOS, Android']])}
<p class="muted">Trick: CLI = Chat by Letters Instantly · GUI = Give Us Icons.</p>
${table(['OS','Developer','Key features','File system','Used in'],[['Windows','Microsoft','GUI, huge software support, beginner friendly','NTFS','Home & office PCs'],['Linux','Community, open source','Free, stable, secure, customisable','ext4','Servers, supercomputers'],['macOS','Apple','Stable, strong graphics/media, Apple ecosystem','APFS','Mac computers'],['Android','Google','Open source, touch, huge app store','ext4 / F2FS','Phones, tablets'],['iOS','Apple','Closed, smooth, secure, Apple hardware only','APFS','iPhone, iPad']])}
<p>Windows and macOS are proprietary; Linux and Android are open source; Android is built on the Linux kernel.</p>
<h3>Modern OS: strengths and limitations</h3>
${table(['Comparative strength','Matching limitation'],[['Pre-emptive multitasking — one bad program can’t freeze the machine','Switching overhead'],['GUI — nothing to memorise','More memory and processing than a CLI'],['Security — passwords keep intruders out','Security/reliability issues when many users share a machine'],['Virtual memory — programs bigger than RAM run','Disk is slower than RAM'],['Device independence through drivers','A missing/wrong driver makes hardware unusable'],['Virtualization support','The host is a single point of failure'],['Networking & cloud — share and scale','Almost unusable offline']])}
${counts('nine OS types · batch 4 advantages / 4 disadvantages · two kinds of multitasking · four multiprocessing advantages · two kinds of multiprocessing · two user interfaces · five popular OSes · seven strength/limitation pairs.')}
${model('Differentiate between multiprogramming and multitasking (5 marks)','Define both → multi-user vs single user → job pool and job scheduling → switch on I/O wait vs time slice → cooperative vs pre-emptive multitasking → aims (CPU utilisation vs fast response) → table → example: shared college server vs your laptop playing music while you type.')}
${traps(['Saying multitasking is multi-user. It is single user; multiprogramming is multi-user.','Writing multiprocessing when you mean multiprogramming. Multiprocessing needs 2+ CPUs.','Describing RTOS as “a fast OS”. The point is a guaranteed deadline.','Forgetting “loosely coupled” in the distributed OS answer.','Saying a GUI is faster. A CLI is faster for an expert and uses less memory.'])}`,

},

/* ---------- U2: virtualization & cloud ---------- */
{ id:'virt', unit:'1-2', level:'Applied', title:'Virtualization & cloud computing', desc:'Hypervisors, Type 1 vs 2, containers, IaaS/PaaS/SaaS, cloud OS',
html:`
${simple('Virtualization slices one real computer into many “pretend” computers (like one pizza, many slices). The cloud rents you those slices over the internet, so the hardware is somewhere else — but it still exists!')}
<div class="card"><b>Definition:</b> <b>Virtualization</b> is the <b>abstraction</b> of computer resources. It hides the physical characteristics of computing resources from their users, be they applications or end users.</div>
<ul><li>It makes a single physical resource (server, OS, application, storage device) appear as <b>multiple</b> virtual resources — and can also make <b>multiple</b> physical resources appear as <b>one</b>.</li><li>Normal layers: Hardware → OS → Applications. With virtualization a <b>hypervisor</b> is inserted between the hardware and the OS.</li><li>Each guest OS with its applications is a <b>virtual machine (VM)</b>; a ready-made one is a <b>virtual appliance</b>. Virtualization is the technology the cloud is built on.</li></ul>
<div class="card"><b>Hypervisor:</b> a software program that manages multiple operating systems, or multiple instances of the same OS, on a single computer. It manages the processor, memory and other resources and allocates what each OS needs. Designed for a particular processor architecture; also called a <b>virtualization manager</b>.</div>
${tryBox('Build the stack', `<div class="tabs" id="vTabs"></div><div class="svgbox"><svg id="vSvg" viewBox="0 0 600 250" role="img" aria-label="Virtualization stack"></svg></div><div class="stepbody" id="vInfo"></div>`)}
${table(['Point','Type 1 (bare metal)','Type 2 (hosted)'],[['Installed on','Directly on the hardware','On top of a host OS'],['Host OS needed','No','Yes'],['Performance','Faster','Slower (requests pass through the host OS)'],['Typical use','Data centres, production servers','Personal computers, testing, learning'],['Examples','VMware ESXi, Microsoft Hyper-V','VMware Workstation, Oracle VirtualBox']])}
${table(['Type of virtualization','What is virtualized'],[['Virtual memory','Disk space used as main memory'],['Desktop','A whole desktop runs on a remote server'],['Platform','A whole machine/server — most related to cloud computing'],['Storage','Many storage devices appear as one pool'],['Network','One physical network divided into logical networks'],['Application','An app runs without local installation (portable app, hosted virtual desktop)']])}
<p class="muted">Platform virtualization sub-types: full, para-, hardware-assisted, partial, OS-level, hosted environment (e.g. user-mode Linux). Levels: hardware, operating system, application.</p>
<div class="card"><b>OS-level virtualization:</b> server virtualization at the OS (kernel) layer — one kernel allows multiple isolated user-space instances (<b>containers</b>), each looking and feeling like a real server. Layers: hardware → standard host OS → OS virtualization layer → containers. Live migration allows load balancing between nodes.<br><b>Don’t confuse:</b> <i>OS-level virtualization</i> = one kernel shared by many partitions; <i>operating system virtualization</i> = hardware runs several <b>different</b> OSes at once without interference.</div>
${table(['Point','Virtual machine','Container'],[['Operating systems','Each has its own full OS','All share one host kernel'],['Layer used','Hypervisor','OS virtualization layer'],['Start-up / size','Large, slower','Small, quick'],['Mixing OS types','Can run different OSes','All use the same kernel']])}
${table(['Benefits of virtualization','Limitations'],[['One server does the work of many → lower hardware cost','Single point of failure — host fails, all VMs fail'],['Better use of idle resources','Some performance overhead'],['VMs isolated; one crash doesn’t affect others','Complex to set up and manage'],['Easy backup, copying and moving of machines','Needs powerful host with lots of RAM'],['Different OSes on one machine','Licensing many guest OSes can be costly']])}
<h2>Cloud computing</h2>
<div class="card"><b>Definition:</b> <b>Cloud computing</b> is the delivery of computing resources such as storage, computing power and software to users over the internet, from large remote data centres, instead of from the user’s own computer.</div>
<ul><li>You rent instead of buying and maintaining hardware; scale up or down on demand (scalability).</li><li>Built on virtualization: providers use hypervisors to divide huge servers among customers.</li><li>Five parts: hardware (data centres, client devices), software (AWS, Azure), networking (internet), users (businesses, developers, end-users), services (storage, computing power, AI tools).</li></ul>
${tryBox('Who manages what? (IaaS · PaaS · SaaS)', `<div class="tabs" id="cTabs"></div><div id="cBody"></div>`)}
<div class="card"><b>Cloud-based OS environment:</b> applications and data are kept mainly on remote servers and reached over the internet, so the local device only needs enough software to connect, display and input. Cheap low-power devices, automatic updates, log in from anywhere — but almost unusable offline, and you must trust the provider.<br><b>Examples:</b> <b>Chrome OS</b> (Chromebooks, web apps, Google Drive) and <b>Windows 365</b> (a full Windows desktop streamed from Microsoft’s servers).</div>
${counts('two hypervisor types · six types of virtualization · six platform sub-types · three levels · four OS-level layers · five cloud parts · three service models · two cloud OSes.')}
${model('What is virtualization? Explain with a diagram and differentiate Type 1 and Type 2 hypervisors (5 marks)','Definition (abstraction!) → one-to-many AND many-to-one → hypervisor definition → layers with hypervisor inserted → Type 1 on hardware, faster, data centres → Type 2 on host OS, slower, PCs → table → <b>diagram</b>: normal stack vs hypervisor with 2–3 OS+app pairs → example: one server running Windows, Linux and a database as three VMs.')}
${traps(['Defining virtualization as “making a virtual computer”. The key word is <b>abstraction</b>.','Giving only one-becomes-many; many-becomes-one is also in the definition.','Confusing OS-level virtualization with operating system virtualization.','Saying the cloud has no hardware — it is somebody else’s hardware.','Naming AWS or Azure as cloud OSes. They are cloud platforms; Chrome OS and Windows 365 are cloud OSes.'])}`,
